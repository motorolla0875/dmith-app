<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Te mandaron un juego</title>
<meta property="og:title" content="Te mandaron un juego">
<meta property="og:description" content="Alguien hizo un juego especialmente para vos. Tocá para jugar.">
<meta property="og:image" content="https://dmith.app/juego/img/og.png">
<meta name="theme-color" content="#1a0f2e">
<style>
  html, body { margin:0; height:100%; background:#1a0f2e; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #espera { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff8; font:600 16px system-ui, sans-serif; }
  .giro { width:42px; height:42px; border-radius:50%; border:4px solid #fff3; border-top-color:#ff5d8f; animation:g 0.9s linear infinite; }
  @keyframes g { to { transform:rotate(360deg) } }
</style>
</head>
<body>
<div id="espera"><div class="giro"></div></div>
<script>
// La página del juego: busca los datos por el código del link y abre la plantilla que corresponde.
const id = (location.pathname.match(/\/j\/([a-z0-9]{6})/) || [])[1] || new URLSearchParams(location.search).get('id');
const CARPETA = { amor: 'amor', cumple: 'amor', ruleta: 'ruleta' };
function mostrar(plantilla, mensaje) {
  const f = document.createElement('iframe');
  f.allow = 'autoplay; vibrate';
  f.src = `/juego/plantillas/${CARPETA[plantilla] || 'amor'}/?p=${plantilla}`;
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== f.contentWindow || !e.data || e.data.juego !== 'listo') return;
    f.contentWindow.postMessage(mensaje, location.origin);
    document.getElementById('espera').remove();
  });
  document.body.appendChild(f);
}
if (!id) mostrar('amor', { juego: 'inactivo', texto: 'El link está incompleto.' });
else fetch(`/juego/api/juego/${id}`).then(r => r.json()).then(j => {
  if (!j.plantilla) return mostrar('amor', { juego: 'inactivo', texto: 'Revisá que el link esté bien copiado.' });
  if (!j.activo) return mostrar(j.plantilla, { juego: 'inactivo', texto: j.oculto ? 'Este juego fue pausado para revisión.' : 'Todavía no fue activado por quien lo creó.' });
  mostrar(j.plantilla, { juego: 'datos', plantilla: j.plantilla, datos: j.datos, vista: false, id: j.id, reiniciar: true });
}).catch(() => mostrar('amor', { juego: 'inactivo', texto: 'No hay conexión. Probá de nuevo en un ratito.' }));
</script>
</body>
</html>
