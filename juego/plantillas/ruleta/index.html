<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Girá y ganá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --c:#f2b65a; --f:#2b1a12; --t:#fff7ec; }
  html, body { margin:0; min-height:100%; background:var(--f); color:var(--t); font-family:'Poppins', system-ui, sans-serif; -webkit-user-select:none; user-select:none; overflow-x:hidden; }
  body { background:radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--c) 28%, var(--f)), var(--f) 70%); min-height:100vh; }
  .pagina { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:max(18px, env(safe-area-inset-top)) 16px 40px; box-sizing:border-box; text-align:center; }
  .logo { width:80px; height:80px; object-fit:cover; border-radius:50%; box-shadow:0 8px 24px rgba(0,0,0,.4); background:rgba(255,255,255,.1); }
  h1 { margin:0; font-size:clamp(28px, 8.5vw, 46px); font-weight:800; line-height:1; letter-spacing:-.5px; overflow-wrap:anywhere; }
  .sub { margin:0; opacity:.8; font-size:15px; font-weight:600; }
  .rueda { position:relative; width:min(86vw, 400px, 52vh); aspect-ratio:1; margin-top:6px; }
  .rueda canvas { width:100%; height:100%; display:block; }
  .aguja { position:absolute; left:50%; top:-10px; width:34px; height:44px; transform:translateX(-50%); z-index:2; filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)); }
  .centro { position:absolute; left:50%; top:50%; width:22%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
    background:var(--f); border:5px solid var(--c); overflow:hidden; }
  .centro img { width:100%; height:100%; object-fit:cover; display:block; }
  .boton { border:0; border-radius:999px; padding:15px 46px; font:800 22px 'Poppins', system-ui, sans-serif; color:var(--f); background:var(--c);
    box-shadow:0 6px 0 rgba(0,0,0,.35), 0 14px 26px rgba(0,0,0,.35); cursor:pointer; letter-spacing:1px; }
  .boton:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .boton:disabled { opacity:.5; }
  .boton.linea { background:transparent; color:var(--f); border:2px solid rgba(0,0,0,.25); box-shadow:none; font-size:15px; padding:11px 22px; }
  .chico { font-size:12px; opacity:.55; max-width:360px; margin:0; }
  #capa { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; box-sizing:border-box; z-index:9; backdrop-filter:blur(3px); }
  .oculto { display:none !important; }
  .cupon { text-align:center; background:var(--t); color:var(--f); width:100%; max-width:380px; border-radius:24px; padding:22px 20px 20px; box-sizing:border-box;
    position:relative; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:entra .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes entra { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  .cupon .tag { font-size:14px; font-weight:800; letter-spacing:3px; opacity:.7; }
  .cupon .premio { font-size:clamp(30px, 10vw, 44px); font-weight:800; line-height:1.05; margin:6px 0 10px; overflow-wrap:anywhere; }
  .corte { border-top:3px dashed rgba(0,0,0,.18); margin:14px -20px; position:relative; }
  .corte::before, .corte::after { content:""; position:absolute; top:-14px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.6); }
  .corte::before { left:-13px } .corte::after { right:-13px }
  .codigo { font-size:30px; font-weight:800; letter-spacing:4px; background:var(--f); color:var(--c); border-radius:14px; padding:8px 0; }
  .reloj { font-size:15px; font-weight:600; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .punto { width:10px; height:10px; border-radius:50%; background:#1fbf6a; animation:late 1s infinite; }
  @keyframes late { 50% { opacity:.25 } }
  .cupon .chico { opacity:.7; margin:10px auto 14px; }
  .marca { position:fixed; bottom:max(8px, env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:12px; opacity:.55; }
  .marca a { color:inherit; }
  .marca button { background:none; border:0; color:inherit; font:inherit; text-decoration:underline; cursor:pointer; padding:0 0 0 10px; }
  #denuncia { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10; }
  #denuncia > div { background:#fff; color:#222; border-radius:18px; padding:20px; max-width:340px; width:100%; font-family:system-ui, sans-serif; text-align:left; }
  #denuncia select, #denuncia button { width:100%; font-size:16px; padding:10px; border-radius:10px; margin-top:10px; }
</style>
</head>
<body>
<div class="pagina" id="pagina">
  <img class="logo" id="logo" alt="">
  <h1 id="titulo"></h1>
  <p class="sub" id="sub"></p>
  <div class="rueda">
    <svg class="aguja" viewBox="0 0 34 44"><path d="M17 44 L2 8 A16 16 0 0 1 32 8 Z" fill="#fff"/><circle cx="17" cy="14" r="6" fill="var(--c)"/></svg>
    <canvas id="c"></canvas>
    <div class="centro"><img id="logo2" alt=""></div>
  </div>
  <button class="boton" id="girar">GIRAR</button>
  <p class="chico" id="legal"></p>
</div>
<div class="pagina oculto" id="inactivo"><h1>Esta ruleta no está disponible</h1><p class="sub" id="inactivo_txt"></p></div>

<div id="capa" class="oculto"><div class="cupon" id="cupon"></div></div>

<div class="marca oculto" id="marca">Hacé la tuya en <a href="https://dmith.app/juego" target="_blank" rel="noopener">dmith.app/juego</a><button id="denunciar">Denunciar</button></div>
<div id="denuncia" class="oculto"><div>
  <b>¿Qué pasa con esta ruleta?</b>
  <select id="motivo"><option>Contenido ofensivo</option><option>No me dieron el premio</option><option>Es una estafa</option><option>Otro</option></select>
  <button id="enviar_den">Enviar aviso</button><button id="cerrar_den" style="background:#eee;border:0">Cancelar</button>
</div></div>

<script>
// ─── Ruleta de premios: los datos llegan del editor (vista previa) o del servidor ───
const $ = id => document.getElementById(id);
let D = {}, P = [], N = 0, PASO = 1, ID = null, VISTA = true;
const LOGO_VACIO = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffffff" opacity=".12"/><path d="M30 64h40M36 64V44l14-10 14 10v20" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/></svg>');
const DEF = { local: 'Tu local', titulo: 'Girá y ganá', color: '#f2b65a', fondo: '#2b1a12', instagram: '', prefijo: 'PREMIO',
  vence: 'Válido hoy, presentando esta pantalla en caja.', una_por_dia: true, logo: '',
  premios: [{ texto: '10% OFF', peso: 30 }, { texto: 'Seguí participando', peso: 30, pierde: true }, { texto: 'Regalo sorpresa', peso: 10 }, { texto: '2x1', peso: 20 }] };

function aplicar(datos, op) {
  D = Object.assign({}, DEF, datos || {});
  P = (D.premios || []).filter(p => p && p.texto); if (P.length < 2) P = DEF.premios;
  N = P.length; PASO = Math.PI * 2 / N;
  const r = document.documentElement.style; r.setProperty('--c', D.color); r.setProperty('--f', D.fondo);
  $('logo').src = $('logo2').src = D.logo || LOGO_VACIO;
  $('titulo').textContent = D.titulo || 'Girá y ganá';
  $('sub').textContent = D.local;
  $('legal').textContent = (D.una_por_dia ? 'Una tirada por persona por día. ' : '') + 'Premios sujetos a disponibilidad del local.';
  document.title = `${D.titulo} · ${D.local}`;
  if (op) {
    VISTA = !!op.vista; ID = op.id || null; $('marca').classList.toggle('oculto', VISTA);
    if (op.ir === 'cupon') mostrar({ premio: (P.find(p => !p.pierde) || P[0]).texto, codigo: D.prefijo + '-7KQ4' }, false);
    else $('capa').classList.add('oculto');
  }
  $('girar').textContent = (!VISTA && D.una_por_dia && previo()) ? 'VER MI PREMIO' : 'GIRAR';
  medir();
}

// ─── memoria de la tirada de hoy ───
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const CLAVE = () => 'ruleta_' + (ID || 'vista');
function previo() { try { const v = JSON.parse(localStorage.getItem(CLAVE()) || 'null'); return v && v.dia === hoy() ? v : null; } catch (e) { return null; } }
function guardar(v) { try { localStorage.setItem(CLAVE(), JSON.stringify(v)); } catch (e) {} }

let ac = null;
function bip(f, t = .05, tipo = 'triangle', vol = .1) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f; g.gain.value = vol; o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t); o.start(); o.stop(ac.currentTime + t);
  } catch (e) {}
}

// ─── rueda ───
const cv = $('c'), cx = cv.getContext('2d');
let R = 0, ang = 0;
function rgb(s) { return [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); }
function mezclar(a, b, k) { const x = rgb(a), y = rgb(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',')})`; }
function colorDe(i) {
  if (P[i].pierde) return mezclar(D.fondo, '#000000', .15);
  const ganadores = P.map((p, j) => p.pierde ? -1 : j).filter(j => j >= 0), k = ganadores.indexOf(i) % 4;
  return [D.color, mezclar(D.color, D.fondo, .5), '#fff7ec', mezclar(D.color, '#ffffff', .45)][k];
}
function oscuro(c) { const m = c.match(/\d+/g); return (m[0] * .3 + m[1] * .59 + m[2] * .11) < 140; }
function medir() {
  const dpr = Math.min(3, devicePixelRatio || 1), w = cv.getBoundingClientRect().width || 300;
  cv.width = cv.height = w * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); R = w / 2; pintar();
}
function partir(t) { // corta en 2 líneas si es largo
  t = t.toUpperCase(); if (t.includes('\n')) return t.split('\n').slice(0, 2);
  if (t.length < 11) return [t];
  const p = t.split(' '); if (p.length < 2) return [t];
  let mejor = [t], dif = 1e9;
  for (let i = 1; i < p.length; i++) { const a = p.slice(0, i).join(' '), b = p.slice(i).join(' '); if (Math.abs(a.length - b.length) < dif) { dif = Math.abs(a.length - b.length); mejor = [a, b]; } }
  return mejor;
}
function pintar() {
  if (!R) return;
  cx.clearRect(0, 0, R * 2, R * 2); cx.save(); cx.translate(R, R);
  cx.fillStyle = mezclar(D.fondo, '#000000', .3); cx.beginPath(); cx.arc(0, 0, R - 1, 0, 7); cx.fill();
  const luces = Math.max(16, N * 2), parpa = Math.floor(Date.now() / 260) % 2;
  for (let i = 0; i < luces; i++) {
    const a = i / luces * Math.PI * 2; cx.fillStyle = (i % 2) === parpa ? '#fff3c4' : 'rgba(255,255,255,.25)';
    cx.beginPath(); cx.arc(Math.cos(a) * (R - 9), Math.sin(a) * (R - 9), 4, 0, 7); cx.fill();
  }
  const r = R - 18; cx.rotate(ang);
  for (let i = 0; i < N; i++) {
    const a0 = -Math.PI / 2 - PASO / 2 + i * PASO, col = colorDe(i);
    cx.fillStyle = col; cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, r, a0, a0 + PASO); cx.closePath(); cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,.18)'; cx.lineWidth = 2; cx.stroke();
    cx.save(); cx.rotate(a0 + PASO / 2); cx.fillStyle = oscuro(col) ? '#fff7ec' : D.fondo; cx.textAlign = 'right'; cx.textBaseline = 'middle';
    const lineas = partir(P[i].texto); let fs = r * .1;
    cx.font = `800 ${fs}px Poppins, system-ui, sans-serif`;
    const mayor = Math.max(...lineas.map(l => cx.measureText(l).width));
    fs = Math.max(8, Math.min(fs, fs * r * .6 / mayor, r * PASO * .42 / lineas.length));
    cx.font = `800 ${fs}px Poppins, system-ui, sans-serif`;
    lineas.forEach((l, j) => cx.fillText(l, r - 14, (j - (lineas.length - 1) / 2) * fs * 1.05));
    cx.restore();
  }
  cx.restore();
}
addEventListener('resize', medir);

let girando = false;
function elegir() {
  const total = P.reduce((s, p) => s + (+p.peso || 0), 0); if (!total) return Math.floor(Math.random() * N);
  let x = Math.random() * total;
  for (let i = 0; i < N; i++) { x -= (+P[i].peso || 0); if (x < 0) return i; }
  return N - 1;
}
function girar() {
  if (girando) return;
  const ya = !VISTA && D.una_por_dia && previo();
  if (ya) { mostrar(ya); return; }
  girando = true; $('girar').disabled = true; $('capa').classList.add('oculto');
  const gana = elegir();
  const destino = -gana * PASO + (Math.random() - .5) * PASO * .6;
  const inicio = ang, vueltas = 6 + Math.floor(Math.random() * 2);
  const fin = inicio + ((destino - inicio) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2) + vueltas * Math.PI * 2;
  const dur = 5200, t0 = Date.now();
  let ultimo = Math.floor((inicio + PASO / 2) / PASO);
  (function paso() {
    const k = Math.min(1, (Date.now() - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    ang = inicio + (fin - inicio) * e; pintar();
    const s = Math.floor((ang + PASO / 2) / PASO);
    if (s !== ultimo) { ultimo = s; bip(900 + Math.random() * 120, .035, 'square', .05); }
    if (k < 1) requestAnimationFrame(paso);
    else {
      girando = false;
      const res = { dia: hoy(), premio: P[gana].texto, pierde: !!P[gana].pierde, codigo: codigo() };
      if (!VISTA) {
        guardar(res);
        if (ID) fetch(`/juego/api/tiro/${ID}`, { method: 'POST', body: JSON.stringify({ premio: res.pierde ? 'Sin premio' : res.premio }) }).catch(() => {});
      }
      setTimeout(() => mostrar(res, true), 350);
    }
  })();
}
function codigo() { const L = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += L[Math.floor(Math.random() * L.length)]; return `${D.prefijo}-${s}`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let relojIv = null;
function mostrar(res, nuevo) {
  const c = $('cupon');
  const ig = D.instagram ? `<button class="boton linea" id="ig">SEGUINOS EN INSTAGRAM</button>` : '';
  if (res.pierde) {
    c.innerHTML = `<div class="tag">${esc(D.local.toUpperCase())}</div><div class="premio">¡Uy, casi!</div>
      <p class="chico">Hoy no tocó premio.${D.una_por_dia ? ' Volvé mañana y probá de nuevo.' : ''}</p>${ig}`;
    if (nuevo) bip(220, .3, 'sawtooth', .06);
  } else {
    c.innerHTML = `<div class="tag">GANASTE</div><div class="premio">${esc(res.premio)}</div><div class="corte"></div>
      <div class="codigo">${esc(res.codigo)}</div><div class="reloj"><span class="punto"></span><span id="hora"></span></div>
      <p class="chico">${esc(D.vence)}</p>${ig}`;
    if (nuevo) [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, .2, 'triangle', .13), i * 120));
    clearInterval(relojIv);
    const pon = () => { const h = $('hora'); if (h) h.textContent = new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
    pon(); relojIv = setInterval(pon, 1000);
  }
  if ($('ig')) $('ig').onclick = () => window.open(D.instagram, '_blank', 'noopener');
  $('capa').classList.remove('oculto'); $('girar').disabled = false;
  $('girar').textContent = (!VISTA && D.una_por_dia) ? 'VER MI PREMIO' : 'GIRAR';
}
$('capa').addEventListener('click', e => { if (e.target.id === 'capa') $('capa').classList.add('oculto'); });
$('girar').addEventListener('click', girar);

$('denunciar').addEventListener('click', () => $('denuncia').classList.remove('oculto'));
$('cerrar_den').addEventListener('click', () => $('denuncia').classList.add('oculto'));
$('enviar_den').addEventListener('click', () => {
  if (ID) fetch(`/juego/api/denunciar/${ID}`, { method: 'POST', body: JSON.stringify({ motivo: $('motivo').value }) }).catch(() => {});
  $('denuncia').querySelector('div').innerHTML = '<b>Gracias. Lo vamos a revisar.</b>';
  setTimeout(() => $('denuncia').classList.add('oculto'), 1500);
});

addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.juego === 'datos') aplicar(e.data.datos, { vista: e.data.vista, id: e.data.id, ir: e.data.ir });
  if (e.data.juego === 'inactivo') { $('pagina').classList.add('oculto'); $('inactivo').classList.remove('oculto'); $('inactivo_txt').textContent = e.data.texto || ''; }
});
aplicar(null, { vista: true });
(function luces() { if (!girando) pintar(); setTimeout(() => requestAnimationFrame(luces), 260); })();
if (parent !== window) parent.postMessage({ juego: 'listo' }, location.origin);
</script>
</body>
</html>
