<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Un juego para vos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --a:#ff4f7b; --b:#ffb3c7; --f1:#2b0f3a; --f2:#7a1f5c; --t:#fff7f0; }
  html, body { margin:0; height:100%; background:var(--f1); overflow:hidden; touch-action:none;
    font-family:'Baloo 2', system-ui, sans-serif; color:var(--t); -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .capa { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; box-sizing:border-box; gap:14px; }
  .oculto { display:none !important; }
  .foto { width:44vmin; height:44vmin; max-width:230px; max-height:230px; border-radius:50%; object-fit:cover;
    border:6px solid var(--t); box-shadow:0 0 0 6px var(--a), 0 18px 40px rgba(0,0,0,.45); background:rgba(255,255,255,.15); }
  .foto.vacia { object-fit:contain; }
  h1 { margin:0; font-size:clamp(30px, 9vw, 54px); line-height:1.02; font-weight:800; text-shadow:0 4px 0 rgba(0,0,0,.25); overflow-wrap:anywhere; }
  .sub { margin:0; font-size:clamp(17px, 4.8vw, 24px); opacity:.9; font-weight:600; }
  .boton { border:0; border-radius:999px; padding:14px 38px; font:800 clamp(20px,6vw,28px) 'Baloo 2', system-ui, sans-serif;
    color:#fff; background:var(--a); box-shadow:0 6px 0 rgba(0,0,0,.28), 0 14px 26px rgba(0,0,0,.35); cursor:pointer; }
  .boton:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.28); }
  .boton.claro { background:#ffffff; color:#3a1a3a; }
  #mensaje { font-size:clamp(19px, 5.4vw, 28px); line-height:1.3; max-width:560px; min-height:2em; white-space:pre-line; font-weight:600;
    background:rgba(10,4,20,.5); border-radius:22px; padding:16px 20px; box-sizing:border-box; overflow-wrap:anywhere; }
  #botones { display:flex; gap:18px; position:relative; width:100%; max-width:520px; justify-content:center; min-height:70px; }
  #no { position:relative; transition:transform .18s ease; }
  #respuesta { font-size:clamp(22px,6.2vw,32px); font-weight:800; background:var(--a); border-radius:18px; padding:10px 22px; }
  .hud { position:fixed; top:max(14px, env(safe-area-inset-top)); left:16px; right:16px; display:flex; align-items:center; gap:12px; pointer-events:none; }
  .barra { flex:1; height:16px; background:rgba(255,255,255,.22); border-radius:99px; overflow:hidden; }
  .barra > div { height:100%; width:0%; background:linear-gradient(90deg, var(--b), var(--a)); border-radius:99px; transition:width .2s; }
  .vidas { font-weight:800; font-size:20px; min-width:64px; text-align:right; letter-spacing:2px; }
  .chico { font-size:15px; opacity:.75; margin:4px 0 0; max-width:420px; }
  .marca { position:fixed; bottom:max(10px, env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:13px; opacity:.6; }
  .marca a { color:inherit; }
  .marca button { background:none; border:0; color:inherit; font:inherit; text-decoration:underline; cursor:pointer; padding:0 0 0 10px; }
  #denuncia { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:20px; z-index:9; }
  #denuncia > div { background:#fff; color:#222; border-radius:18px; padding:20px; max-width:340px; width:100%; font-family:system-ui, sans-serif; text-align:left; }
  #denuncia select, #denuncia button { width:100%; font-size:16px; padding:10px; border-radius:10px; margin-top:10px; }
  #inactivo h1 { font-size:30px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud oculto" id="hud"><div class="barra"><div id="progreso"></div></div><div class="vidas" id="vidas"></div></div>

<div class="capa" id="inicio">
  <img class="foto" id="foto1" alt="">
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <button class="boton" id="jugar">JUGAR</button>
  <p class="chico" id="ayuda"></p>
</div>

<div class="capa oculto" id="perdio">
  <h1>¡Casi!</h1>
  <p class="sub">Te falta poquito. Probá otra vez.</p>
  <button class="boton" id="otra">OTRA VEZ</button>
</div>

<div class="capa oculto" id="final">
  <img class="foto" id="foto2" alt="">
  <h1 id="titulo_final"></h1>
  <div id="mensaje"></div>
  <div id="botones" class="oculto">
    <button class="boton" id="si">SÍ</button>
    <button class="boton claro" id="no">NO</button>
  </div>
  <p class="sub oculto" id="respuesta"></p>
  <button class="boton claro oculto" id="denuevo" style="font-size:18px;padding:10px 26px">JUGAR DE NUEVO</button>
</div>

<div class="capa oculto" id="inactivo"><h1>Este juego no está disponible</h1><p class="sub" id="inactivo_txt"></p></div>

<div class="marca oculto" id="marca">Hacé el tuyo en <a href="https://dmith.app/juego" target="_blank" rel="noopener">dmith.app/juego</a><button id="denunciar">Denunciar</button></div>
<div id="denuncia" class="oculto"><div>
  <b>¿Qué pasa con este juego?</b>
  <select id="motivo"><option>Contenido ofensivo</option><option>Usa mi foto sin permiso</option><option>Es una estafa</option><option>Otro</option></select>
  <button id="enviar_den">Enviar aviso</button><button id="cerrar_den" style="background:#eee;border:0">Cancelar</button>
</div></div>

<script>
// ─── Juego de amor / cumpleaños: los datos llegan del editor (vista previa) o del servidor ───
const $ = id => document.getElementById(id);
const MODOS = {
  amor:   { titulo: 'Un juego para {para}', final: '¡{para}!', ayuda: 'Mové la foto y atrapá todo lo que cae. Esquivá las nubes.' },
  cumple: { titulo: '¡Feliz cumple, {para}!', final: '¡Feliz cumple!', ayuda: 'Mové la foto y atrapá todo lo que cae. Esquivá las nubes.' }
};
let D = {}, M = MODOS.amor, ID = null, VISTA = true;
const img = new Image();
const FOTO_VACIA = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="38" r="18" fill="#fff" opacity=".7"/><path d="M18 88c4-20 18-28 32-28s28 8 32 28z" fill="#fff" opacity=".7"/></svg>');

function aplicar(plantilla, datos, opciones) {
  M = MODOS[plantilla] || MODOS.amor;
  D = Object.assign({ para: 'vos', de: '', titulo: '', mensaje: '', pregunta: '', respuesta_si: '', frases: [], meta: 15,
    color: '#ff4f7b', fondo1: '#2b0f3a', fondo2: '#7a1f5c', objeto: 'corazon', foto: '' }, datos || {});
  D.meta = Math.max(5, Math.min(40, +D.meta || 15));
  const r = document.documentElement.style;
  r.setProperty('--a', D.color); r.setProperty('--b', mezclar(D.color, '#ffffff', .55));
  r.setProperty('--f1', D.fondo1); r.setProperty('--f2', D.fondo2);
  const para = D.para || 'vos';
  $('titulo').textContent = D.titulo || (D.para || plantilla !== 'cumple' ? M.titulo.replace('{para}', para) : '¡Feliz cumple!');
  $('subtitulo').textContent = D.de ? `de ${D.de}` : '';
  $('ayuda').textContent = M.ayuda;
  document.title = $('titulo').textContent;
  const src = D.foto || FOTO_VACIA;
  if (img.src !== src) img.src = src;
  for (const f of [$('foto1'), $('foto2')]) { f.src = src; f.classList.toggle('vacia', !D.foto); }
  if (opciones) {
    VISTA = !!opciones.vista; ID = opciones.id || null;
    $('marca').classList.toggle('oculto', VISTA);
    if (opciones.ir === 'final') { ganar(true); return; }
    if (opciones.ir === 'inicio' || opciones.reiniciar) volverAlInicio();
  }
}
function volverAlInicio() {
  estado = 'inicio'; cosas = []; conf = [];
  for (const id of ['hud', 'perdio', 'final', 'inactivo']) $(id).classList.add('oculto');
  $('inicio').classList.remove('oculto');
}
function mezclar(a, b, k) {
  const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const x = h(a), y = h(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join('');
}

// ─── sonidos ───
let ac = null;
function bip(f, t = .09, tipo = 'sine', vol = .12) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f; g.gain.value = vol; o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t); o.start(); o.stop(ac.currentTime + t);
  } catch (e) {}
}

// ─── lienzo ───
const cv = $('c'), cx = cv.getContext('2d');
let W = 0, H = 0;
function medir() { const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', medir); medir();
const fondo = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .4, v: Math.random() * .02 + .005 }));

// ─── dibujos de lo que cae ───
function corazon(x, y, s, col) {
  cx.save(); cx.translate(x, y); cx.scale(s / 30, s / 30); cx.fillStyle = col;
  cx.beginPath(); cx.moveTo(0, 10); cx.bezierCurveTo(-26, -8, -14, -30, 0, -16); cx.bezierCurveTo(14, -30, 26, -8, 0, 10); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.45)'; cx.beginPath(); cx.ellipse(-8, -14, 4, 6, -.6, 0, 7); cx.fill(); cx.restore();
}
function estrella(x, y, s, col, rot) {
  cx.save(); cx.translate(x, y); cx.rotate(rot); cx.fillStyle = col; cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? s * .42 : s; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.closePath(); cx.fill(); cx.restore();
}
function moneda(x, y, s) {
  cx.save(); cx.translate(x, y); cx.fillStyle = '#c98a10'; cx.beginPath(); cx.arc(0, 2, s, 0, 7); cx.fill();
  cx.fillStyle = '#ffcc33'; cx.beginPath(); cx.arc(0, 0, s, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.lineWidth = s * .14; cx.beginPath(); cx.arc(0, 0, s * .62, 0, 7); cx.stroke(); cx.restore();
}
function flor(x, y, s, col, rot) {
  cx.save(); cx.translate(x, y); cx.rotate(rot); cx.fillStyle = col;
  for (let i = 0; i < 5; i++) { cx.rotate(Math.PI * 2 / 5); cx.beginPath(); cx.ellipse(0, -s * .55, s * .36, s * .55, 0, 0, 7); cx.fill(); }
  cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.arc(0, 0, s * .32, 0, 7); cx.fill(); cx.restore();
}
function globo(x, y, s, col) {
  cx.save(); cx.translate(x, y);
  cx.strokeStyle = 'rgba(255,255,255,.6)'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(0, s * 1.1); cx.quadraticCurveTo(s * .3, s * 1.6, 0, s * 2.1); cx.stroke();
  cx.fillStyle = col; cx.beginPath(); cx.ellipse(0, 0, s * .8, s, 0, 0, 7); cx.fill();
  cx.beginPath(); cx.moveTo(-s * .15, s * 1.1); cx.lineTo(s * .15, s * 1.1); cx.lineTo(0, s * .9); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.4)'; cx.beginPath(); cx.ellipse(-s * .3, -s * .35, s * .16, s * .3, -.5, 0, 7); cx.fill(); cx.restore();
}
function nube(x, y, s) {
  cx.save(); cx.translate(x, y); cx.fillStyle = '#8d93a8';
  for (const [dx, dy, rr] of [[-.5, .1, .45], [0, -.15, .6], [.5, .1, .45], [0, .2, .5]]) { cx.beginPath(); cx.arc(dx * s, dy * s, rr * s, 0, 7); cx.fill(); }
  cx.fillStyle = '#5d6c9a';
  for (let i = -1; i <= 1; i++) { cx.beginPath(); cx.ellipse(i * s * .38, s * .78, s * .07, s * .16, .2, 0, 7); cx.fill(); }
  cx.restore();
}
const COLORES_GLOBO = ['#ff5d8f', '#ffd23f', '#5ad1ff', '#8ce07a', '#c58cff'];
function bueno(o) {
  const x = o.x * W;
  if (D.objeto === 'estrella') estrella(x, o.y, o.s, '#ffd23f', o.rot);
  else if (D.objeto === 'moneda') moneda(x, o.y, o.s * .8);
  else if (D.objeto === 'flor') flor(x, o.y, o.s * .9, D.color, o.rot);
  else if (D.objeto === 'globo') globo(x, o.y, o.s * .85, COLORES_GLOBO[o.c % 5]);
  else corazon(x, o.y, o.s * 1.15, D.color);
}
function jugadorDibujo(x, y, rr) {
  cx.save();
  cx.fillStyle = D.color; cx.beginPath(); cx.roundRect(x - rr * 1.25, y + rr * .55, rr * 2.5, rr * .75, rr * .3); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.3)'; cx.fillRect(x - rr * 1.1, y + rr * .7, rr * 2.2, rr * .1);
  cx.beginPath(); cx.arc(x, y, rr, 0, 7); cx.fillStyle = '#fff'; cx.fill();
  cx.save(); cx.beginPath(); cx.arc(x, y, rr - 4, 0, 7); cx.clip();
  if (img.complete && img.naturalWidth) {
    const k = Math.max((rr * 2) / img.naturalWidth, (rr * 2) / img.naturalHeight);
    cx.fillStyle = D.fondo2; cx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    cx.drawImage(img, x - img.naturalWidth * k / 2, y - img.naturalHeight * k / 2, img.naturalWidth * k, img.naturalHeight * k);
  } else { cx.fillStyle = D.fondo2; cx.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
  cx.restore(); cx.restore();
}

// ─── el juego ───
let estado = 'inicio', puntos = 0, vidas = 3, cosas = [], chispas = [], textos = [], ultimo = 0, lanzar = 0, conf = [];
const jug = { x: .5, obj: .5 };
function empezar() {
  puntos = 0; vidas = 3; cosas = []; chispas = []; textos = []; conf = []; lanzar = 0; jug.x = jug.obj = .5;
  estado = 'jugando';
  for (const id of ['inicio', 'perdio', 'final']) $(id).classList.add('oculto');
  $('hud').classList.remove('oculto'); $('marca').classList.add('oculto');
  hud(); bip(523, .12); setTimeout(() => bip(784, .14), 110);
}
function hud() { $('progreso').style.width = Math.min(100, puntos / D.meta * 100) + '%'; $('vidas').textContent = '♥'.repeat(Math.max(0, vidas)); }
function mover(e) { if (estado !== 'jugando') return; const p = e.touches ? e.touches[0] : e; jug.obj = Math.max(.06, Math.min(.94, p.clientX / W)); }
addEventListener('pointermove', mover); addEventListener('pointerdown', mover); addEventListener('touchmove', mover, { passive: true });
function chispa(x, y, col, n = 12) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = Math.random() * 4 + 2; chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, t: 0, col, s: Math.random() * 4 + 2 }); }
}
function paso(dt) {
  if (estado !== 'jugando') return;
  jug.x += (jug.obj - jug.x) * Math.min(1, dt * 14);
  const vel = 1 + puntos / D.meta * 1.3;
  lanzar -= dt;
  if (lanzar <= 0) {
    lanzar = Math.max(.32, .8 - puntos / D.meta * .4);
    const malo = Math.random() < Math.min(.36, .14 + puntos / D.meta * .2);
    cosas.push({ x: .08 + Math.random() * .84, y: -40, v: (150 + Math.random() * 90) * vel, malo, s: malo ? 30 : 24, rot: Math.random() * 6, c: Math.floor(Math.random() * 5) });
  }
  const jx = jug.x * W, jy = H - Math.max(110, H * .16), rr = Math.min(46, W * .11);
  for (const o of cosas) {
    o.y += o.v * dt; o.rot += dt * 2;
    if (!o.fin && Math.hypot(o.x * W - jx, o.y - jy) < rr + o.s * .8) {
      o.fin = true;
      if (o.malo) {
        vidas--; bip(180, .25, 'sawtooth', .09); chispa(o.x * W, o.y, '#8d93a8');
        if (navigator.vibrate) navigator.vibrate(60);
        if (vidas <= 0) { estado = 'perdio'; $('hud').classList.add('oculto'); $('perdio').classList.remove('oculto'); }
      } else {
        puntos++; bip(660 + puntos * 18, .1); chispa(o.x * W, o.y, D.color);
        const tramo = Math.round(D.meta / 4), frase = D.frases[puntos / tramo - 1];
        if (puntos % tramo === 0 && frase) textos.push({ t: 0, txt: frase });
        if (puntos >= D.meta) ganar();
      }
      hud();
    }
  }
  cosas = cosas.filter(o => !o.fin && o.y < H + 60);
}
function dibujar(dt) {
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, D.fondo1 || '#2b0f3a'); g.addColorStop(1, D.fondo2 || '#7a1f5c');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const ahora = Date.now();
  for (const s of fondo) {
    s.y += s.v * dt; if (s.y > 1) s.y = 0;
    cx.globalAlpha = .35 + .3 * Math.sin(ahora / 600 + s.x * 20); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x * W, s.y * H, s.s, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
  if (estado === 'jugando') {
    for (const o of cosas) o.malo ? nube(o.x * W, o.y, o.s) : bueno(o);
    jugadorDibujo(jug.x * W, H - Math.max(110, H * .16), Math.min(46, W * .11));
  }
  for (const c of chispas) { c.t += dt; c.x += c.vx; c.y += c.vy; c.vy += .25; cx.globalAlpha = Math.max(0, 1 - c.t * 1.4); cx.fillStyle = c.col; cx.beginPath(); cx.arc(c.x, c.y, c.s, 0, 7); cx.fill(); }
  cx.globalAlpha = 1; chispas = chispas.filter(c => c.t < .8);
  for (const tx of textos) {
    tx.t += dt; cx.globalAlpha = Math.min(1, tx.t * 3) * Math.max(0, Math.min(1, (2.6 - tx.t) * 2));
    cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.font = `800 ${Math.min(34, W * .075)}px 'Baloo 2', system-ui, sans-serif`;
    cx.fillText(tx.txt, W / 2, H * .36 - tx.t * 14);
  }
  cx.globalAlpha = 1; textos = textos.filter(tx => tx.t < 2.6);
  if (estado === 'final') confeti(dt);
}
function confeti(dt) {
  const cols = [D.color, mezclar(D.color, '#ffffff', .55), '#fff', '#7ee0ff'];
  if (conf.length < 140) conf.push({ x: Math.random() * W, y: -10, v: Math.random() * 120 + 80, r: Math.random() * 6, w: Math.random() * 3 + 2, col: cols[Math.floor(Math.random() * 4)] });
  for (const p of conf) {
    p.y += p.v * dt; p.r += dt * 4; if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.col; cx.fillRect(-p.w, -p.w * 1.8, p.w * 2, p.w * 3.6); cx.restore();
  }
}
let escribiendo = null;
function ganar(instantaneo) {
  estado = 'final';
  for (const id of ['hud', 'inicio', 'perdio']) $(id).classList.add('oculto');
  $('final').classList.remove('oculto'); $('botones').classList.add('oculto'); $('respuesta').classList.add('oculto'); $('denuevo').classList.add('oculto');
  $('no').style.transform = '';
  $('titulo_final').textContent = M.final.replace('{para}', D.para || 'vos');
  const terminar = () => {
    if (D.pregunta) { $('mensaje').textContent = (D.mensaje ? D.mensaje + '\n\n' : '') + D.pregunta; $('botones').classList.remove('oculto'); }
    else $('denuevo').classList.remove('oculto');
  };
  clearInterval(escribiendo);
  if (instantaneo) { $('mensaje').textContent = D.mensaje; terminar(); return; }
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, .18, 'triangle', .14), i * 130));
  escribir(D.mensaje || ' ', () => setTimeout(terminar, D.pregunta ? 600 : 1200));
}
function escribir(txt, fin) {
  const el = $('mensaje'); el.textContent = ''; let i = 0;
  escribiendo = setInterval(() => {
    el.textContent = txt.slice(0, ++i);
    if (i % 3 === 0) bip(880, .03, 'square', .03);
    if (i >= txt.length) { clearInterval(escribiendo); fin && fin(); }
  }, 42);
}
const no = $('no');
function escapar() {
  const caja = $('botones').getBoundingClientRect();
  no.style.transform = `translate(${(Math.random() - .5) * Math.min(260, caja.width - 120)}px, ${(Math.random() - .5) * 120}px)`; bip(300, .06);
}

function bucle(t) { const dt = Math.min(.05, (t - ultimo) / 1000 || 0); ultimo = t; paso(dt); dibujar(dt); requestAnimationFrame(bucle); }

// ─── cómo llegan los datos ───
// 1) el editor o la página del juego mandan {juego:'datos', plantilla, datos, vista, id}
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.juego !== 'datos') return;
  aplicar(e.data.plantilla, e.data.datos, { vista: e.data.vista, id: e.data.id, ir: e.data.ir, reiniciar: e.data.reiniciar });
});
// 2) inactivo
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.juego !== 'inactivo') return;
  for (const id of ['inicio', 'hud', 'final', 'perdio']) $(id).classList.add('oculto');
  $('inactivo').classList.remove('oculto'); $('inactivo_txt').textContent = e.data.texto || '';
});
const pm = new URLSearchParams(location.search);
aplicar(pm.get('p') || 'amor', null, { vista: true });
if (parent !== window) parent.postMessage({ juego: 'listo' }, location.origin);
