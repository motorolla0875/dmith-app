<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freidora Fácil</title>
<meta name="theme-color" content="#1f2326">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cocina de todos los días, cálida y directa, sin vueltas.
   IDEA: la app se comporta como el panel de la freidora: cada receta muestra su "display" con temperatura y tiempo.
   PICTURE: el display oscuro con dígitos ámbar, grande en el detalle y en el modo cocinar.
   COLOUR and TYPE: blanco + carbón, ámbar de papa dorada como acento, tomate para alertas. Outfit + Chakra Petch en los dígitos.
   LAYOUT: una columna de celular (máx. 560px), barra de abajo con Buscar / Favoritas / Súper. */
:root{color-scheme:light dark;--c0:#ffffff;--c1:#1d1b19;--c2:#6d6760;--c3:#ece7e0;--c4:#faf8f5;--c5:#fff3d6;--c6:#7a4f00;--c7:#fff0ec;--bg:var(--c0);--ink:var(--c1);--soft:var(--c2);--line:var(--c3);
--card:var(--c4);--amb:#f4a300;--amb2:var(--c5);--tom:#e5482f;--panel:#1f2326;--dig:#ffb21a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c0:#141414;--c1:#f3efe8;--c2:#a9a29a;--c3:#2a2725;--c4:#1d1b1a;--c5:#3a2c0a;--c6:#ffd27a;--c7:#3a1a14}}
:root[data-theme=dark]{--c0:#141414;--c1:#f3efe8;--c2:#a9a29a;--c3:#2a2725;--c4:#1d1b1a;--c5:#3a2c0a;--c6:#ffd27a;--c7:#3a1a14}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:30px;line-height:1.05;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--soft);margin:0 0 14px}
.busca{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.busca:focus-within{border-color:var(--amb)}
.busca input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-height:40px}
.busca button{border:0;background:var(--amb);color:#1d1b19;font-weight:600;border-radius:12px;min-height:40px;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:15px;min-height:38px}
.chip.on{background:var(--amb);border-color:var(--amb);color:#1d1b19;font-weight:600}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.cats button{flex:none;border:0;background:var(--card);border-radius:10px;padding:7px 12px;color:var(--soft);font-weight:500}
.cats button.on{background:var(--ink);color:var(--bg)}
.estado{font-size:14px;color:var(--soft);margin:8px 2px}
.lista{display:grid;gap:12px}
.rc{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;border:0;text-align:left;width:100%}
.disp{background:var(--panel);border-radius:12px;padding:8px 6px;text-align:center;color:var(--dig);font-family:"Chakra Petch",monospace;line-height:1.1;box-shadow:inset 0 0 0 2px #2f3438}
.disp b{display:block;font-size:22px}.disp span{font-size:13px;color:#cfd6da}
.rc h3{margin:0;font-size:17px;line-height:1.2}
.rc p{margin:3px 0 0;font-size:13.5px;color:var(--soft)}
.tiene{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:600;background:var(--amb2);color:var(--c6);border-radius:6px;padding:2px 7px}
.fav{border:0;background:none;width:44px;height:44px;font-size:22px;color:var(--soft)}
.fav.on{color:var(--tom)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:none;padding:10px 4px 14px;font-size:14px;color:var(--soft);font-weight:500}
.nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--amb)}
.nav i{font-style:normal;display:block;font-size:12px;background:var(--tom);color:#fff;border-radius:999px;min-width:18px;margin:0 auto 2px;width:max-content;padding:0 5px}
.hoja{position:fixed;inset:0;background:#fff;background:var(--bg);z-index:10;overflow-y:auto;display:none}
.hoja.on{display:block}
.hoja .app{padding-top:10px}
.volver{border:0;background:var(--card);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600}
.panel{background:var(--panel);border-radius:22px;padding:18px;color:#cfd6da;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;box-shadow:inset 0 0 0 3px #2f3438}
.panel div{text-align:center;background:#171a1c;border-radius:14px;padding:10px 4px}
.panel b{display:block;font-family:"Chakra Petch",monospace;font-size:40px;color:var(--dig);line-height:1}
.panel small{font-size:13px}
.panel .ext{grid-column:1/-1;font-size:14px;text-align:center;background:none;padding:0}
h2{font-size:20px;margin:18px 0 8px}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ing li span{flex:1}
.mini{border:1.5px solid var(--line);background:none;border-radius:10px;min-height:36px;padding:0 10px;font-size:13.5px;white-space:nowrap}
.mini.on{background:var(--amb2);border-color:var(--amb)}
ol.pasos{padding-left:22px;margin:0}ol.pasos li{margin:0 0 10px}
.seg{background:var(--c7);border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:12px}
.grande{width:100%;border:0;background:var(--amb);color:#1d1b19;font-weight:700;font-size:18px;border-radius:16px;min-height:56px;margin-top:18px}
.cocina{text-align:center}
.reloj{width:min(78vw,300px);aspect-ratio:1;margin:18px auto 8px;position:relative}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj .num{position:absolute;inset:0;display:grid;place-content:center;font-family:"Chakra Petch",monospace;color:var(--ink)}
.reloj .num b{font-size:64px;line-height:1}.reloj .num span{font-size:16px;color:var(--soft);font-family:Outfit,system-ui,sans-serif}
.aviso{background:var(--tom);color:#fff;border-radius:16px;padding:14px;font-weight:700;font-size:19px;margin:10px 0;display:none}
.aviso.on{display:block;animation:lat 1s infinite}
@keyframes lat{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.aviso.on{animation:none}}
.fila{display:flex;gap:10px}.fila button{flex:1;border:0;background:var(--card);border-radius:14px;min-height:50px;font-weight:600}
.pill{max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;transform:translateX(-50%);bottom:72px;background:var(--panel);color:var(--dig);border:0;border-radius:999px;padding:10px 18px;font-family:"Chakra Petch",monospace;font-size:17px;z-index:6;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pill.on{display:block}
.llave{display:grid;gap:6px;background:var(--amb2);border-radius:18px;padding:14px;margin:0 0 14px}.llave span{font-size:14.5px}.llave small{color:var(--tom);min-height:1em;font-size:14px}.llave .busca{background:var(--bg)}
.vacio{text-align:center;color:var(--soft);padding:40px 10px}
.nota{font-size:13px;color:var(--soft);text-align:center;margin-top:26px}
.super li{cursor:pointer}.super li.ok span{text-decoration:line-through;color:var(--soft)}
.caja{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-content:center;font-size:15px;flex:none}
ul.ing li .caja{flex:none}
li.ok .caja{background:var(--amb);border-color:var(--amb);color:#1d1b19}
.de{font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<div class="app" id="main"></div>
<nav class="nav"><div>
  <button data-tab="buscar" class="on">Buscar</button>
  <button data-tab="favs">Favoritas</button>
  <button data-tab="super">Súper</button>
</div></nav>
<button class="pill" id="pill"></button>
<section class="hoja" id="hoja"><div class="app" id="hojaIn"></div></section>

let tab = 'buscar', sel = new Set(), cat = 'Todas', favs = new Set(leer('favs',[])), sup = leer('super',[]);
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const principales = r => [...new Set(r.ing.map(i=>i[0]).filter(k=>k && !BASICOS.has(k)))];
const minTxt = m => m + ' min';

function tarjeta(r){
  const p = principales(r), tiene = p.filter(coincide);
  return `<div class="rc" data-id="${r.id}" role="button" tabindex="0">
    <div class="disp"><b>${r.temp}°</b><span>${minTxt(r.min)}</span></div>
    <div><h3>${esc(r.nombre)}</h3><p>${esc(r.cat)} · ${r.porc} porc.${r.tags.length?' · '+esc(r.tags.join(' · ')):''}</p>
    ${sel.size?`<span class="tiene">Tenés ${tiene.length} de ${p.length}</span>`:''}</div>
    <button class="fav ${favs.has(r.id)?'on':''}" data-fav="${r.id}" aria-label="Favorita">${favs.has(r.id)?'♥':'♡'}</button></div>`;
}
const PARIENTE = {salmon:'pescado',trucha:'pescado',calamar:'pescado',langostinos:'pescado',atun:'pescado',chorizo:'carne',morcilla:'carne',salchicha:'carne',higado:'carne'};
const unTermino = (k,s) => k===s || PARIENTE[k]===s || k.split(' ').some(x => x===s || x===s+'s' || x===s+'es');
function coincide(k){ for (const s of sel) if (unTermino(k,s)) return true; return false; }
function puntaje(r){
  const p = principales(r), nom = SIN(r.nombre); let n = 0;
  for (const s of sel){ if (p.some(k => unTermino(k,s))) n++; else if (nom.includes(s)) n += .5; }
  return n ? n / Math.max(p.length,1) + n * .05 : 0;
}
function pintar(){
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  const nSup = sup.filter(x=>!x.ok).length;
  document.querySelector('[data-tab=super]').innerHTML = (nSup?`<i>${nSup}</i>`:'') + 'Súper';
  const m = $('#main');
  if (tab==='buscar'){
    let lista = R.filter(r => cat==='Todas' || r.cat===cat);
    if (sel.size) lista = lista.map(r=>[r,puntaje(r)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    m.innerHTML = `<h1>Freidora Fácil</h1><p class="sub">¿Qué tenés en la heladera? Elegí y te digo qué cocinar.</p>${abierto?'':candado()}
      <form class="busca" id="f"><input id="q" placeholder="Ej: pollo, papa, cebolla" autocomplete="off" aria-label="Ingredientes"><button>Agregar</button></form>
      <div class="chips">${[...new Set([...CHIPS,...sel])].map(c=>`<button class="chip ${sel.has(c)?'on':''}" data-chip="${esc(c)}">${esc(ETQ[c]||c)}</button>`).join('')}</div>
      <div class="cats">${CATS.map(c=>`<button class="${c===cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
      <div class="estado">${sel.size? (lista.length? `${lista.length} recetas con lo que tenés` : 'No encontré recetas con eso. Probá sacar algún ingrediente.') : `${lista.length} recetas`}${sel.size?' · <button class="mini" id="limpiar">Borrar selección</button>':''}</div>
      <div class="lista">${lista.map(tarjeta).join('')}</div>
      ${abierto?'':`<p class="estado" style="text-align:center;margin-top:16px">+ ${TOTAL - R.length} recetas más con tu código de acceso</p>`}
      <p class="nota">${TOTAL} recetas · Los tiempos son aproximados: cada freidora es distinta.<br>¿Problemas con tu acceso? Escribinos a dmith.builds@gmail.com</p>`;
    $('#f').onsubmit = e => { e.preventDefault(); for (const w of $('#q').value.split(/[,\n;]| y /)) { const k = norm(w); if (k) sel.add(k); } pintar(); };
  } else if (tab==='favs'){
    const lista = R.filter(r=>favs.has(r.id));
    m.innerHTML = `<h1>Favoritas</h1><p class="sub">Las recetas que marcaste con el corazón.</p>` +
      (lista.length? `<div class="lista">${lista.map(tarjeta).join('')}</div>` : `<div class="vacio">Todavía no marcaste ninguna.<br>Tocá ♡ en una receta para guardarla acá.</div>`);
  } else {
    m.innerHTML = `<h1>Lista del súper</h1><p class="sub">Tocá un ítem para tacharlo.</p>` +
      (sup.length? `<ul class="ing super">${sup.map((x,i)=>`<li data-sup="${i}" class="${x.ok?'ok':''}"><span class="caja">${x.ok?'✓':''}</span><span>${esc(x.t)}<br><small class="de">${esc(x.de)}</small></span></li>`).join('')}</ul>
      <div class="fila" style="margin-top:16px"><button id="limpTach">Sacar lo tachado</button><button id="limpTodo">Vaciar lista</button></div>`
      : `<div class="vacio">La lista está vacía.<br>En cada receta podés agregar lo que te falta.</div>`);
  }
  $('#pill').classList.toggle('on', !!T && !$('#hoja').classList.contains('on'));
}

// ---------- detalle de receta ----------
let actual = null;
function abrir(id){
  const r = R.find(x=>x.id===id); actual = r;
  const enSup = t => sup.some(x=>x.t===t && x.de===r.nombre);
  $('#hojaIn').innerHTML = `<button class="volver" data-cerrar>← Volver</button>
    <h1 style="margin-top:14px">${esc(r.nombre)}</h1><p class="sub">${esc(r.cat)} · ${r.porc} porciones${r.tags.length?' · '+esc(r.tags.join(' · ')):''}</p>
    <div class="panel"><div><b>${r.temp}°</b><small>temperatura</small></div><div><b>${r.min}'</b><small>minutos</small></div>
    <div class="ext">${r.sacudir? `Sacudí o dalo vuelta a los ${r.sacudir} minutos` : 'No hace falta darlo vuelta'}</div></div>
    <h2>Ingredientes</h2><ul class="ing">${r.ing.map(i=>`<li><span>${esc(i[1])}</span>${i[0]?`<button class="mini ${enSup(i[1])?'on':''}" data-add="${esc(i[1])}">${enSup(i[1])?'En el súper ✓':'+ Súper'}</button>`:''}</li>`).join('')}</ul>
    <h2>Paso a paso</h2><ol class="pasos">${r.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    ${r.seg?`<div class="seg"><b>Para que salga seguro:</b> ${esc(r.seg)}</div>`:''}
    <button class="grande" data-cocinar>Empezar a cocinar · ${r.min} min</button>
    <p class="nota">Si tu freidora no precalienta sola, prendela 3 minutos antes a la misma temperatura.</p>`;
  $('#hoja').classList.add('on'); $('#hoja').scrollTop = 0; pintar();
}

// ---------- modo cocinar (temporizador) ----------
let T = null, tick = null, ac = null;
function bip(n){ try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); for (let i=0;i<n;i++){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value = 880; o.type='square';
  g.gain.setValueAtTime(.0001, ac.currentTime+i*.35); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime+i*.35+.02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+i*.35+.25);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.35); o.stop(ac.currentTime+i*.35+.3); } } catch(e){} try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){} }
function cocinar(r){
  bip(0);
  T = { r, fin: Date.now() + r.min*60000, total: r.min*60000, pausa: null, avisado: !r.sacudir, terminado: false };
  vistaCocina(); clearInterval(tick); tick = setInterval(latido, 250);
}
function restante(){ return T.pausa != null ? T.pausa : Math.max(0, T.fin - Date.now()); }
function vistaCocina(){
  const r = T.r;
  $('#hojaIn').innerHTML = `<button class="volver" data-minimizar>← Seguir mirando recetas</button>
    <div class="cocina"><h1 style="margin-top:14px">${esc(r.nombre)}</h1><p class="sub">${r.temp}° · ${r.min} minutos</p>
    <div class="reloj"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle id="arco" cx="50" cy="50" r="44" fill="none" stroke="var(--amb)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg>
      <div class="num"><b id="cuenta">--:--</b><span id="leyenda">cocinando</span></div></div>
    <div class="aviso" id="aviso"></div>
    <div class="fila"><button data-pausa>${T.pausa!=null?'Seguir':'Pausar'}</button><button data-mas>+1 minuto</button><button data-parar>Terminar</button></div></div>`;
  $('#hoja').classList.add('on'); latido();
}
function latido(){
  if (!T) return;
  const ms = restante(), s = Math.ceil(ms/1000), txt = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const pasado = (T.total - ms)/60000;
  if (!T.avisado && pasado >= T.r.sacudir){ T.avisado = true; T.msg = 'Sacudí la canasta o dalo vuelta'; bip(3); }
  if (!T.terminado && ms <= 0){ T.terminado = true; T.msg = '¡Listo! Sacalo de la freidora'; bip(5); }
  $('#pill').textContent = (T.terminado?'¡Listo! ':'') + T.r.nombre + ' · ' + txt;
  const c = $('#cuenta'); if (c){ c.textContent = txt; $('#arco').setAttribute('stroke-dashoffset', 276.5 * (1 - ms/T.total));
    $('#leyenda').textContent = T.pausa!=null ? 'en pausa' : T.terminado ? 'terminado' : 'cocinando';
    const a = $('#aviso'); if (T.msg){ a.textContent = T.msg; a.classList.add('on'); } }
}

// ---------- eventos ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-id],[data-sup]'); if (!t) return;
  const d = t.dataset;
  if (d.tab){ tab = d.tab; $('#hoja').classList.remove('on'); pintar(); scrollTo(0,0); return; }
  if (d.fav){ favs.has(d.fav)?favs.delete(d.fav):favs.add(d.fav); guardar('favs',[...favs]); pintar(); return; }
  if (d.chip){ sel.has(d.chip)?sel.delete(d.chip):sel.add(d.chip); pintar(); return; }
  if (d.cat){ cat = d.cat; pintar(); return; }
  if (t.id==='limpiar'){ sel.clear(); pintar(); return; }
  if (d.id){ abrir(d.id); return; }
  if ('cerrar' in d || 'minimizar' in d){ $('#hoja').classList.remove('on'); pintar(); return; }
  if (d.add){ const i = sup.findIndex(x=>x.t===d.add && x.de===actual.nombre); i>=0? sup.splice(i,1) : sup.push({t:d.add, de:actual.nombre, ok:false}); guardar('super',sup); abrir(actual.id); return; }
  if ('cocinar' in d){ cocinar(actual); return; }
  if ('pausa' in d){ if (T.pausa!=null){ T.fin = Date.now()+T.pausa; T.pausa=null; } else T.pausa = restante(); vistaCocina(); return; }
  if ('mas' in d){ if (T.pausa!=null) T.pausa += 60000; else T.fin += 60000; T.total += 60000; T.terminado=false; T.msg=''; vistaCocina(); return; }
  if ('parar' in d){ clearInterval(tick); T = null; $('#hoja').classList.remove('on'); pintar(); return; }
  if (d.sup){ sup[+d.sup].ok = !sup[+d.sup].ok; guardar('super',sup); pintar(); return; }
  if (t.id==='limpTach'){ sup = sup.filter(x=>!x.ok); guardar('super',sup); pintar(); return; }
  if (t.id==='limpTodo'){ sup = []; guardar('super',sup); pintar(); return; }
  if (t.id==='pill'){ vistaCocina(); return; }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.dataset && e.target.dataset.id) abrir(e.target.dataset.id); });
async function abrir_con(codigo){
  codigo = codigo.trim().toUpperCase().replace(/\s+/g,'');
  if (!codigo || !ENC) return false;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), te = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', te.encode(codigo), 'PBKDF2', false, ['deriveKey']);
  for (const w of ENC.llaves){
    try {
      const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(w.sal), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const crudo = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(w.iv)}, k, b64(w.dato));
      const dk = await crypto.subtle.importKey('raw', crudo, 'AES-GCM', false, ['decrypt']);
      const txt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, dk, b64(ENC.dato));
      R = JSON.parse(new TextDecoder().decode(txt)); abierto = true; guardar('codigo', codigo); return true;
    } catch(e){}
  }
  return false;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fl') return; e.preventDefault();
  const er = $('#err'); er.textContent = 'Abriendo…';
  if (await abrir_con($('#cod').value)) pintar(); else er.textContent = 'Ese código no funciona. Revisá el mensaje de tu compra.';
});
pintar();
(async () => { const c = leer('codigo',''); if (c && await abrir_con(c)) pintar(); })();
}
</script>
