# Sitio dmith.app — copiar a /etc/nginx/sites-available/dmith.app
server {
    listen 80;
    listen [::]:80;
    server_name dmith.app www.dmith.app;

    root /var/www/dmith-app;
    index index.html;

    # No mostrar archivos del repositorio
    location ~ /\.(git|github) { deny all; }
    location ^~ /deploy/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
