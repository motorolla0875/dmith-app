# Sitio dmith.app — copiar a /etc/nginx/sites-available/dmith.app
server {
    listen 80;
    listen [::]:80;
    server_name dmith.app www.dmith.app;

    root /var/www/dmith-app;
    index index.html;

    # No mostrar archivos del repositorio
    location ~ /\.(git|github) { deny all; }
    location ^~ /deploy/ { deny all; }
    location ^~ /voxelium-servidor/ { deny all; }

    # Voxelium: salas para jugar en línea (servidor en el puerto 8820)
    location /voxws {
        client_max_body_size 9m;
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
