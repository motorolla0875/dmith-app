er que ele vê o que nós não conseguimos ver.", "Reconhecer a Deus em todos os seus caminhos significa incluí-lo nas coisas grandes e no dia a dia: ao procurar emprego, ao decidir uma compra, ao responder uma mensagem difícil. Não é uma fórmula para tudo sair como queremos, mas um relacionamento em que ele guia e nós seguimos. Quando o caminho parece torto, você pode descansar sabendo que Deus sabe como endireitá-lo, no tempo dele e do jeito dele."], "pregunta": "Em que área da sua vida você está se apoiando só no seu próprio entendimento, em vez de confiar em Deus?", "oracion": "Pai, confesso que muitas vezes quero entender tudo antes de confiar em ti. Hoje decido me apoiar na tua sabedoria e não só na minha. Apresento a ti a vida de {N}. {S}Ensina-me a te reconhecer em cada decisão, grande ou pequena, e a buscar a tua direção antes de agir. Quando eu não enxergar o caminho com clareza, dá-me paz para continuar andando de mãos dadas contigo, sabendo que tu guias os meus passos. Amém.", "txt": "Confia no SENHOR com todo o teu coração; e não te apoies em teu próprio entendimento. Dá reconhecimento a ele em todas os teus caminhos; e ele endireitará tuas veredas."}, {"ref": [19, 17, 17, 17], "tema": "Amizade", "titulo": "Amigos em todo tempo", "med": ["É fácil ter amigos quando tudo vai bem, quando há festas, risadas e boas notícias. Este provérbio fala de algo mais profundo: o amigo verdadeiro ama em todo tempo, também quando chegam a doença, o desemprego ou o luto. E diz que o irmão nasce, por assim dizer, para ajudar na angústia. A amizade é provada nos dias difíceis.", "Pense nas pessoas que estiveram ao seu lado quando você mais precisou; elas são um presente de Deus. Mas o versículo também nos desafia a ser esse tipo de amigo. Talvez hoje você possa ligar para alguém que está passando por um momento ruim, levar um pouco de comida ou simplesmente ouvir sem julgar. Assim refletimos o amor fiel de Jesus, que nos chama de amigos."], "pregunta": "Qual dos seus amigos está passando por um momento difícil, e como você poderia estar com ele hoje?", "oracion": "Senhor Jesus, obrigado pelos amigos que colocaste no meu caminho e pela tua amizade que nunca falha. Ensina-me a amar em todo tempo, não só quando é confortável. {S}Dá-me olhos para ver quem está sofrendo e coragem para me aproximar com uma palavra ou um gesto simples. Cerca {N} de bons amigos. Que as minhas amizades sejam sinceras, fiéis e te honrem. Amém.", "txt": "O amigo ama em todo tempo, e o irmão nasce para ajudar na angústia."}, {"ref": [39, 6, 6, 6], "tema": "Oração", "titulo": "A sós com o Pai", "med": ["Jesus ensinou que a oração não é um espetáculo para os outros. Ele nos convida a entrar no quarto, fechar a porta e falar com o Pai em segredo. Não são necessárias palavras difíceis nem um templo especial. Deus vê o que ninguém mais vê e ouve o que você diz em voz baixa, com simplicidade e sinceridade.", "Esse quarto pode ser o seu quarto bem cedo pela manhã, o trajeto para o trabalho ou alguns minutos na cozinha antes de todos acordarem. O importante é separar um momento para estar com Deus sem distrações. Você pode começar com pouco: agradecer, contar o que preocupa você e pedir ajuda para o dia. Ele espera você ali."], "pregunta": "Que momento e que lugar você poderia separar todos os dias para orar a sós com Deus?", "oracion": "Pai, obrigado porque posso falar contigo a qualquer hora e em qualquer lugar. Às vezes me distraio, fico com pressa ou não sei o que dizer, mas mesmo assim tu me ouves. Apresento a ti hoje a vida de {N}. {S}Ensina-me a te buscar em secreto, com um coração sincero, e a fazer da oração um encontro diário contigo. Que nesse tempo a sós eu encontre paz e direção. Amém.", "txt": "Porém tu, quando orares, entra em teu quarto, fecha tua porta, e ora a teu Pai, que está em segredo; e teu Pai, que vê em segredo, ele te recompensará."}, {"ref": [49, 4, 6, 7], "tema": "Paz", "titulo": "Trocar a preocupação pela oração", "med": ["A preocupação fica dando voltas e mais voltas no mesmo assunto, mas não nos leva a lugar nenhum. Paulo propõe algo concreto: transformar em oração cada coisa que nos preocupa. Dizer o que é, entregar a Deus e agradecer.", "A promessa não é que tudo vai se resolver do jeito que queremos, mas que a paz de Deus vai guardar o nosso coração e a nossa mente, como um guarda na porta."], "pregunta": "Que preocupação você pode transformar hoje numa oração concreta?", "oracion": "Senhor, tu conheces o que me preocupa. Hoje, em vez de ficar remoendo, entrego tudo a ti. Guarda o coração e a mente de {N}. {S}Obrigado porque tu ouves. Enche-me da tua paz, aquela que não se pode explicar. Amém.", "txt": "Não estejais ansiosos por coisa alguma; mas em tudo, por meio de orações e súplicas com ações de gratidão, sejam os vossos pedidos conhecidos por Deus; e a paz de Deus, que excede todo entendimento, guardará os vossos corações e as vossas mentes em Cristo Jesus."}, {"ref": [58, 1, 5, 5], "tema": "Sabedoria", "titulo": "Peça sem medo", "med": ["Tiago faz um convite bem concreto: se falta sabedoria a você, peça a Deus. E descreve como ele responde: concede generosamente e sem repreender. Ele não vai olhar para você com impaciência nem dizer que você já deveria saber. Deus não é como o chefe impaciente ou o professor que zomba das perguntas. É um Pai que se alegra quando os filhos se aproximam em busca de direção.", "Todos os dias enfrentamos decisões: como responder a uma mensagem difícil, o que fazer com o dinheiro apertado, como conversar com um filho adolescente, se aceitar ou não um emprego. Antes de correr para buscar a resposta em qualquer lugar, pare um momento e ore. A sabedoria de Deus costuma chegar pela sua Palavra, por um conselho sensato ou por uma paz que coloca as ideias em ordem. Peça com confiança; ele prometeu dar."], "pregunta": "Que decisão você está enfrentando em que precisa pedir sabedoria a Deus?", "oracion": "Senhor, reconheço que muitas vezes não sei o que fazer e ajo por impulso. Hoje te peço sabedoria para as minhas decisões grandes e pequenas. Obrigado porque dás generosamente e não me repreendes por perguntar. Dá também a {N} clareza para cada passo que precisa dar. {S}Ajuda-me a ouvir a tua voz na tua Palavra e nos bons conselhos, e a escolher com calma o que te agrada. Amém.", "txt": "Se algum de vós tem falta de sabedoria, peça a Deus, que concede generosamente a todos sem repreender, e lhe será dada."}, {"ref": [57, 13, 5, 5], "tema": "Solidão", "titulo": "Ele nunca me deixará", "med": ["Este versículo une duas coisas que parecem distantes: estar contente com o que temos e saber que Deus não nos abandona. Muitas vezes tentamos preencher o vazio com coisas, compras ou barulho. Mas a verdadeira companhia não se compra. A promessa é clara: Deus não deixará você nem o desamparará, nem na casa vazia nem na noite longa.", "A solidão pode pesar muito ao voltar do trabalho para uma casa silenciosa, ao morar longe da família ou ao sentir que ninguém ao seu redor entende você. Deus nem sempre tira esse sentimento de uma vez, mas está presente no meio dele. Fale com ele como com um amigo. E talvez hoje você também possa mandar uma mensagem para alguém que se sente sem companhia."], "pregunta": "Em que momentos do dia você sente mais a solidão, e como poderia convidar Deus para esse momento?", "oracion": "Pai, há dias em que me sinto sem companhia e ninguém parece perceber o que carrego por dentro. Obrigado porque prometeste nunca me deixar. Fica bem perto de {N}. {S}Enche os silêncios da minha casa com a tua presença e ensina-me a ter contentamento com o que tenho. Coloca no meu caminho pessoas com quem eu possa repartir a fé e a vida, e faz-me também companhia para os outros. Amém.", "txt": "A vossa maneira de viver seja sem ganância, contentando-vos com as coisas que tendes. Pois ele disse: Não te deixarei, nem te desampararei."}, {"ref": [23, 29, 11, 11], "tema": "Esperança", "titulo": "Pensamentos de paz", "med": ["Quando o presente está confuso, é fácil pensar que o futuro também será. Mas Deus diz que os pensamentos que ele tem a nosso respeito são pensamentos de paz, e não de mal.", "Essa promessa foi dada a um povo que estava longe de casa, num tempo difícil. Deus não se esquece dos seus, nem mesmo durante a espera."], "pregunta": "Que parte do seu futuro você precisa confiar a Deus hoje?", "oracion": "Deus de esperança, obrigado porque tens bons pensamentos para a minha vida. Coloco em tuas mãos o futuro de {N}. {S}Enquanto espero, dá-me paciência e confiança. Amém.", "txt": "Porque eu sei os pensamentos que penso quanto a vós, diz o SENHOR, pensamentos de paz, e não de mal, para vos dar um futuro com esperança."}, {"ref": [61, 4, 19, 19], "tema": "Amor", "titulo": "Ele nos amou primeiro", "med": ["Antes de fazermos qualquer coisa certa, antes de o buscarmos, Deus já nos amava. O amor dele não é um prêmio que se conquista; é o ponto de partida.", "Quando entendemos o quanto somos amados, fica mais fácil amar os outros: a família, quem é difícil de amar, quem está sozinho."], "pregunta": "A quem você pode mostrar hoje um pouco do amor que recebeu?", "oracion": "Pai, obrigado por me amares primeiro, mesmo quando eu não merecia. Que {N} descanse hoje no teu amor. {S}Ensina-me a amar como tu amas: com paciência, com bondade e sem guardar rancor. Amém.", "txt": "Nós amamos, porque ele nos amou primeiro."}, {"ref": [22, 41, 10, 10], "tema": "Força", "titulo": "Não tema, eu estou com você", "med": ["Deus não diz que os momentos difíceis não virão. Ele diz algo mais profundo: que não estaremos sozinhos neles. A presença dele é o motivo para não temer.", "Repare nas três promessas: eu te fortaleço, te ajudo e te sustento. Quando sentimos que não aguentamos mais, é ele quem nos sustenta."], "pregunta": "Em que situação de hoje você precisa lembrar que Deus sustenta você?", "oracion": "Deus forte, obrigado porque estás comigo. Quando eu tiver medo, lembra-me de que a tua mão me sustenta. Fortalece {N} em tudo o que precisar enfrentar hoje. {S}Que a minha confiança esteja em ti e não nas minhas forças. Amém.", "txt": "Não temas, porque eu estou contigo; não te assombres, porque eu sou teu Deus. Eu te fortaleço, te ajudo, e te sustento com a minha mão direita de justiça."}, {"ref": [40, 4, 39, 39], "tema": "Paz", "titulo": "Bonança no meio do vento", "med": ["Os discípulos atravessavam o mar da Galileia quando se levantou uma tempestade tão forte que a água entrava no barco. Assustados, acordaram Jesus, que dormia tranquilo. Ele se levantou, repreendeu o vento e falou ao mar, e fez-se grande bonança. Os mesmos que tinham medo da água descobriram que quem estava com eles tinha autoridade sobre a tempestade.", "Você também passa por tempestades: um diagnóstico preocupante, uma dívida, um conflito familiar, uma noite de insônia cheia de pensamentos. Nem sempre a situação muda na hora, mas Jesus continua no seu barco. Você pode clamar a ele com sinceridade, como os discípulos fizeram. A presença dele traz uma paz que não depende do tempo lá fora, porque nasce de saber quem está com você."], "pregunta": "Que tempestade você está vivendo hoje, e o que significa para você que Jesus esteja no seu barco?", "oracion": "Jesus, tu tens autoridade sobre o vento e o mar. Hoje te trago a tempestade que estou vivendo e o medo que sinto por dentro. Acalma o meu coração e ajuda-me a confiar que estás comigo. Dá paz a {N} no meio das suas lutas. {S}Quando as ondas parecerem maiores do que eu, lembra-me de que tu estás no meu barco e não me deixas sozinho. Amém.", "txt": "Então ele se levantou, repreendeu o vento, e disse ao mar: Cala-te, aquieta-te! E o vento se aquietou, e fez-se grande bonança."}, {"ref": [50, 3, 23, 24], "tema": "Trabalho", "titulo": "Trabalhar para o Senhor", "med": ["Paulo escreveu para pessoas com trabalhos duros e pouco reconhecidos. Disse a elas que fizessem tudo de coração, como para o Senhor e não para as pessoas. Isso muda o olhar sobre a tarefa de cada dia: varrer a loja, atender um cliente difícil, carregar mercadoria ou estudar para uma prova também pode ser uma forma de servir a Deus.", "Às vezes ninguém nota o seu esforço e o chefe só vê os erros. O versículo lembra que Deus vê, sim, e que a sua recompensa final vem dele. Isso não significa trabalhar sem descanso nem aceitar injustiças em silêncio, mas fazer a sua parte com honestidade e boa atitude. Hoje, antes de começar, você pode oferecer a Deus toda a sua jornada."], "pregunta": "Como mudaria o seu dia se você fizesse o seu trabalho pensando que o faz para o Senhor?", "oracion": "Jesus, entrego a ti o trabalho deste dia, o grande e o pequeno. Perdoa-me quando reclamo ou faço as coisas de má vontade só porque ninguém está olhando. Dá forças e bom ânimo a {N}. {S}Ajuda-me a agir com honestidade, responsabilidade e gentileza com quem trabalha comigo. Que o meu esforço seja uma oferta para ti, e que eu encontre descanso sabendo que tu vês tudo o que faço. Amém.", "txt": "Tudo quanto fizerdes, fazei de coração, como que para o Senhor, e não para as pessoas. Pois sabeis que recebereis do Senhor a recompensa da herança;servi ao Senhor Cristo."}, {"ref": [57, 12, 1, 2], "tema": "Perseverança", "titulo": "Corra com os olhos em Jesus", "med": ["O autor de Hebreus compara a vida de fé a uma corrida longa. Não é uma corrida curta de velocidade, mas de resistência, e por isso ele nos pede que corramos com paciência. Também nos anima a deixar toda sobrecarga que nos atrasa, como um corredor que não leva uma mochila cheia de pedras. E nos lembra que não corremos sozinhos: muitos que creram antes de nós terminaram a sua corrida com fidelidade.", "O segredo para não desistir está em onde colocamos o olhar. Se você olha só para as suas forças, as suas quedas ou o caminho que falta, vai desanimar. Mas se fixa os olhos em Jesus, que suportou a cruz por amor, encontra motivo para continuar. Talvez hoje esteja difícil levantar para cumprir as suas responsabilidades, sustentar o seu casamento ou continuar orando por algo. Dê mais um passo, olhando para Jesus."], "pregunta": "Que peso você precisa deixar hoje para continuar correndo com paciência?", "oracion": "Jesus, tu terminaste a tua corrida com amor e fidelidade, mesmo quando isso significou a cruz. Hoje me sinto cansado e às vezes quero parar. Ajuda-me a deixar o que me pesa e a colocar os meus olhos em ti. Dá forças a {N} para não desistir. {S}Quando o caminho ficar longo, lembra-me de que não corro sozinho e de que tu vais à minha frente. Amém.", "txt": "Portanto nós também, posto que estamos rodeados por uma tão grande nuvem de testemunhas, deixemos toda sobrecarga, e o pecado envolvente, e corramos com paciência a corrida que nos está proposta, olhando para Jesus, Autor e aperfeiçoador da fé. Ele, pela alegria que lhe estava proposta, suportou a cruz, desprezando a humilhação, e se assentou à direita do trono de Deus."}]};
const TRIVIA_ALL={"es": [{"q": "¿Cuántos días ayunó Jesús en el desierto?", "o": ["7", "3", "12", "40"], "a": 3, "ref": [39, 4, 2], "exp": "Jesús ayunó cuarenta días y cuarenta noches (Mateo 4)."}, {"q": "En la parábola del hijo pródigo, ¿qué animales tuvo que cuidar el hijo?", "o": ["Ovejas", "Cabras", "Cerdos", "Camellos"], "a": 2, "ref": [41, 15, 15], "exp": "Lo enviaron a su hacienda para que apacentara los cerdos (Lucas 15)."}, {"q": "¿Cuál fue el nuevo nombre que Dios le dio a Sarai?", "o": ["Rebeca", "Raquel", "Débora", "Sara"], "a": 3, "ref": [0, 17, 15], "exp": "Dios le dijo a Abraham que su mujer ya no se llamaría Sarai, sino Sara (Génesis 17)."}, {"q": "¿Quién guió a Israel después de la muerte de Moisés?", "o": ["Aarón", "Josué", "Caleb", "Samuel"], "a": 1, "ref": [5, 1, 2], "exp": "Dios le dijo a Josué que se levantara y pasara el Jordán con el pueblo (Josué 1)."}, {"q": "¿Cuántos panes y peces había antes de que Jesús alimentara a la multitud?", "o": ["5 panes y 2 peces", "7 panes y 3 peces", "2 panes y 5 peces", "12 panes y 1 pez"], "a": 0, "ref": [39, 14, 17], "exp": "Los discípulos dijeron: No tenemos aquí sino cinco panes y dos peces (Mateo 14)."}, {"q": "¿Cuántos días y noches llovió durante el diluvio?", "o": ["7", "12", "40", "100"], "a": 2, "ref": [0, 7, 12], "exp": "Hubo lluvia sobre la tierra cuarenta días y cuarenta noches (Génesis 7)."}, {"q": "¿Qué discípulo dijo que no creería hasta ver las marcas de los clavos?", "o": ["Pedro", "Tomás", "Juan", "Felipe"], "a": 1, "ref": [42, 20, 25], "exp": "Tomás dijo que si no veía la señal de los clavos no creería (Juan 20)."}, {"q": "En la parábola, ¿quién ayudó al hombre herido en el camino?", "o": ["Un sacerdote", "Un levita", "Un soldado romano", "Un samaritano"], "a": 3, "ref": [41, 10, 33], "exp": "Un samaritano que pasaba lo vio y fue movido a misericordia (Lucas 10)."}, {"q": "¿Qué reina arriesgó su vida para salvar a su pueblo ante el rey persa?", "o": ["Ester", "Vasti", "Jezabel", "La reina de Sabá"], "a": 0, "ref": [16, 7, 3], "exp": "La reina Ester pidió al rey su vida y la de su pueblo (Ester 7)."}, {"q": "¿Cuántos discípulos eligió Jesús?", "o": ["Siete", "Diez", "Doce", "Setenta"], "a": 2, "ref": [40, 3, 14], "exp": "Eligió a doce (Marcos 3:14)."}, {"q": "En la parábola del sembrador, ¿qué representa la semilla?", "o": ["El dinero", "La fe del sembrador", "La palabra de Dios", "Los discípulos"], "a": 2, "ref": [41, 8, 11], "exp": "Jesús explicó: La semilla es la palabra de Dios (Lucas 8)."}, {"q": "¿Qué mar se abrió para que Israel pasara en seco?", "o": ["El mar Muerto", "El mar de Galilea", "El mar Rojo", "El mar Mediterráneo"], "a": 2, "ref": [1, 14, 21], "exp": "Moisés extendió su mano sobre el mar y Dios lo dividió (Éxodo 14)."}, {"q": "¿Cómo subió Elías al cielo?", "o": ["Por una escalera", "Sobre una nube blanca", "En los brazos de un ángel", "En un torbellino, con un carro de fuego"], "a": 3, "ref": [11, 2, 11], "exp": "Un carro de fuego apartó a Elías y Eliseo, y Elías subió al cielo en un torbellino (2 Reyes 2)."}, {"q": "¿Quién dijo: \"Tu pueblo será mi pueblo, y tu Dios mi Dios\"?", "o": ["Rut", "Noemí", "Ester", "Ana"], "a": 0, "ref": [7, 1, 16], "exp": "Rut se lo dijo a su suegra Noemí (Rut 1)."}, {"q": "¿Cómo se llamaba el alimento que Dios envió del cielo en el desierto?", "o": ["Hisopo", "Mirra", "Codorniz dulce", "Maná"], "a": 3, "ref": [1, 16, 31], "exp": "Israel llamó Maná a ese alimento blanco con sabor a hojuelas con miel (Éxodo 16)."}, {"q": "¿De dónde venía la gran fuerza de Sansón, según él mismo?", "o": ["De un anillo mágico", "De comer miel", "De que nunca se había cortado el cabello", "De su espada"], "a": 2, "ref": [6, 16, 17], "exp": "Sansón dijo que si lo rapaban, su fuerza se apartaría de él (Jueces 16)."}, {"q": "Según Juan, ¿cuál fue el primer milagro de Jesús?", "o": ["Sanar a un ciego", "Caminar sobre el agua", "Convertir agua en vino", "Multiplicar los panes"], "a": 2, "ref": [42, 2, 11], "exp": "En las bodas de Caná (Juan 2)."}, {"q": "¿Qué muro reconstruyó Nehemías?", "o": ["El de Jericó", "El de Babilonia", "El de Samaria", "El de Jerusalén"], "a": 3, "ref": [15, 2, 17], "exp": "Nehemías animó al pueblo a edificar el muro de Jerusalén (Nehemías 2)."}, {"q": "¿Cuántos hijos tuvo Jacob (Israel)?", "o": ["12", "7", "10", "14"], "a": 0, "ref": [0, 35, 22], "exp": "La Biblia dice que los hijos de Israel fueron doce (Génesis 35)."}, {"q": "¿Con qué palabras comienza la oración que Jesús enseñó?", "o": ["Señor, ten piedad", "Padre nuestro que estás en los cielos", "Bendito sea el Señor", "Gloria a Dios en las alturas"], "a": 1, "ref": [39, 6, 9], "exp": "Jesús enseñó a orar diciendo: Padre nuestro que estás en los cielos (Mateo 6)."}, {"q": "¿Qué señal puso Dios en las nubes como pacto después del diluvio?", "o": ["Un arco iris", "Una estrella", "Una paloma", "Una columna de fuego"], "a": 0, "ref": [0, 9, 13], "exp": "Dios puso su arco en las nubes como señal de su pacto con la tierra (Génesis 9)."}, {"q": "¿Qué hizo Dios el séptimo día de la creación?", "o": ["Creó al hombre", "Reposó", "Separó las aguas", "Creó las estrellas"], "a": 1, "ref": [0, 2, 2], "exp": "Dios acabó su obra y reposó el día séptimo (Génesis 2)."}, {"q": "¿Quién guio al pueblo de Israel fuera de Egipto?", "o": ["Josué", "Moisés", "Aarón", "José"], "a": 1, "ref": [1, 3, 10], "exp": "Dios envió a Moisés (Éxodo 3)."}, {"q": "¿Cuántos años anduvo Israel por el desierto?", "o": ["7", "20", "70", "40"], "a": 3, "ref": [3, 14, 33], "exp": "Los hijos de Israel anduvieron cuarenta años en el desierto (Números 14)."}, {"q": "¿Qué animal le habló a Balaam?", "o": ["Su caballo", "Su asna", "Un camello", "Una serpiente"], "a": 1, "ref": [3, 22, 28], "exp": "Dios abrió la boca del asna, que habló a Balaam (Números 22)."}, {"q": "¿Cuál era el oficio de Pedro y Andrés antes de seguir a Jesús?", "o": ["Carpinteros", "Pescadores", "Pastores", "Cobradores de impuestos"], "a": 1, "ref": [39, 4, 18], "exp": "Simón Pedro y Andrés echaban la red en el mar, porque eran pescadores (Mateo 4)."}, {"q": "¿A quién le vendió Esaú su primogenitura?", "o": ["A Isaac", "A Labán", "A José", "A Jacob"], "a": 3, "ref": [0, 25, 33], "exp": "Esaú juró y vendió su primogenitura a su hermano Jacob (Génesis 25)."}, {"q": "¿Quién recibió el espíritu de Elías?", "o": ["Jonás", "Eliseo", "Isaías", "Samuel"], "a": 1, "ref": [11, 2, 15], "exp": "Los profetas dijeron: El espíritu de Elías reposó sobre Eliseo (2 Reyes 2)."}, {"q": "¿Cómo se llamaba la madre del profeta Samuel?", "o": ["Elisabet", "Ana", "Rebeca", "Penina"], "a": 1, "ref": [8, 1, 20], "exp": "Ana concibió, dio a luz un hijo y lo llamó Samuel (1 Samuel 1)."}, {"q": "¿Camino a qué ciudad se le apareció a Saulo una luz del cielo?", "o": ["Damasco", "Jerusalén", "Roma", "Antioquía"], "a": 0, "ref": [43, 9, 3], "exp": "Llegando cerca de Damasco, lo rodeó un resplandor de luz del cielo (Hechos 9)."}, {"q": "¿Qué apareció sobre los discípulos el día de Pentecostés?", "o": ["Una paloma blanca", "Una estrella", "Un arco iris", "Lenguas como de fuego"], "a": 3, "ref": [43, 2, 3], "exp": "Se les aparecieron lenguas repartidas, como de fuego (Hechos 2)."}, {"q": "¿Quién mató a su hermano Abel?", "o": ["Set", "Esaú", "Caín", "Lamec"], "a": 2, "ref": [0, 4, 8], "exp": "Caín se levantó contra su hermano Abel en el campo y lo mató (Génesis 4)."}, {"q": "¿De dónde vinieron los magos que buscaban al niño Jesús?", "o": ["Del norte", "De Egipto", "Del oriente", "De Roma"], "a": 2, "ref": [39, 2, 1], "exp": "Unos magos vinieron del oriente a Jerusalén (Mateo 2)."}, {"q": "¿En el banquete de qué rey apareció una mano escribiendo en la pared?", "o": ["Nabucodonosor", "Darío", "Belsasar", "Ciro"], "a": 2, "ref": [26, 5, 5], "exp": "En el banquete del rey Belsasar unos dedos escribieron sobre la pared del palacio (Daniel 5)."}, {"q": "¿Cómo se llamó el hijo que Sara le dio a Abraham?", "o": ["Ismael", "Isaac", "Jacob", "José"], "a": 1, "ref": [0, 21, 3], "exp": "Abraham })();

/* ================= INVITAR A COLABORAR (sin molestar) =================
   Solo en momentos de gratitud: rachas de 7/30/100/365 días, un libro terminado, Navidad, Semana Santa
   y, de vez en cuando, al completar el día. Nunca en la primera semana, como máximo una vez cada 18 días,

function daysBetween(a,b){ const p=x=>{const [y,m,d]=x.split("-").map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5) }
function easterDate(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da) }
function season(now=new Date()){
  const y=now.getFullYear();
  if(now.getMonth()===11&&now.getDate()<=25) return {key:"xmas-"+y,kind:"xmas"};
  const e=easterDate(y), palm=new Date(e); palm.setDate(e.getDate()-7);
  const d0=new Date(y,now.getMonth(),now.getDate());
  if(d0>=palm&&d0<=e) return {key:"easter-"+y,kind:"easter"};
  return null;
}
function usageStats(){ return {c:Object.keys(S.readCh||{}).length, p:S.prayN||0, h:Object.values(S.hl).filter(h=>h.c).length} }
function currentAsk(allDone){
  if(S.member) return null;
  if(!S.first||daysBetween(S.first,TODAY)<7) return null;
  if(S.askLast&&daysBetween(S.askLast,TODAY)<18) return null;
  const A=T.ask, shown=S.askShown||{};
  const se=season(); if(se&&!shown[se.key]) return {key:se.key,title:A[se.kind],body:A[se.kind+"Body"]};
  const sk=streak();
  for(const m of [365,100,30,7]) if(sk>=m&&sk<m+7&&!shown["s"+m]) return {key:"s"+m,title:A["s"+m],body:A.body};
  for(const b of Object.keys(S.booksDone||{})) if(!shown["b"+b]&&daysBetween(S.booksDone[b],TODAY)<=7) return {key:"b"+b,title:A.book(BOOKS[+b]),body:A.body};
  if(allDone&&daysBetween(S.askLast||S.first,TODAY)>=30) return {key:"d"+TODAY,title:A.day,body:A.body};
  return null;
}

const Music={on:false,ctx:null,master:null,timer:null,i:0,
  start(){ try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    this.ctx=this.ctx&&this.ctx.state!=="closed"?this.ctx:new C(); const ctx=this.ctx; ctx.resume();

/* ================= VOZ (lectura en voz alta con la voz del dispositivo) ================= */
/* En el teléfono se usa el lector de voz nativo (Android no tiene voz dentro de la parte web).
   En el navegador se usa la voz del navegador. */
const Voice={
  nat(){ try{ const C=window.Capacitor; return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.TextToSpeech||null }catch(e){return null} },
  onWord:null, listening:false,
  ok(){ return !!(this.nat()||("speechSynthesis" in window)) },
  pickWebVoice(){ const vs=speechSynthesis.getVoices(); for(const p of T.voices){ const v=vs.find(x=>x.lang&&x.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase())); if(v)return v } return null },
  /* Habla un texto. Llama onWord(posición) en cada palabra y resuelve al terminar. */
  speak(text,onWord){
    this.onWord=onWord;
    const N=this.nat();
    if(N){
      if(!this.listening){ this.listening=true; try{ N.addListener("onRangeStart",i=>{ this.onWord&&this.onWord(i.start) }) }catch(e){} }
      return N.speak({text,lang:T.speechLang,rate:S.speed,pitch:1,volume:1,category:"playback"}).catch(()=>{});
    }
    return new Promise(res=>{
      const u=new SpeechSynthesisUtterance(text); u.lang=T.speechLang; const vo=this.pickWebVoice(); if(vo)u.voice=vo; u.rate=S.speed;
      u.onboundary=e=>{ if(e.name&&e.name!=="word")return; this.onWord&&this.onWord(e.charIndex) };
      u.onend=res; u.onerror=res;
      speechSynthesis.speak(u);
    });
  },
  stop(){ this.onWord=null; const N=this.nat(); if(N){ N.stop().catch(()=>{}) } else { try{speechSynthesis.cancel()}catch(e){} } },
  canPause(){ return !this.nat() }
};
const TTS={list:[],i:0,on:false,paused:false,label:"",onDone:null,token:0,chapterEnd:null};
function ttsOK(){ if(!Voice.ok()){toast(T.noTTS);return false}return true }
function speakSimple(text,label,onDone){ if(!ttsOK())return; startTTS([{text}],label,onDone) }
function startTTS(list,label,onDone){
  stopTTS(true); TTS.list=list; TTS.i=0; TTS.on=true; TTS.paused=false; TTS.label=label; TTS.onDone=onDone; TTS.token++;
  renderPlayer(); nextTTS(TTS.token);
}
function nextTTS(tok){
  if(tok!==TTS.token||!TTS.on||TTS.paused)return;
  const it=TTS.list[TTS.i];
  if(!it){ const done=TTS.onDone; if(TTS.chapterEnd&&TTS.chapterEnd()) return; stopTTS(); done&&done(); return; }
  document.querySelectorAll(".v.reading").forEach(e=>e.classList.remove("reading"));
  let spans=null;
  if(it.el){ it.el.classList.add("reading"); it.el.scrollIntoView({block:"center",behavior:"smooth"}); spans=wordify(it.el,it.text); }
  const mark=pos=>{ if(!spans||tok!==TTS.token)return; let cur=null; for(const sp of spans){ if(+sp.dataset.s<=pos)cur=sp; else break } spans.forEach(sp=>sp.classList.toggle("now",sp===cur)); };
  Voice.speak(it.text,mark).then(()=>{
    if(spans)spans.forEach(sp=>sp.classList.remove("now"));
    if(tok!==TTS.token||TTS.paused)return;
    TTS.i++; nextTTS(tok);
  });
}
function wordify(el,text){ const t=el.querySelector(".t"); if(!t)return null; let html="",re=/\S+/g,m,last=0; while((m=re.exec(text))){html+=esc(text.slice(last,m.index))+`<span class="w" data-s="${m.index}">${esc(m[0])}</span>`;last=m.index+m[0].length} html+=esc(text.slice(last)); t.innerHTML=html; return [...t.querySelectorAll(".w")]; }
function stopTTS(silent){ TTS.on=false; TTS.paused=false; TTS.token++; TTS.chapterEnd=null; Voice.stop(); document.querySelectorAll(".v.reading").forEach(e=>e.classList.remove("reading")); document.querySelectorAll(".w.now").forEach(e=>e.classList.remove("now")); if(!silent){ renderPlayer(); if(Music.on){Music.stop();syncMusicBtn()} } }
function pauseTTS(){
  TTS.paused=true;
  if(Voice.canPause()){ try{speechSynthesis.pause()}catch(e){} }
  else { TTS.token++; Voice.stop(); }   /* en el teléfono: se detiene y al seguir vuelve a leer el versículo actual */
}
function resumeTTS(){
  TTS.paused=false;
  if(Voice.canPause()){ try{speechSynthesis.resume()}catch(e){} }
  else { TTS.token++; nextTTS(TTS.token); }
}
function renderPlayer(){
  let p=$("#player"); if(!TTS.on){p&&p.remove();return}
  if(!p){p=document.createElement("div");p.id="player";p.className="player";document.body.appendChild(p)}
  p.innerHTML=`<div class="player-in"><button id="pl-pp" aria-label="${TTS.paused?T.resume:T.pause}">${ico(TTS.paused?"i-play":"i-pause")}</button><div class="t">${esc(TTS.label)}</div><button class="spd" id="pl-sp" aria-label="${T.speed}">${S.speed}x</button><button id="pl-st" aria-label="${T.stop}">${ico("i-stop")}</button></div>`;
  $("#pl-pp").onclick=()=>{ TTS.paused?resumeTTS():pauseTTS(); renderPlayer() };
  $("#pl-sp").onclick=()=>{ const sp=[0.6,0.75,1,1.25,1.5]; S.speed=sp[(sp.indexOf(S.speed)+1)%sp.length]; save(); toast(T.speedToast(S.speed)); renderPlayer() };
  $("#pl-st").onclick=()=>stopTTS();
}

function moveChap(d){ const data=BIBLE; let {b,c}=S.last; c+=d; if(c<1){b--; if(b<0)return false; c=data[b].length} else if(c>data[b].length){b++; if(b>65)return false; c=1} S.last={b,c}; save(); clearSel(); window.scrollTo(0,0); return renderBiblia() }

/* ---- Búsqueda ---- */
/* Entiende citas como "Isaías 41:10", "is 41 10", "Salmo 23", "1 Juan 4:8", "Jn 3:16-18" */
function parseRef(q){
  const raw=q.toLowerCase().replace(/\s+/g," ").trim();
  const m=norm(raw).match(/^([1-3]?\s?[a-zñ]+(?:\s[a-zñ]+){0,2})\.?\s*(\d{1,3})(?:\s*[:.,\s]\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?)?$/);
  if(!m) return null;
  const key=m[1].replace(/\s/g,"");
  const rawBook=(raw.match(/^([1-3]?\s?\D+?)\.?\s*\d/)||[])[1];
  let b=rawBook!==undefined?BOOKS.findIndex(n=>n.toLowerCase().replace(/\s/g,"")===rawBook.replace(/\s/g,"")):-1;
  if(b<0) b=T.bookAbbr[key];
  if(b===undefined||b<0){ const names=BOOKS.map(n=>norm(n).replace(/\s/g,"")); b=names.findIndex(n=>n===key); if(b<0) b=names.findIndex(n=>n.startsWith(key)&&key.length>=2); if(b<0) return null; }
  const c=+m[2], v=m[3]?+m[3]:0, v2=m[4]?+m[4]:0;
  return {b,c,v,v2};
}
function refOk(r){ const d=BIBLE; if(!d)return true; const ch=d[r.b][r.c-1]; if(!ch)return false; if(r.v&&!ch[r.v-1])return false; if(r.v2&&(!ch[r.v2-1]||r.v2<r.v))return false; return true }
function refLabel(r){ return r.v?refName(r.b,r.c,r.v,r.v2):(r.b===18?T.psalm(r.c):`${BOOKS[r.b]} ${r.c}`) }
function openSearch(){
  bible().catch(()=>{});
  sheet(`${sheetHead(T.searchTitle)}
    <form class="searchbox" id="sf"><input class="input" id="sq" placeholder="${esc(T.searchPh)}" autocomplete="off" enterkeyhint="search"><button class="btn primary">${T.search}</button></form>
    <div id="sgo"></div>
    <div class="results" id="sr"><p class="muted">${T.searchHint}</p></div>`,(el,close)=>{
    el.querySelector("[data-x]").onclick=close; const q=el.querySelector("#sq"); setTimeout(()=>q.focus(),100);
    const jump=r=>{ S.last={b:r.b,c:r.c}; save(); close(); stopTTS(); go("biblia",{v:r.v||0,v2:r.v2||0}) };
    const showGo=()=>{ const r=parseRef(q.value), box=el.querySelector("#sgo");
      if(!r){ box.innerHTML=""; return null }
      if(!refOk(r)){ box.innerHTML=`<p class="muted" style="margin:10px 0 0">${esc(T.refNotFound(refLabel(r)))}</p>`; return null }
      box.innerHTML=`<button class="btn primary gobtn" id="go-ref">${ico("i-book")}${esc(T.goTo(refLabel(r)))}</button>`;
      el.querySelector("#go-ref").onclick=()=>jump(r); return r };
    q.oninput=showGo;
    el.querySelector("#sf").onsubmit=async e=>{ e.preventDefault();
      const r=showGo(); if(r){ jump(r); return }
      const term=norm(q.value.trim()); if(term.length<2)return;
      const out=el.querySelector("#sr"); out.innerHTML=`<p class="muted">${T.searching}</p>`; const data=await bible(); const res=[];
      outer: for(let b=0;b<66;b++)for(let c=0;c<data[b].length;c++)for(let v=0;v<data[b][c].length;v++){ const t=data[b][c][v]; if(norm(t).includes(term)){res.push([b,c+1,v+1,t]); if(res.length>=150)break outer} }
      out.innerHTML=res.length?`<p class="muted">${T.results(res.length)}</p>`+res.map(([b,c,v,t])=>{ const i=norm(t).indexOf(term); const hl=esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+term.length))+"</mark>"+esc(t.slice(i+term.length)); return `<button class="result" data-r="${b},${c},${v}"><b>${refName(b,c,v)}</b><span>${hl}</span></button>`}).join(""):`<p class="muted">${esc(T.noResults(q.value))}</p>`;
      out.querySelectorAll("[data-r]").forEach(r=>r.onclick=()=>{const [b,c,v]=r.dataset.r.split(",").map(Number);S.last={b,c};save();close();go("biblia",{v})});
    };
  });
}

  g.fillStyle="#F3E6CF";g.textAlign="center";g.font=`italic 500 ${size}px "Literata", Georgia, serif`;
  const words=("“"+text+"”").split(" "),lines=[];let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>W-200){lines.push(line);line=w}else line=t}lines.push(line);
  const lh=size*1.45; let y=H/2-(lines.length*lh)/2+size*.6+80; lines.forEach(l=>{g.fillText(l,W/2,y);y+=lh});

/* ---- Repasar (memorizar jugando) ---- */
async function startMemo(){
  const data=await bible();
  let pool=Object.keys(S.hl).filter(k=>S.hl[k].c).map(k=>k.split(".").map(Number));
  const fromMine=pool.length>0;
  if(!pool.length){const [b,c,v]=DEVO.ref;pool=[[b,c,v]]}
  const [b,c,v]=pool[Math.floor(Math.random()*pool.length)];
  const text=data[b][c-1][v-1]; const words=text.split(" ");
  const clean=w=>w.replace(/[^\p{L}\p{N}]/gu,"");
  const cand=words.map((w,i)=>[w,i]).filter(([w])=>clean(w).length>3);
  const want=Math.min(cand.length,Math.max(3,Math.min(6,Math.round(words.length/4))));
  const hidden=cand.sort(()=>Math.random()-.5).slice(0,want).map(x=>x[1]).sort((a,z)=>a-z);
  let step=0;
  const draw=()=>words.map((w,i)=>{const h=hidden.indexOf(i);if(h<0)return esc(w);return `<span class="blank ${h<step?"filled":""}">${esc(h<step?w:clean(w))}</span>`}).join(" ");
  const opts=hidden.map(i=>clean(words[i])).sort(()=>Math.random()-.5);
  sheet(`${sheetHead(esc(T.reviewTitle(refName(b,c,v))))}
    <p class="muted" style="margin-top:0">${fromMine?T.reviewMine:T.reviewDefault} ${T.reviewHow}</p>
    <div class="memo-text" id="mt">${draw()}</div>
    <div class="memo-words" id="mw">${opts.map((w,k)=>`<button data-k="${k}">${esc(w)}</button>`).join("")}</div>
    <div id="mres"></div>`,(el,close)=>{
    el.querySelector("[data-x]").onclick=close;
    el.querySelectorAll("#mw button").forEach(btn=>btn.onclick=()=>{
      if(norm(opts[+btn.dataset.k])===norm(clean(words[hidden[step]]))){ btn.classList.add("used"); step++; el.querySelector("#mt").innerHTML=draw();
        if(step===hidden.length){ S.memo=(S.memo||0)+1; save(); el.querySelector("#mres").innerHTML=`<div class="done-banner"><h3>${T.wellDone}</h3><p class="muted" style="margin:6px 0 10px">${T.reviewedTimes(S.memo)}</p><button class="btn primary" id="again">${T.another}</button></div>`; el.querySelector("#again").onclick=()=>{close();startMemo()} } }
      else { btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake") }
    });
  });
}

/* ================= RECORDATORIO DIARIO (notificaciones locales) ================= */
/* Se programan en el propio teléfono los próximos 45 días, cada uno con el título de la meditación de ese día.
   Cada vez que se abre la app se vuelven a programar, así nunca se cortan. */
const Notif={
  N(){ try{ const C=window.Capacitor; return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications||null }catch(e){return null} },
  available(){ return !!this.N() },
  async enable(){
    const N=this.N(); if(!N) return false;
    try{
      let p=await N.checkPermissions();
      if(p.display!=="granted") p=await N.requestPermissions();
      if(p.display!=="granted"){ S.notif=false; save(); toast(T.notifDenied); return false }
      S.notif=true; save(); await this.schedule(); return true;
    }catch(e){ return false }
  },
  async disable(){ S.notif=false; save(); await this.clear() },
  async clear(){ const N=this.N(); if(!N)return; try{ const pend=await N.getPending(); if(pend.notifications.length) await N.cancel({notifications:pend.notifications.map(n=>({id:n.id}))}) }catch(e){} },
  async schedule(){
    const N=this.N(); if(!N) return;
    await this.clear();
    if(!S.notif||!S.wake) return;
    try{ const p=await N.checkPermissions(); if(p.display!=="granted") return }catch(e){ return }
    try{ await N.createChannel({id:"oracion",name:T.notifChannel,importance:4,visibility:1}) }catch(e){}
    const [hh,mm]=S.wake.split(":").map(Number);
    const g=hh<12?T.greet.m:hh<20?T.greet.t:T.greet.n;
    const now=new Date(), list=[];
    for(let i=0;i<45;i++){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm,0);
      if(d<=now) continue;
      const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
      const dv=DEVOS[n%DEVOS.length];
      list.push({id:1000+i,title:T.notifTitle(g,S.name),body:T.notifBody(dv.titulo),schedule:{at:d,allowWhileIdle:true},channelId:"oracion",extra:{tab:"hoy"}});
    }
    try{ if(list.length) await N.schedule({notifications:list}) }catch(e){}
  },
  init(){
    const N=this.N(); if(!N) return;
    try{ N.addListener("localNotificationActionPerformed",()=>go("hoy")) }catch(e){}
    if(S.notif) this.schedule();
  }
};

const ENTITLEMENT="colaborador";

const Pay={
  native:false, ready:false, pkgs:null, busy:false,
  plat(){ try{return window.Capacitor&&window.Capacitor.getPlatform()}catch(e){return "web"} },
  plugin(){ try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Purchases}catch(e){return null} },
  async init(){
    const P=this.plugin(), key=RC_KEYS[this.plat()];
    this.native=!!(P&&key&&window.Capacitor.isNativePlatform());
    if(!this.native) return;
    try{ await P.configure({apiKey:key}); this.ready=true; await this.refresh(); this.load(); }catch(e){ this.ready=false }
  },
  apply(info){
    const active=!!(info&&info.entitlements&&info.entitlements.active&&info.entitlements.active[ENTITLEMENT]);
    if(S.member!==active){ S.member=active; if(!active&&PREMIUM_THEMES.includes(S.read)){S.read="auto";applyRead()} save(); if(tab==="mas")renderMas(); }
  },
  async refresh(){ try{ const r=await this.plugin().getCustomerInfo(); this.apply(r.customerInfo) }catch(e){} },
  async load(){
    try{
      const off=await this.plugin().getOfferings(); const cur=off&&off.current; const list=(cur&&cur.availablePackages)||[];
      const find=t=>list.find(p=>p.packageType===t);
      this.pkgs={once:list.find(p=>!["MONTHLY","ANNUAL"].includes(p.packageType))||null, month:find("MONTHLY")||null, year:find("ANNUAL")||null};

    if(!this.ready){ toast(T.give.notReady); return }
    const pkg=this.pkgs&&this.pkgs[k]; if(!pkg){ toast(T.give.noProducts); return }
    if(this.busy) return; this.busy=true;
    try{
      const r=await this.plugin().purchasePackage({aPackage:pkg});
      this.apply(r.customerInfo);
      if(k==="once"){ S.gave=true; save() }
      openGiftThanks();
    }catch(e){
      if(!(e&&(e.userCancelled||e.code==="1"||e.code===1))) toast(T.give.failed);
    }finally{ this.busy=false; if(tab==="mas")renderMas() }
  },
  async restore(){
    if(!this.native||!this.ready){ toast(T.give.notReady); return }
    try{ const r=await this.plugin().restorePurchases(); this.apply(r.customerInfo); toast(S.member?T.give.restored:T.give.nothingToRestore) }catch(e){ toast(T.give.failed) }

  }
