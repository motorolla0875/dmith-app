<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EFE9DC">
<meta name="format-detection" content="telephone=no">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Santa Biblia Reina Valera 1909</title>
<style>
@font-face{font-family:"Literata";src:url("fonts/Literata.ttf") format("truetype");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Literata";src:url("fonts/Literata-Italic.ttf") format("truetype");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/Figtree.ttf") format("truetype");font-weight:300 900;font-style:normal;font-display:swap}
</style>
<style>
/* Layout: una sola columna de lectura (máx. 640px), cabecera fija arriba, barra de pestañas abajo, como una app de teléfono. */
:root{
  --bg:#EFE9DC; --surface:#F8F3E8; --surface-2:#E6DECD; --ink:#2A2823; --muted:#6F6857; --line:#D9CFBB;
  --accent:#8E6312; --accent-ink:#FFF8E8; --accent-soft:#EADAB4; --flame:#E0A23A; --ok:#3F7A4A; --bad:#A4473A;
  --hl-1:rgba(236,190,50,.38); --hl-2:rgba(100,170,100,.32); --hl-3:rgba(80,140,215,.28); --hl-4:rgba(225,110,145,.28); --hl-5:rgba(145,105,205,.30);
  --f-read:"Literata",Georgia,"Times New Roman",serif; --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read-size:20px; --shadow:0 10px 30px rgba(60,45,20,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1916; --surface:#24211D; --surface-2:#2E2A25; --ink:#E9E1D1; --muted:#A1978A; --line:#3A352E;
  --accent:#E3B65A; --accent-ink:#1B1916; --accent-soft:#3A3122; --flame:#E9A949; --ok:#7CBF86; --bad:#E08877;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1916; --surface:#24211D; --surface-2:#2E2A25; --ink:#E9E1D1; --muted:#A1978A; --line:#3A352E;
  --accent:#E3B65A; --accent-ink:#1B1916; --accent-soft:#3A3122; --flame:#E9A949; --ok:#7CBF86; --bad:#E08877;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
/* Temas de lectura elegidos por la persona (pisan al tema del sistema) */
:root:root[data-read="papel"]{ --bg:#EFE9DC; --surface:#F8F3E8; --surface-2:#E6DECD; --ink:#2A2823; --muted:#6F6857; --line:#D9CFBB; --accent:#8E6312; --accent-ink:#FFF8E8; --accent-soft:#EADAB4; --ok:#3F7A4A; --bad:#A4473A; --shadow:0 10px 30px rgba(60,45,20,.16); color-scheme:light }
:root:root[data-read="sepia"]{ --bg:#E6D8BC; --surface:#EFE3CA; --surface-2:#DCCBA9; --ink:#3A2C1B; --muted:#76624A; --line:#CDB993; --accent:#86561A; --accent-ink:#FFF4DE; --accent-soft:#DCC296; --ok:#4D6F37; --bad:#9A4532; --shadow:0 10px 30px rgba(70,45,15,.2); color-scheme:light }
:root:root[data-read="noche"]{ --bg:#1B1916; --surface:#24211D; --surface-2:#2E2A25; --ink:#E9E1D1; --muted:#A1978A; --line:#3A352E; --accent:#E3B65A; --accent-ink:#1B1916; --accent-soft:#3A3122; --ok:#7CBF86; --bad:#E08877; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
:root:root[data-read="ambar"]{ --bg:#16110C; --surface:#1F1811; --surface-2:#2A2017; --ink:#EBCB9C; --muted:#A88B65; --line:#3A2D20; --accent:#F0A94A; --accent-ink:#16110C; --accent-soft:#3B2A17; --ok:#B9C27A; --bad:#E58B6A; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }
:root:root[data-read="olivo"]{ --bg:#E4E6D3; --surface:#EEF0E0; --surface-2:#D7DBBF; --ink:#262A1C; --muted:#636A4E; --line:#C7CCAA; --accent:#5C6B22; --accent-ink:#F6F8E8; --accent-soft:#D3DBA8; --ok:#3F7A4A; --bad:#A4473A; --shadow:0 10px 30px rgba(45,55,20,.16); color-scheme:light }
:root:root[data-read="estrellas"]{ --bg:#141A2B; --surface:#1B2338; --surface-2:#252E47; --ink:#E6E3D6; --muted:#9AA0B4; --line:#2E3854; --accent:#E8C66A; --accent-ink:#141A2B; --accent-soft:#2E3350; --ok:#86C59A; --bad:#E59484; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
/* Que la app no se pueda mover hacia los costados ni hacer zoom: solo desplazamiento vertical */
html{overflow-x:hidden}
body{overflow-x:clip}
html,body{width:100%;max-width:100%;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{touch-action:pan-y}
.chips,.act-row,.chapgrid,.bookgrid{touch-action:pan-x pan-y}
img,svg,canvas{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;transition:background .35s,color .35s}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:0 150px}
h1,h2,h3{font-family:var(--f-read);font-weight:500;text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* Cabecera */
.top{position:relative;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-read);font-size:19px;font-weight:600;flex:1;min-width:0}
.lamp{width:26px;height:26px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:19px;height:19px}

/* Pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}

/* HOY */
.hello{padding-block:22px 6px}
.hello h1{font-size:30px;line-height:1.15}
.hello .date{margin-top:4px}
.streak{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.flame{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.flame svg{width:18px;height:18px;color:var(--flame)}
.steps{display:flex;gap:6px}
.dot{width:26px;height:6px;border-radius:4px;background:var(--surface-2)}
.dot.done{background:var(--accent)}

.verse-day{margin-top:18px;padding:26px 22px 22px;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--flame) 30%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.verse-day blockquote{margin:10px 0 0;font-family:var(--f-read);font-size:22px;line-height:1.5;font-style:italic}
.verse-day .ref{margin-top:12px;font-weight:600;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px}

.block{margin-top:26px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.block-h h2{font-size:22px}
.check{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.check.done{color:var(--ok)}
.check svg{width:15px;height:15px}
.prose p{font-family:var(--f-read);font-size:18px;line-height:1.7;margin:0 0 14px;max-width:62ch}
.ask{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-family:var(--f-read);font-style:italic;font-size:17px;margin:4px 0 0}
.prayer{padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.thanks{margin-top:16px;padding:18px;border-radius:18px;border:1px dashed var(--line)}
.thanks h3{font-size:19px}
.thanks p.muted{margin:4px 0 0;font-size:14px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0;margin:12px 0 0;justify-content:flex-start}
.chips.wrap .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}
.linkbtn{margin-top:12px;color:var(--accent);font-weight:600;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
.prayer p{font-family:var(--f-read);font-size:19px;line-height:1.7;margin:0}
.music{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:currentColor;border-radius:2px;height:4px}
.playing .bars i{animation:eq 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.7s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.card{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:500}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.feedback{margin-top:10px;font-size:14.5px}
.psalm{display:flex;align-items:center;gap:14px}
.psalm .num{font-family:var(--f-read);font-size:40px;line-height:1;color:var(--accent);min-width:56px}
.done-banner{margin-top:26px;padding:20px;border-radius:18px;text-align:center;background:var(--accent-soft)}
.done-banner h3{font-size:21px}

/* BIBLIA */
.reader-bar{display:flex;gap:8px;align-items:center;padding-block:14px 4px;flex-wrap:wrap}
.reader-bar .grow{flex:1}
.chap-title{font-family:var(--f-read);font-size:28px;margin:14px 0 4px;font-weight:500}
.chapter{font-family:var(--f-read);font-size:var(--read-size);line-height:1.75;margin-top:8px}
.v{padding:2px 4px;margin:0 -4px;border-radius:6px;cursor:pointer;transition:background .2s}
.v sup{font-family:var(--f-ui);font-size:.55em;font-weight:700;color:var(--accent);margin-right:3px;vertical-align:.6em}
.v.c1{background:var(--hl-1)}.v.c2{background:var(--hl-2)}.v.c3{background:var(--hl-3)}.v.c4{background:var(--hl-4)}.v.c5{background:var(--hl-5)}
.v.sel{text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:5px;text-decoration-thickness:2px}
.v.reading{box-shadow:inset 0 -2px 0 var(--accent)}
.v .w.now{background:var(--accent);color:var(--accent-ink);border-radius:4px}
.v .note-ico{display:inline-block;width:.8em;height:.8em;margin-left:3px;color:var(--accent);vertical-align:-.05em}
.chap-nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

.searchbox{display:flex;gap:8px;margin-top:10px}
.input{width:100%;max-width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.pulse{animation:pulse 1.4s ease-in-out 4}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent)}}
.info-list .li{width:100%;text-align:left;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.info-list .li svg{width:18px;height:18px;color:var(--muted)}
.info-list .li.danger{color:var(--bad)}
.danger-btn{background:var(--bad);color:#fff}
.ask-card{margin-top:26px;padding:22px;border-radius:20px;background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--flame) 26%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.ask-card h3{font-size:21px;margin-top:8px}
.ask-card p{margin:8px 0 0;font-family:var(--f-read);font-size:16.5px;line-height:1.6}
.ask-card .ask-stats{font-family:var(--f-ui);font-size:14px}
.ask-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ask-ico svg{width:22px;height:22px}
.give-stats{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.why p{font-size:17px}
.gift-thanks{text-align:center;padding:8px 4px 4px}
.gift-thanks .glow{width:80px;height:80px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--flame) 50%,transparent),transparent 70%);color:var(--accent)}
.gift-thanks .glow svg{width:40px;height:40px}
.gift-thanks h3{font-size:24px}
.gift-thanks blockquote{margin:16px 0;padding:14px 16px;border-radius:14px;background:var(--surface);font-family:var(--f-read);font-style:italic;font-size:17px;line-height:1.6}
.gift-thanks cite{display:block;margin-top:6px;font-style:normal;font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--accent)}
.gobtn{width:100%;margin-top:10px;padding:13px}
.results{margin-top:10px}
.result{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.result b{color:var(--accent);font-size:13px}
.result span{display:block;font-family:var(--f-read);font-size:16px;margin-top:2px}
mark{background:var(--hl-1);color:inherit;border-radius:3px}

/* Barra de acciones de versículo */
.actions{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.actions-in{pointer-events:auto;max-width:600px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);position:relative}
.sw[data-c="1"]{background:#ECBE32}.sw[data-c="2"]{background:#64AA64}.sw[data-c="3"]{background:#508CD7}.sw[data-c="4"]{background:#E16E91}.sw[data-c="5"]{background:#9169CD}
.sw.clear{background:var(--bg);display:grid;place-items:center}
.sw.clear svg{width:16px;height:16px}
.act-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.act-row .btn{flex:none}

/* Reproductor */
.player{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:34;display:flex;justify-content:center;padding:0 12px}
.player-in{max-width:600px;width:100%;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:16px;padding:9px 10px;box-shadow:var(--shadow)}
.player-in .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-in button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.player-in button svg{width:20px;height:20px}
.player-in .spd{width:auto;padding:0 9px;font-weight:700;font-size:13px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent)}

/* MIS VERSÍCULOS */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 6px;margin-top:10px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.chip i{width:12px;height:12px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mine{display:grid;gap:10px;margin-top:12px}
.mine-item{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.mine-item .r{font-weight:700;font-size:13px;color:var(--accent)}
.mine-item .x{font-family:var(--f-read);font-size:17px;line-height:1.55;margin-top:4px}
.mine-item .n{margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}
.empty{text-align:center;padding:30px 10px}
.empty svg{width:54px;height:54px;color:var(--accent);opacity:.7}

/* MÁS */
.list{display:grid;gap:0;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li label{font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.badge{padding:14px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:12.5px;font-weight:600}
.badge .m{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.badge .m svg{width:22px;height:22px}
.badge.off{opacity:.42}
.badge.off .m{background:var(--surface-2);color:var(--muted)}
.give{margin-top:10px;padding:22px;border-radius:20px;background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--flame) 28%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.give h3{font-size:22px}
.give p{margin:8px 0 0;max-width:52ch}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tier{padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center}
.tier b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.tier span{font-size:12px;color:var(--muted)}
.tier:disabled{opacity:.55}
.tier.feat{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button.locked{opacity:.6}
.seg button .lk{display:inline-block;width:12px;height:12px;margin-left:4px;vertical-align:-1px}
.member{display:flex;gap:12px;align-items:center;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--accent-soft)}
.member svg{width:26px;height:26px;color:var(--accent);flex:none}
.give-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.give-links a{color:var(--accent);font-weight:600}
.give-links button{color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.perks{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.perks li{display:flex;gap:8px;font-size:14px}
.perks svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.noads{display:flex;gap:10px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line)}
.noads svg{width:24px;height:24px;color:var(--accent);flex:none}

/* Modales */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,15,8,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{flex:1;font-size:21px}
.books h4{margin:14px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.bookgrid button{text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px}
.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chapgrid button{padding:12px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.chapgrid button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.share-img{display:block;width:min(100%,320px);margin:6px auto 0;border-radius:14px;box-shadow:var(--shadow)}
textarea.input{min-height:110px;font-family:var(--f-read);font-size:16px;resize:vertical}

/* Bienvenida */
.welcome{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.welcome-in{max-width:520px;width:100%;padding:44px 22px 40px;display:flex;flex-direction:column;gap:16px}
.welcome .glow{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--flame) 45%,transparent),transparent 70%)}
.welcome .glow svg{width:48px;height:48px}
.welcome h1{font-size:34px;line-height:1.15}
.welcome p.lead{font-family:var(--f-read);font-size:18px;line-height:1.6;margin:0}
.field{display:grid;gap:6px}
.field label{font-weight:600}
.field small{color:var(--muted)}

/* Memorizar */
.memo-text{font-family:var(--f-read);font-size:20px;line-height:1.9}
.memo-text .blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);text-align:center;color:transparent}
.memo-text .blank.filled{color:var(--accent);font-weight:600}
.memo-words{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.memo-words button{padding:9px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-read);font-size:16px}
.memo-words button.used{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.ver-note{font-size:12.5px;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
const DEVOS_ALL={"es": [{"ref": [18, 119, 105, 105], "tema": "Guía", "titulo": "Una luz para el próximo paso", "med": ["Una lámpara antigua no iluminaba todo el camino. Alcanzaba para ver dónde apoyar el pie, y nada más. Así funciona muchas veces la Palabra de Dios en nuestra vida: no nos muestra todo el futuro, pero nos alcanza para dar el próximo paso con seguridad.", "Quizás hoy tengas preguntas sin respuesta. Está bien. No hace falta ver el final del camino para caminar tranquilo. Basta con saber que Dios va adelante y que su Palabra ilumina lo que tienes justo enfrente."], "pregunta": "¿Cuál es el próximo paso que necesitas dar hoy, aunque todavía no veas todo el camino?", "oracion": "Señor, gracias porque tu Palabra es luz. Hoy pongo en tus manos a {N}. Cuando no sepa qué hacer, muéstrame el próximo paso. Quita el miedo de lo que no veo y dame paz para avanzar. {S}Que hoy camine confiando en ti. Amén.", "txt": "Lámpara es a mis pies tu palabra, y lumbrera a mi camino."}, {"ref": [5, 1, 9, 9], "tema": "Valentía", "titulo": "Esfuérzate y sé valiente", "med": ["Josué tenía por delante una tarea enorme. Dios no le prometió que sería fácil, pero le dio una razón para ser valiente: Él iría con él a donde fuera.", "La valentía no es no tener miedo. Es dar el paso aun con miedo, sabiendo que no vamos solos."], "pregunta": "¿Qué paso valiente te está pidiendo Dios en esta etapa?", "oracion": "Señor, a veces me falta valor. Hoy te pido que acompañes a {N} a donde vaya. {S}Quita el desánimo y dame coraje para hacer lo correcto. Gracias porque vas conmigo. Amén.", "txt": "Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que fueres."}, {"ref": [15, 8, 10, 10], "tema": "Alegría", "titulo": "La alegría que fortalece", "med": ["El pueblo de Israel lloraba al escuchar la ley de Dios, porque veía cuánto se había alejado. Pero Nehemías les dijo que no se entristecieran: era un día santo, día de celebrar, comer juntos y compartir con quien no tenía nada. Y les dejó una verdad poderosa: el gozo del Señor es nuestra fuerza. La alegría que viene de Dios no niega los problemas, pero nos sostiene en medio de ellos.", "Esta alegría no depende de que todo salga perfecto. Nace de saber que somos amados y perdonados. Fíjate también que el texto une la alegría con la generosidad: enviar porciones a quienes no tenían preparado. Hoy puedes vivir ese gozo de forma práctica: compartir una comida, llamar a alguien que está solo, agradecer en voz alta. Cuando la alegría de Dios llena el corazón, se nota en la mesa y en las manos abiertas."], "pregunta": "¿Con quién podrías compartir hoy algo de lo que tienes para que también se alegre?", "oracion": "Jesús, a veces la tristeza y el cansancio me quitan las fuerzas. Hoy te pido que tu alegría sea mi fortaleza, aunque no todo esté resuelto. Llena de gozo el corazón de {N}. {S}Enséñame a celebrar tu bondad en lo cotidiano y a compartir con quienes tienen menos que yo. Que mi alegría no dependa de las circunstancias, sino de saber que tú estás conmigo y me amas. Amén.", "txt": "Díjoles luego: Id, comed grosuras, y bebed vino dulce, y enviad porciones a los que no tienen prevenido; porque día santo es a nuestro Señor: y no os entristezcáis, porque el gozo de Jehová es vuestra fortaleza."}, {"ref": [49, 2, 3, 4], "tema": "Humildad", "titulo": "Mirar también a los demás", "med": ["Pablo pide no hacer nada por rivalidad ni por querer quedar bien. La humildad que propone no es pensar que no valemos nada, sino dejar de ponernos siempre en el centro. Significa considerar a los demás como importantes y prestar atención a sus necesidades, no solo a las propias. Es una forma de amar que se parece mucho a la de Jesús.", "En la vida diaria se nota en detalles: dejar que otro tenga la razón en una discusión sin importancia, celebrar el logro de un compañero sin envidia, ceder el asiento, preguntar cómo está alguien y escuchar de verdad la respuesta. La humildad libera, porque ya no tenemos que demostrar todo el tiempo quiénes somos. Dios nos mira con amor, y eso basta."], "pregunta": "¿En qué situación de esta semana podrías poner los intereses de otra persona antes que los tuyos?", "oracion": "Jesús, tú, siendo Señor de todo, te hiciste servidor de todos. Perdóname por las veces que busco quedar bien, competir o tener siempre la última palabra. Forma un corazón humilde en {N}. {S}Abre mis ojos para ver las necesidades de quienes me rodean y dame alegría al servirlos. Que no necesite el aplauso de nadie, porque tu amor me alcanza y me sostiene. Amén.", "txt": "Nada hagáis por contienda o por vanagloria; antes bien en humildad, estimándoos inferiores los unos a los otros: No mirando cada uno a lo suyo propio, sino cada cual también a lo de los otros."}, {"ref": [5, 24, 15, 15], "tema": "Familia", "titulo": "Yo y mi casa", "med": ["Josué reunió al pueblo y le puso delante una decisión: a quién iban a servir. Luego habló por él y por los suyos, y dijo que su casa serviría al Señor. No esperó a que todos estuvieran de acuerdo; tomó la decisión primero en su propio corazón. La fe en la familia empieza muchas veces con alguien que se anima a dar el primer paso.", "Servir a Dios en casa no requiere un hogar perfecto. Se nota en cosas sencillas: pedir disculpas después de una discusión, dar gracias juntos antes de comer, escuchar sin el celular en la mano, tener paciencia con los hijos o con los padres mayores. Tal vez en tu familia nadie más ora todavía. Tu fidelidad tranquila, día tras día, puede ser una semilla que Dios haga crecer."], "pregunta": "¿Qué gesto concreto podrías tener hoy para que tu casa refleje el amor de Dios?", "oracion": "Señor, gracias por mi familia, con sus alegrías y también con sus dificultades. Quiero que mi casa sea un lugar donde se te honre, aunque a veces no sepa cómo empezar. Guarda el hogar de {N}. {S}Dame paciencia para escuchar, humildad para pedir perdón y ternura para cuidar a los míos. Que nuestras palabras y nuestras acciones muestren que te servimos a ti. Amén.", "txt": "Y si mal os parece servir a Jehová, escogeos hoy a quién sirváis; si a los dioses a quienes sirvieron vuestros padres, cuando estuvieron de esotra parte del río, o a los dioses de los Amorrheos en cuya tierra habitáis: que yo y mi casa serviremos a Jehová."}, {"ref": [50, 3, 12, 12], "tema": "Compasión", "titulo": "Vestidos de misericordia", "med": ["Cada mañana elegimos qué ropa ponernos. Pablo usa esa imagen para decirnos que también debemos vestirnos por dentro: de compasión, bondad, humildad, mansedumbre y paciencia. Lo hace recordándonos primero quiénes somos: escogidos, santos y amados por Dios. No somos compasivos para ganar su amor, sino porque ya lo hemos recibido.", "La compasión se nota en detalles concretos: ceder el asiento en el autobús, tener paciencia con un adulto mayor que tarda en la fila, no burlarse del error de otro. A veces el cansancio nos hace ásperos, por eso necesitamos volver a vestirnos de misericordia una y otra vez. Hoy, antes de salir de casa, pídele a Dios que te ayude a mirar a los demás como Él te mira a ti."], "pregunta": "¿Con qué persona te cuesta más tener paciencia y cómo podrías mostrarle compasión hoy?", "oracion": "Padre bueno, gracias porque me escogiste y me amas sin merecerlo. Hoy quiero vestirme de tu compasión y tu bondad. Quita de mí la dureza, el orgullo y la impaciencia que a veces lastiman a los que me rodean. {S}Ayúdame a tratar a cada persona con la misma misericordia que tú tienes conmigo. Muestra tu ternura a {N}. Que mis manos y mis palabras lleven algo de tu amor hoy. Amén.", "txt": "Vestíos pues, como escogidos de Dios, santos y amados, de entrañas de misericordia, de benignidad, de humildad, de mansedumbre, de tolerancia;"}, {"ref": [44, 5, 8, 8], "tema": "Salvación", "titulo": "Amados antes de cambiar", "med": ["Solemos pensar que el amor se gana: nos esforzamos para que nos acepten en el trabajo, en la familia o entre amigos. Pero este versículo muestra algo diferente. Dios demostró su amor cuando todavía éramos pecadores, cuando no teníamos nada que ofrecerle. En la cruz, Cristo murió por nosotros sin esperar a que primero fuéramos buenos.", "Esta verdad cambia la manera en que nos acercamos a Dios. No tienes que arreglar tu vida antes de venir a Él; puedes venir tal como estás, con tus fallas y tus dudas. La salvación es un regalo que se recibe con fe, no un premio por portarse bien. Cuando sientas que no mereces su amor, mira a la cruz: allí está la prueba de que Dios te ama de verdad."], "pregunta": "¿Hay algo que te hace sentir que no mereces el amor de Dios? ¿Cómo cambia eso al mirar la cruz?", "oracion": "Jesús, gracias por morir en la cruz por mí cuando yo todavía estaba lejos de ti. No merezco tanto amor, pero lo recibo con gratitud y con fe. Gracias por el perdón y la vida nueva que me das. {S}Ayúdame a vivir cada día recordando lo que hiciste por mí. Muestra tu gran amor a {N}. Que mi vida entera sea una respuesta de amor a tu sacrificio. Amén.", "txt": "Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros."}, {"ref": [46, 5, 17, 17], "tema": "Comienzo", "titulo": "Todo puede ser nuevo", "med": ["Hay mañanas en que sentimos que cargamos con todo lo de ayer: errores, palabras que no debimos decir, decisiones que salieron mal. Pablo nos recuerda que quien está en Cristo no es solo alguien que mejoró un poco, sino una persona nueva. Lo viejo ya no tiene la última palabra sobre tu vida. Dios no te mira según tu peor día, sino según lo que Él está haciendo en ti.", "Empezar de nuevo no significa olvidar todo de golpe, sino caminar distinto paso a paso. Tal vez hoy sea pedir perdón a alguien de tu casa, retomar la oración que dejaste o tratar con paciencia a un compañero difícil. Cada pequeño cambio es una señal de esa vida nueva. No necesitas esperar al primero de enero ni al lunes: en Cristo, hoy mismo puede ser tu nuevo comienzo."], "pregunta": "¿Qué cosa vieja necesitas dejar atrás hoy para caminar en la vida nueva que Dios te ofrece?", "oracion": "Señor, gracias porque en Cristo me haces una persona nueva. A veces me cuesta soltar lo que fui y me quedo mirando hacia atrás. Hoy pongo en tus manos a {N}. {S}Ayúdame a creer que tu gracia es más grande que mis errores y a dar, con tu ayuda, pequeños pasos de cambio en mi casa, en mi trabajo y en mi manera de hablar. Que este día sea un verdadero comienzo contigo. Amén.", "txt": "De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas."}, {"ref": [18, 34, 18, 18], "tema": "Duelo", "titulo": "Cerca del corazón roto", "med": ["Cuando perdemos a alguien que amamos, a veces sentimos que Dios está lejos. Este salmo dice lo contrario: el Señor está cerca de los quebrantados de corazón. No se aleja del dolor ni nos pide que lo escondamos. Se acerca justamente allí, donde las palabras no alcanzan y el pecho duele. Tu llanto no es falta de fe; Dios lo escucha.", "El duelo lleva tiempo y no sigue un orden prolijo. Hay días buenos y días en que una canción, una foto o una silla vacía nos derrumban otra vez. No tienes que fingir que estás bien. Puedes contarle a Dios tu tristeza tal como es, recordar con gratitud a quien partió y dejarte acompañar por personas que te quieren."], "pregunta": "¿Qué parte de tu dolor necesitas hoy contarle a Dios con sinceridad?", "oracion": "Señor, tú ves el vacío que dejó la persona que extraño y las lágrimas que nadie más ve. No entiendo todo lo que pasó, pero sé que estás cerca de mí. Abraza hoy el corazón de {N}. {S}Dame consuelo en los días difíciles y gratitud por los recuerdos que guardo. Rodéame de personas que me acompañen y ayúdame a esperar en ti, que nunca me sueltas. Amén.", "txt": "Cercano está Jehová a los quebrantados de corazón; y salvará a los contritos de espíritu."}, {"ref": [46, 12, 9, 9], "tema": "Gracia", "titulo": "Tu gracia me basta", "med": ["Pablo le pidió a Dios varias veces que le quitara una dificultad que lo afligía. La respuesta no fue la que esperaba: el Señor le dijo que su gracia era suficiente, y que su poder se muestra mejor en la debilidad. Pablo entendió que no tenía que fingir ser fuerte. Sus límites se convirtieron en el lugar donde Cristo podía actuar.", "Vivimos en una cultura que nos exige mostrarnos siempre capaces y exitosos. Pero todos tenemos debilidades: el carácter que nos cuesta controlar, el cansancio, los miedos, los errores del pasado. La gracia de Dios no es un premio para los que lo hacen todo bien; es su favor inmerecido que nos sostiene justamente cuando no damos más. Hoy puedes descansar en esa gracia y dejar de cargar solo con todo."], "pregunta": "¿En qué debilidad tuya necesitas hoy descansar en la gracia de Dios?", "oracion": "Señor, gracias porque tu gracia me basta. No tengo que ser perfecto para ser amado por ti. Te entrego mis debilidades, mis errores y mis cansancios, y te pido que tu poder se muestre en ellos. Rodea a {N} con tu gracia. {S}Ayúdame a dejar de aparentar fortaleza y a depender de ti cada día, con humildad y confianza. En el nombre de Jesús, Amén.", "txt": "Y me ha dicho: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona. Por tanto, de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo."}, {"ref": [42, 14, 26, 26], "tema": "Espíritu", "titulo": "Un Consolador que enseña", "med": ["Antes de partir, Jesús prometió a sus discípulos que no los dejaría solos. El Padre enviaría al Espíritu Santo, a quien llama el Consolador. Él no es una fuerza lejana, sino Dios presente en la vida del creyente. Su tarea incluye enseñarnos y traer a nuestra memoria las palabras de Jesús, justo cuando más las necesitamos.", "Seguramente te ha pasado: en medio de una discusión o de un momento de miedo, de pronto recuerdas un versículo que te da calma o te frena antes de hablar de más. Esa es una de las maneras en que el Espíritu obra. Por eso vale la pena llenar el corazón de las palabras de Jesús y pedirle cada día al Espíritu que te guíe, te consuele y te ayude a entender."], "pregunta": "¿Recuerdas algún momento en que una palabra de Jesús llegó a tu mente justo cuando la necesitabas?", "oracion": "Jesús, gracias porque no me dejaste solo y me diste tu Espíritu Santo. Necesito su consuelo y su enseñanza en este día. Cuando no sepa qué decir o qué hacer, recuérdame tus palabras. {S}Llena de tu paz a {N}. Ayúdame a ser sensible a la voz de tu Espíritu, a obedecer cuando me corrige y a descansar cuando me consuela. Quiero caminar guiado por ti en todo momento. Amén.", "txt": "Mas el Consolador, el Espíritu Santo, al cual el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todas las cosas que os he dicho."}, {"ref": [24, 3, 22, 23], "tema": "Gratitud", "titulo": "Nuevas cada mañana", "med": ["Ayer pudo haber sido un día difícil. Tal vez te fuiste a dormir cansado, con cosas sin resolver. Pero esta mañana empezó algo nuevo: la misericordia de Dios no se gastó ayer. Se renueva cada día.", "Dar gracias al despertar cambia la forma en que vemos el día. No porque todo esté bien, sino porque Dios sigue siendo fiel. Su fidelidad no depende de cómo nos fue ayer."], "pregunta": "¿Por qué tres cosas puedes dar gracias esta mañana?", "oracion": "Padre, gracias por tu misericordia que hoy es nueva otra vez. Gracias por la vida de {N} y por este día que empieza. {S}Ayúdame a no cargar con el peso de ayer y a recibir lo que hoy tienes para mí. Grande es tu fidelidad. Amén.", "txt": "Es por la misericordia de Jehová que no somos consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad."}, {"ref": [53, 6, 6, 7], "tema": "Contentamiento", "titulo": "La verdadera ganancia", "med": ["Vivimos rodeados de mensajes que nos dicen que necesitamos más: un celular nuevo, ropa de moda, una casa más grande. Pablo afirma que la gran ganancia está en vivir cerca de Dios con un corazón contento. Y nos recuerda algo muy sencillo: llegamos a este mundo sin nada y nada nos llevaremos cuando partamos.", "El contentamiento no significa dejar de trabajar o de tener metas, sino no poner nuestra paz en lo que tenemos. Es poder disfrutar de una comida sencilla con la familia, agradecer el techo que hay sobre tu cabeza y no vivir comparándote con otros. Hoy puedes practicarlo haciendo una lista de cosas por las que estás agradecido. Verás que tienes más regalos de Dios de los que imaginabas."], "pregunta": "¿Qué cosas tienes hoy por las que podrías agradecer a Dios en lugar de desear lo que no tienes?", "oracion": "Padre, gracias por todo lo que me das cada día, aunque a veces no lo note. Perdóname cuando vivo comparándome y deseando siempre más. Enséñame a encontrar mi alegría en ti y no en las cosas. {S}Dame un corazón agradecido y contento con lo que tengo. Bendice el hogar de {N}. Ayúdame a recordar que mi mayor riqueza es conocerte y caminar contigo. Amén.", "txt": "Empero grande granjería es la piedad con contentamiento. Porque nada hemos traído a este mundo, y sin duda nada podremos sacar."}, {"ref": [54, 3, 16, 17], "tema": "Palabra", "titulo": "Una Palabra que forma", "med": ["La Biblia no es solo un libro antiguo para leer en la iglesia. Pablo le dice a Timoteo que toda la Escritura viene de Dios y es útil para nuestra vida real: nos enseña lo que no sabemos, nos muestra cuando nos equivocamos, nos corrige con amor y nos ayuda a vivir de manera justa. Es como un buen maestro que nos acompaña cada día.", "El propósito de leerla no es acumular datos, sino que seamos preparados para hacer el bien. Unos minutos con la Palabra por la mañana pueden cambiar cómo tratas a tu familia o cómo reaccionas en el tráfico. No hace falta leer capítulos enteros de una vez: un versículo meditado con calma, y puesto en práctica, puede dar más fruto que muchas páginas leídas de prisa."], "pregunta": "¿Qué enseñanza de la Biblia sientes que Dios te está pidiendo poner en práctica esta semana?", "oracion": "Dios mío, gracias por darme tu Palabra para enseñarme y guiarme. Perdóname por las veces que la dejo de lado por cansancio o distracción. Abre mi corazón para escucharte cuando leo, y dame humildad para aceptar tu corrección. {S}Que lo que aprendo de ti se vea en mis obras de cada día. Bendice también a {N} con hambre de tu Palabra. Prepárame para hacer el bien donde me toque estar. Amén.", "txt": "Toda Escritura es inspirada divinamente y útil para enseñar, para redargüir, para corregir, para instituir en justicia, Para que el hombre de Dios sea perfecto, enteramente instruído para toda buena obra."}, {"ref": [47, 6, 9, 9], "tema": "Paciencia", "titulo": "No te canses de hacer el bien", "med": ["Sembrar y cosechar no ocurren el mismo día. Pablo usa esa imagen del campo para animarnos: el bien que hacemos tiene su tiempo de fruto, aunque hoy no se vea. El riesgo es desmayar en el camino y abandonar justo cuando la semilla estaba por brotar. La paciencia no es quedarse quieto, sino seguir haciendo lo correcto mientras esperamos.", "Piensa en la madre que repite las mismas enseñanzas a sus hijos, en quien visita a un familiar enfermo cada semana o en quien sigue siendo amable con un vecino gruñón. A veces parece inútil. Pero Dios no desperdicia ninguna buena obra hecha con amor. Si hoy estás a punto de rendirte, descansa un momento en él y vuelve a sembrar."], "pregunta": "¿En qué área de tu vida sientes ganas de rendirte, y cómo puedes seguir sembrando con paciencia?", "oracion": "Señor, tú conoces mi cansancio y las veces que siento que mi esfuerzo no sirve de nada. Enséñame a esperar tus tiempos sin perder la esperanza. Renueva hoy el ánimo de {N}. {S}Dame paciencia con las personas que me cuestan y constancia para seguir haciendo el bien, aun cuando no vea resultados. Confío en que a su tiempo vendrá la cosecha, porque tú eres fiel. Amén.", "txt": "No nos cansemos, pues, de hacer bien; que a su tiempo segaremos, si no hubiéremos desmayado."}, {"ref": [46, 9, 7, 7], "tema": "Generosidad", "titulo": "Dar con alegría", "med": ["Pablo anima a dar según lo que cada uno decidió en su corazón, sin tristeza y sin sentirse obligado. Lo que a Dios le agrada no es el tamaño del regalo, sino la alegría con que se da. Un pequeño gesto hecho con amor vale más que mucho dinero entregado de mala gana o solo para que otros lo vean.", "La generosidad no depende de tener mucho. Puedes compartir un plato de comida, prestar una herramienta, regalar tu tiempo a alguien que necesita conversar o ayudar con una tarea a un vecino mayor. Dar nos libera de vivir aferrados a lo nuestro y nos recuerda que todo lo que tenemos viene de Dios. Hoy busca una oportunidad para dar con una sonrisa."], "pregunta": "¿Qué podrías compartir hoy, con alegría, con alguien que lo necesita?", "oracion": "Señor, todo lo que tengo viene de tus manos: mi tiempo, mis fuerzas, mi pan de cada día. Perdóname cuando me aferro a lo mío o doy de mala gana. Haz generoso el corazón de {N}. {S}Muéstrame a quién puedo ayudar hoy y dame alegría al compartir, sin esperar nada a cambio. Que mi vida sea un reflejo de tu bondad para quienes me rodean. Amén.", "txt": "Cada uno dé como propuso en su corazón: no con tristeza, o por necesidad; porque Dios ama el dador alegre."}, {"ref": [18, 4, 8, 8], "tema": "Descanso", "titulo": "Dormir en paz", "med": ["Muchas veces la noche es el momento en que más pensamos: cuentas por pagar, problemas en la familia, preocupaciones por el día siguiente. Nos acostamos, pero la mente sigue despierta. David escribe este salmo en medio de dificultades, y aun así declara que se acostará y dormirá en paz. Su seguridad no venía de que todo estuviera resuelto, sino de saber que Dios lo cuidaba.", "Antes de dormir, puedes hacer lo mismo que David: entregar a Dios lo que te inquieta. Quizás te ayude nombrar en voz baja cada preocupación y decir: esto lo dejo en tus manos. No siempre desaparecerán los problemas, pero tu alma puede descansar sabiendo que Él no duerme y sigue cuidándote. Mañana habrá nuevas fuerzas; esta noche, puedes simplemente descansar en Él."], "pregunta": "¿Qué preocupación necesitas entregarle a Dios esta noche antes de dormir?", "oracion": "Señor, al terminar este día pongo en tus manos todo lo que me preocupa. Tú conoces mis cargas y sabes lo que necesito. Calma mis pensamientos y dame un sueño tranquilo. {S}Guarda también el descanso de {N}. Gracias porque tú no duermes y velas por mí mientras descanso. Renueva mis fuerzas para mañana y ayúdame a despertar confiando en tu cuidado. Amén.", "txt": "En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me harás estar confiado."}, {"ref": [48, 4, 29, 29], "tema": "Palabras", "titulo": "Palabras que construyen", "med": ["Las palabras tienen mucho poder. Una frase dura puede dejar una herida que dura años, y una palabra de ánimo puede levantar a alguien que estaba a punto de rendirse. Pablo nos pide que de nuestra boca no salgan palabras dañinas, sino aquellas que edifican, es decir, que construyen y hacen bien a quien las escucha.", "Piensa en tus conversaciones de hoy: en la mesa con tu familia, en el grupo de mensajes, en el trabajo. ¿Tus palabras suman o restan? Edificar no es solo evitar insultos o chismes, sino buscar activamente decir algo bueno: agradecer, reconocer un esfuerzo, animar a alguien cansado. Antes de responder, especialmente cuando estás enojado, vale la pena preguntarte si lo que vas a decir ayudará o lastimará."], "pregunta": "¿A quién podrías decirle hoy una palabra de ánimo o de gratitud que necesite escuchar?", "oracion": "Dios mío, pon guarda a mi boca. Perdóname por las veces que mis palabras hirieron, criticaron o desanimaron a otros. Enséñame a hablar con gracia y con verdad. {S}Ayúdame a usar mis palabras para animar, agradecer y construir, en mi casa y en todo lugar. Que {N} reciba hoy palabras que le hagan bien. Cuando esté enojado, dame la sabiduría de callar a tiempo y de hablar con amor. Amén.", "txt": "Ninguna palabra torpe salga de vuestra boca, sino la que sea buena para edificación, para que dé gracia a los oyentes."}, {"ref": [51, 5, 18, 18], "tema": "Gratitud", "titulo": "Gracias por lo pequeño", "med": ["Pablo nos pide dar gracias en todo, y dice que esa es la voluntad de Dios para nosotros. No dice dar gracias por todo lo que pasa, sino en medio de todo. Aun en un día complicado hay pequeños regalos que pasamos por alto: un café caliente, una cama donde descansar, el mensaje de un amigo, el sol que entra por la ventana.", "La gratitud cambia la mirada. Cuando nos acostumbramos a quejarnos, solo vemos lo que falta. Cuando aprendemos a agradecer, descubrimos que Dios está presente en detalles que antes ignorábamos. Una práctica sencilla: antes de dormir, nombra tres cosas pequeñas por las que estás agradecido. Con el tiempo notarás que tu corazón se vuelve más tranquilo, más humilde y más consciente de la bondad de Dios en lo cotidiano."], "pregunta": "¿Qué tres cosas pequeñas de hoy puedes agradecerle a Dios ahora mismo?", "oracion": "Señor, perdóname por las veces que me quejo y no veo tus regalos de cada día. Hoy te doy gracias por el pan, por el techo, por el aire que respiro y por las personas que pones en mi camino. Gracias también por la vida de {N}. {S}Enséñame a tener un corazón agradecido en los días buenos y en los difíciles, porque tú nunca dejas de cuidarme. Amén.", "txt": "Dad gracias en todo; porque esta es la voluntad de Dios para con vosotros en Cristo Jesús."}, {"ref": [48, 2, 10, 10], "tema": "Propósito", "titulo": "Hecho a mano por Dios", "med": ["Pablo dice que somos hechura de Dios, como una obra que un artesano trabaja con paciencia y cariño. No eres un accidente ni un número más en la fila del banco o en la lista del trabajo. Dios te formó con intención y, además, preparó de antemano buenas obras para que camines en ellas. Tu vida tiene un sentido que no depende de tu cargo, de tu sueldo ni de los aplausos de otros.", "A veces buscamos el propósito en algo enorme y lejano, pero muchas de esas buenas obras están en lo cotidiano: escuchar a un compañero cansado, preparar la comida con amor, hacer bien tu trabajo aunque nadie lo note, ayudar a un vecino con las bolsas. Hoy no necesitas tener todo el mapa de tu vida. Basta con dar el siguiente paso en lo que Dios ya puso delante de ti."], "pregunta": "¿Qué buena obra sencilla te está esperando hoy en tu casa, tu trabajo o tu barrio?", "oracion": "Padre, gracias porque me hiciste con amor y no estoy aquí por casualidad. Cuando me sienta perdido o sin rumbo, recuérdame que tú ya preparaste un camino para mí. Muéstrale también a {N} el propósito que tienes para su vida. {S}Abre mis ojos para ver las buenas obras que pones hoy delante de mí, y dame un corazón dispuesto para hacerlas con alegría y humildad. En el nombre de Jesús, Amén.", "txt": "Porque somos hechura suya, criados en Cristo Jesús para buenas obras, las cuales Dios preparó para que anduviésemos en ellas."}, {"ref": [40, 10, 45, 45], "tema": "Servicio", "titulo": "Grande es el que sirve", "med": ["Los discípulos discutían quién sería el más importante. Jesús les respondió con su propia vida: Él, el Hijo del hombre, no vino a ser servido sino a servir, y a dar su vida por muchos. En el mundo, la grandeza se mide por cuántas personas te atienden. En el reino de Dios se mide al revés: por cuánto amor pones al servicio de los demás.", "Servir no siempre es algo heroico. Es lavar los platos sin que te lo pidan, ceder el asiento en el autobús, escuchar con paciencia a un abuelo, cubrir a un compañero que está pasando un mal día. Cuando sirves así, te pareces a Jesús. No lo hacemos para ganar el amor de Dios, sino porque ya lo recibimos. Hoy busca una forma concreta de servir a alguien sin esperar nada a cambio."], "pregunta": "¿A quién podrías servir hoy de una manera práctica y sin que nadie te lo reconozca?", "oracion": "Jesús, gracias porque viniste a servir y entregaste tu vida por mí. Quita de mi corazón el deseo de ser el centro y de recibir reconocimiento. Enséñame a servir con humildad en mi casa, en mi trabajo y en mi comunidad. Bendice a {N} con tu amor que sirve. {S}Dame ojos para ver las necesidades a mi alrededor y manos dispuestas para ayudar con alegría. Amén.", "txt": "Porque el Hijo del hombre tampoco vino para ser servido, mas para servir, y dar su vida en rescate por muchos."}, {"ref": [48, 4, 32, 32], "tema": "Perdón", "titulo": "Perdonados para perdonar", "med": ["Pablo nos pide ser benignos y misericordiosos unos con otros, y nos da la razón más profunda: Dios ya nos perdonó en Cristo. El perdón no nace de que el otro lo merezca, sino de recordar cuánto se nos ha perdonado a nosotros. Cuando miramos nuestra propia deuda cancelada, la ofensa del vecino, del compañero o del hermano empieza a verse de otro tamaño.", "Perdonar no significa decir que lo que pasó no dolió, ni volver a confiar de inmediato en quien te lastimó. Es soltar el deseo de venganza y dejar la cuenta en manos de Dios. Quizás hoy puedas dar un paso pequeño: no repetir la historia una vez más, orar por esa persona o enviar un mensaje sencillo. El perdón suele empezar así, de a poco."], "pregunta": "¿A quién te cuesta perdonar hoy, y qué paso pequeño podrías dar hacia esa persona?", "oracion": "Padre, gracias porque en Cristo me perdonaste mucho más de lo que yo podría pagar. Tú conoces las heridas que todavía llevo y los nombres que me cuesta pronunciar sin enojo. Hoy pongo en tus manos a {N}. {S}Ayúdame a soltar el rencor y a tratar a los demás con la misma misericordia que recibo de ti cada día. Sana mi corazón y enséñame a perdonar de verdad. Amén.", "txt": "Antes sed los unos con los otros benignos, misericordiosos, perdonándoos los unos a los otros, como también Dios os perdonó en Cristo."}, {"ref": [39, 6, 11, 11], "tema": "Provisión", "titulo": "El pan de hoy", "med": ["Jesús nos enseñó a pedir el pan de cada día. No el de todo el año ni el de toda la vida, sino el de hoy. Es una oración sencilla que nos recuerda que dependemos de Dios para lo básico, y que Él se interesa por nuestras necesidades concretas: la comida, el alquiler, el trabajo, el boleto para viajar.", "Muchas veces nos angustiamos pensando en lo que vendrá el mes próximo. Esta oración nos invita a vivir un día a la vez. No significa dejar de trabajar o de planificar con responsabilidad, sino hacerlo sin ansiedad, confiando en que Dios conoce lo que necesitas. Y como Jesús dijo danos y no dame, también nos recuerda a quienes no tienen pan hoy y nos invita a compartir el nuestro."], "pregunta": "¿Qué necesidad concreta de hoy quieres presentarle a Dios con confianza?", "oracion": "Padre nuestro, gracias por el pan que pones en mi mesa cada día. Te presento mis necesidades de hoy y confío en que conoces cada una. Provee también lo que le falta a {N}. {S}Quita de mí la ansiedad por el mañana y ayúdame a trabajar con responsabilidad y a vivir con sencillez. Hazme generoso con quienes hoy no tienen lo necesario. En el nombre de Jesús, Amén.", "txt": "Danos hoy nuestro pan cotidiano."}, {"ref": [18, 121, 7, 8], "tema": "Protección", "titulo": "Guardado al salir y al entrar", "med": ["El Salmo 121 es una canción de viajeros. Quienes subían a Jerusalén enfrentaban caminos peligrosos, calor y noches al aire libre. Por eso el salmista repite una palabra: guardar. Dios guarda tu vida, tu alma, tu salida y tu entrada. No promete que nunca habrá dificultades, sino que en ningún momento estarás fuera de su cuidado, desde ahora y para siempre.", "Piensa en tus salidas y entradas de cada día: cuando vas al trabajo, cuando tus hijos van a la escuela, cuando viajas de noche o vuelves tarde a casa. Puedes poner cada uno de esos momentos en manos de Dios. Orar antes de salir no es un amuleto, es un acto de confianza. Reconoces que tu seguridad final está en un Padre que no duerme y que conoce cada paso."], "pregunta": "¿Qué salida o entrada de tu día quieres poner hoy conscientemente en manos de Dios?", "oracion": "Padre, gracias porque tú no duermes y siempre me cuidas. Hoy pongo en tus manos mis salidas y mis entradas, mis viajes y mis regresos a casa. Protege a {N} dondequiera que vaya. {S}Cuando sienta miedo por lo que no puedo controlar, recuérdame que estoy bajo tu cuidado. Dame paz para vivir este día confiando en ti, ahora y siempre. En el nombre de Jesús, Amén.", "txt": "Jehová te guardará de todo mal: él guardará tu alma. Jehová guardará tu salida y tu entrada, desde ahora y para siempre."}, {"ref": [22, 40, 31, 31], "tema": "Espera", "titulo": "Nuevas fuerzas", "med": ["Esperar es una de las cosas más difíciles: esperar un trabajo, una respuesta médica, un cambio en un hijo. Isaías dice que quienes esperan en el Señor reciben nuevas fuerzas. No habla de una espera aburrida o resignada, sino de confiar activamente en Dios. Como el águila que aprovecha el viento, aprendemos a apoyarnos en una fuerza que no es la nuestra.", "Fíjate en el orden del versículo: volar, correr, caminar. A veces Dios nos da días de alas, pero muchas veces la victoria es simplemente seguir caminando sin desmayar. Eso también es fe. Si hoy solo puedes dar un paso más, dalo tomado de la mano de Dios. Él conoce tu espera y renueva tus fuerzas mañana tras mañana."], "pregunta": "¿Qué estás esperando hoy, y cómo puedes poner esa espera en manos de Dios?", "oracion": "Padre, tú sabes cuánto tiempo llevo esperando y cuántas veces me he desanimado. Hoy quiero confiar en ti, aunque no vea todavía la respuesta. Renueva las fuerzas de {N}. {S}Cuando me falte el ánimo, enséñame a seguir caminando contigo, paso a paso. Dame paz mientras espero y un corazón que crea que tus tiempos son buenos, aunque no siempre los entienda. Amén.", "txt": "Mas los que esperan a Jehová tendrán nuevas fuerzas; levantarán las alas como águilas; correrán, y no se cansarán; caminarán, y no se fatigarán."}, {"ref": [39, 11, 28, 28], "tema": "Descanso", "titulo": "Vengan los cansados", "med": ["Jesús no llamó a los fuertes ni a los que tenían todo resuelto. Llamó a los cansados y a los cargados. Si hoy te sientes así, esta invitación es justo para ti.", "Descansar en Dios no es dejar de hacer lo que nos toca, sino dejar de hacerlo solos. Él ofrece llevar el peso con nosotros."], "pregunta": "¿Qué carga estás llevando solo que podrías dejar en manos de Jesús?", "oracion": "Jesús, vengo a ti con mi cansancio. Hoy te traigo a {N}, con todo lo que carga. {S}Dame descanso para el cuerpo y para el alma. Enséñame a caminar a tu lado, sin prisa y sin miedo. Amén.", "txt": "Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar."}, {"ref": [19, 3, 5, 6], "tema": "Confianza", "titulo": "Cuando no entiendes el camino", "med": ["Nos gusta tener todo bajo control: saber cuánto dinero alcanzará, cómo terminará ese trámite o qué pasará con un hijo que se aleja. Pero este proverbio nos invita a apoyarnos en Dios con todo el corazón, no solo con una parte. Nuestra propia inteligencia es valiosa, pero tiene límites. Confiar en Dios es reconocer que Él ve lo que nosotros no alcanzamos a ver.", "Reconocer a Dios en todos tus caminos significa incluirlo en lo grande y en lo cotidiano: al buscar empleo, al decidir una compra, al responder un mensaje difícil. No es una fórmula para que todo salga como queremos, sino una relación en la que Él guía y nosotros seguimos. Cuando el camino parece torcido, puedes descansar en que Dios sabe cómo enderezarlo a su tiempo y a su manera."], "pregunta": "¿En qué área de tu vida te estás apoyando solo en tu propia prudencia en lugar de confiar en Dios?", "oracion": "Padre, confieso que muchas veces quiero entenderlo todo antes de confiar en ti. Hoy decido apoyarme en tu sabiduría y no solo en la mía. Te presento la vida de {N}. {S}Enséñame a reconocerte en cada decisión, grande o pequeña, y a buscar tu dirección antes de actuar. Cuando no vea el camino claro, dame paz para seguir caminando de tu mano, sabiendo que tú guías mis pasos. Amén.", "txt": "Fíate de Jehová de todo tu corazón, y no estribes en tu prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas."}, {"ref": [19, 17, 17, 17], "tema": "Amistad", "titulo": "Amigos en todo tiempo", "med": ["Es fácil tener amigos cuando todo va bien, cuando hay fiestas, risas y buenas noticias. Este proverbio habla de algo más profundo: el amigo verdadero ama en todo tiempo, también cuando llegan la enfermedad, la pérdida del trabajo o el duelo. Y dice que el hermano nace, por así decirlo, para acompañar en la angustia. La amistad se prueba en los días difíciles.", "Piensa en esas personas que estuvieron a tu lado cuando más lo necesitabas; son un regalo de Dios. Pero el versículo también nos desafía a ser ese tipo de amigo. Tal vez hoy puedes llamar a alguien que está pasando un mal momento, llevar algo de comida o simplemente escuchar sin juzgar. Así reflejamos el amor fiel de Jesús, que nos llama sus amigos."], "pregunta": "¿Quién de tus amigos está atravesando un momento difícil y cómo podrías acompañarlo hoy?", "oracion": "Señor Jesús, gracias por los amigos que pusiste en mi camino y por tu amistad que nunca falla. Enséñame a amar en todo tiempo, no solo cuando es cómodo. {S}Dame ojos para ver a quien está sufriendo y valor para acercarme con una palabra o un gesto sencillo. Rodea de buenos amigos a {N}. Que mis amistades sean sinceras, fieles y te honren a ti. Amén.", "txt": "En todo tiempo ama el amigo; y el hermano para la angustia es nacido."}, {"ref": [39, 6, 6, 6], "tema": "Oración", "titulo": "A solas con el Padre", "med": ["Jesús enseñó que la oración no es un espectáculo para los demás. Invita a entrar en un lugar apartado, cerrar la puerta y hablar con el Padre en secreto. No hacen falta palabras difíciles ni un templo especial. Dios ve lo que nadie más ve y escucha lo que le dices en voz baja, con sencillez y sinceridad.", "Ese cuarto puede ser tu habitación temprano en la mañana, el trayecto camino al trabajo o unos minutos en la cocina antes de que todos despierten. Lo importante es apartar un momento para estar con Dios sin distracciones. Puedes empezar con poco: dar gracias, contarle lo que te preocupa y pedir ayuda para el día. Él te espera allí."], "pregunta": "¿Qué momento y lugar podrías apartar cada día para orar a solas con Dios?", "oracion": "Padre, gracias porque puedo hablar contigo en cualquier momento y en cualquier lugar. A veces me distraigo, me apuro o no sé qué decir, pero tú igual me escuchas. Te presento hoy la vida de {N}. {S}Enséñame a buscarte en lo secreto, con un corazón sincero, y a hacer de la oración un encuentro diario contigo. Que en ese tiempo a solas encuentre paz y dirección. Amén.", "txt": "Mas tú, cuando oras, éntrate en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto, te recompensará en público."}, {"ref": [49, 4, 6, 7], "tema": "Paz", "titulo": "Cambiar la preocupación por oración", "med": ["La preocupación da vueltas y vueltas sobre lo mismo, pero no nos lleva a ningún lado. Pablo propone algo concreto: cada cosa que nos preocupa, convertirla en una oración. Nombrarla, entregarla y dar gracias.", "La promesa no es que todo se va a resolver como queremos, sino que la paz de Dios va a cuidar nuestro corazón y nuestros pensamientos, como un guardia en la puerta."], "pregunta": "¿Qué preocupación puedes transformar hoy en una oración concreta?", "oracion": "Señor, tú conoces lo que me preocupa. Hoy, en lugar de darle vueltas, te lo entrego. Cuida el corazón y los pensamientos de {N}. {S}Gracias porque escuchas. Lléname de tu paz, esa que no se puede explicar. Amén.", "txt": "Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias. Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús."}, {"ref": [58, 1, 5, 5], "tema": "Sabiduría", "titulo": "Pide sin miedo", "med": ["Santiago nos da una invitación muy concreta: si te falta sabiduría, pídela a Dios. Y nos describe cómo responde Él: da con generosidad y no reprocha. No te va a mirar con fastidio ni te va a decir que deberías saberlo ya. Dios no es como el jefe impaciente o el profesor que se burla de las preguntas. Es un Padre que se alegra cuando sus hijos se acercan a buscar dirección.", "Todos los días enfrentamos decisiones: cómo responder a un mensaje difícil, qué hacer con un dinero ajustado, cómo hablar con un hijo adolescente, si aceptar o no un trabajo. Antes de correr a buscar la respuesta en cualquier lado, detente un momento y ora. La sabiduría de Dios suele llegar a través de su Palabra, de un consejo sensato o de una paz que ordena las ideas. Pide con confianza; Él prometió dar."], "pregunta": "¿Qué decisión estás enfrentando en la que necesitas pedirle sabiduría a Dios?", "oracion": "Señor, reconozco que muchas veces no sé qué hacer y actúo por impulso. Hoy te pido sabiduría para mis decisiones grandes y pequeñas. Gracias porque das con generosidad y no me reprochas por preguntar. Dale también a {N} claridad para cada paso que debe dar. {S}Ayúdame a escuchar tu voz en tu Palabra y en los buenos consejos, y a elegir con calma lo que te agrada. Amén.", "txt": "Y si alguno de vosotros tiene falta de sabiduría, demándela a Dios, el cual da a todos abundantemente, y no zahiere; y le será dada."}, {"ref": [57, 13, 5, 5], "tema": "Soledad", "titulo": "Nunca me dejará", "med": ["Este versículo une dos cosas que parecen lejanas: estar contentos con lo que tenemos y saber que Dios no nos abandona. Muchas veces buscamos llenar el vacío con cosas, compras o ruido. Pero la verdadera compañía no se compra. La promesa es clara: Dios no te desamparará ni te dejará, ni en la casa vacía ni en la noche larga.", "La soledad puede sentirse fuerte al volver del trabajo a una casa silenciosa, al vivir lejos de la familia o al sentir que nadie a tu alrededor te entiende. Dios no siempre quita ese sentimiento de golpe, pero está presente en medio de él. Háblale como a un amigo. Y quizás hoy puedas también escribirle a alguien que se sienta sin compañía."], "pregunta": "¿En qué momentos del día sientes más la soledad, y cómo podrías invitar a Dios a ese momento?", "oracion": "Padre, hay días en que me siento sin compañía y nadie parece notar lo que llevo por dentro. Gracias porque tú prometiste no dejarme nunca. Acompaña de cerca a {N}. {S}Llena los silencios de mi casa con tu presencia y enséñame a encontrar contentamiento en lo que tengo. Pon en mi camino personas con quienes compartir la fe y la vida, y hazme también compañía para otros. Amén.", "txt": "Sean las costumbres vuestras sin avaricia; contentos de lo presente; porque él dijo: No te desampararé, ni te dejaré."}, {"ref": [23, 29, 11, 11], "tema": "Esperanza", "titulo": "Pensamientos de paz", "med": ["Cuando el presente es confuso, es fácil pensar que el futuro también lo será. Pero Dios dice que sus pensamientos hacia nosotros son de paz y no de mal.", "Esta promesa fue dada a un pueblo que estaba lejos de casa, en un tiempo difícil. Dios no se olvida de los suyos, ni siquiera en la espera."], "pregunta": "¿Qué parte de tu futuro necesitas confiarle hoy a Dios?", "oracion": "Dios de esperanza, gracias porque tienes buenos pensamientos para mi vida. Pongo en tus manos el futuro de {N}. {S}Mientras espero, dame paciencia y confianza. Amén.", "txt": "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis."}, {"ref": [61, 4, 19, 19], "tema": "Amor", "titulo": "Él nos amó primero", "med": ["Antes de que hiciéramos algo bien, antes de que lo buscáramos, Dios ya nos amaba. Su amor no es un premio que se gana, es el punto de partida.", "Cuando entendemos cuánto somos amados, se vuelve más fácil amar a otros: a la familia, a quien nos cuesta, a quien está solo."], "pregunta": "¿A quién puedes mostrarle hoy un poco del amor que recibiste?", "oracion": "Padre, gracias por amarme primero, aun cuando no lo merecía. Que {N} descanse hoy en tu amor. {S}Enséñame a amar como tú amas: con paciencia, con bondad y sin llevar cuentas. Amén.", "txt": "Nosotros le amamos a él, porque él nos amó primero."}, {"ref": [22, 41, 10, 10], "tema": "Fortaleza", "titulo": "No temas, yo estoy contigo", "med": ["Dios no dice que no vayan a venir momentos difíciles. Dice algo más profundo: que no vamos a estar solos en ellos. Su presencia es la razón para no temer.", "Fíjate en las tres promesas: te esforzaré, te ayudaré y te sustentaré. Cuando sentimos que no damos más, Él es quien sostiene."], "pregunta": "¿En qué situación de hoy necesitas recordar que Dios te sostiene?", "oracion": "Dios fuerte, gracias porque estás conmigo. Cuando tenga miedo, recuérdame que tu mano me sostiene. Fortalece a {N} en lo que tenga que enfrentar hoy. {S}Que mi confianza esté en ti y no en mis fuerzas. Amén.", "txt": "No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia."}, {"ref": [40, 4, 39, 39], "tema": "Paz", "titulo": "Calma en medio del viento", "med": ["Los discípulos cruzaban el lago cuando se levantó una tormenta tan fuerte que el agua entraba en la barca. Asustados, despertaron a Jesús, que dormía tranquilo. Él se levantó, reprendió al viento y le habló al mar, y todo quedó en gran calma. Los mismos que temían al agua descubrieron que quien iba con ellos tenía autoridad sobre la tormenta.", "Tú también atraviesas tormentas: un diagnóstico preocupante, una deuda, un conflicto familiar, una noche de insomnio llena de pensamientos. No siempre la situación cambia de inmediato, pero Jesús sigue estando en tu barca. Puedes clamar a Él con honestidad, como hicieron los discípulos. Su presencia trae una paz que no depende del clima de afuera, porque nace de saber quién va contigo."], "pregunta": "¿Qué tormenta estás viviendo hoy, y qué significa para ti que Jesús esté en tu barca?", "oracion": "Jesús, tú tienes autoridad sobre el viento y el mar. Hoy te traigo la tormenta que estoy viviendo y el miedo que siento por dentro. Calma mi corazón y ayúdame a confiar en que estás conmigo. Dale paz a {N} en medio de sus luchas. {S}Cuando las olas parezcan más grandes que yo, recuérdame que tú vas en mi barca y no me dejas solo. Amén.", "txt": "Y levantándose, increpó al viento, y dijo a la mar: Calla, enmudece. Y cesó el viento, y fue hecha grande bonanza."}, {"ref": [50, 3, 23, 24], "tema": "Trabajo", "titulo": "Trabajar para el Señor", "med": ["Pablo escribió a personas con trabajos duros y poco reconocidos. Les dijo que hicieran todo de ánimo, es decir, con el corazón, como para el Señor y no para la gente. Esto cambia la mirada sobre la tarea diaria: barrer el negocio, atender a un cliente difícil, cargar mercadería o estudiar para un examen también puede ser una forma de servir a Dios.", "A veces nadie nota tu esfuerzo y el jefe solo ve los errores. El versículo te recuerda que Dios sí lo ve y que tu recompensa final viene de él. Eso no significa trabajar sin descanso ni aceptar injusticias en silencio, sino hacer tu parte con honestidad y buena actitud. Hoy, antes de empezar, puedes ofrecerle a Dios toda tu jornada."], "pregunta": "¿Cómo cambiaría tu día si hicieras tu trabajo pensando que lo haces para el Señor?", "oracion": "Jesús, te entrego el trabajo de este día, lo grande y lo pequeño. Perdóname cuando me quejo o hago las cosas de mala gana solo porque nadie me mira. Dale fuerzas y buen ánimo a {N}. {S}Ayúdame a obrar con honestidad, responsabilidad y amabilidad con quienes trabajan conmigo. Que mi esfuerzo sea una ofrenda para ti, y que encuentre descanso sabiendo que tú ves todo lo que hago. Amén.", "txt": "Y todo lo que hagáis, hacedlo de ánimo, como al Señor, y no a los hombres; Sabiendo que del Señor recibiréis la compensación de la herencia: porque al Señor Cristo servís."}, {"ref": [57, 12, 1, 2], "tema": "Perseverancia", "titulo": "Corre con los ojos en Jesús", "med": ["El autor de Hebreos compara la vida de fe con una carrera larga. No es una carrera corta de velocidad, sino de resistencia, y por eso nos pide correr con paciencia. También nos anima a soltar el peso que nos frena, como un corredor que no carga una mochila llena de piedras. Y nos recuerda que no corremos solos: muchos creyentes antes que nosotros terminaron su carrera con fidelidad.", "El secreto para no abandonar está en dónde ponemos la mirada. Si miras solo tus fuerzas, tus caídas o el camino que falta, te vas a desanimar. Pero si fijas los ojos en Jesús, que soportó la cruz por amor, encuentras motivo para seguir. Hoy quizás te cuesta levantarte para cumplir tus responsabilidades, sostener tu matrimonio o seguir orando por algo. Da un paso más, mirando a Jesús."], "pregunta": "¿Qué peso necesitas soltar hoy para poder seguir corriendo con paciencia?", "oracion": "Jesús, tú terminaste tu carrera con amor y fidelidad, aun cuando significó la cruz. Hoy me siento cansado y a veces quiero detenerme. Ayúdame a soltar lo que me pesa y a poner mis ojos en ti. Dale fuerzas a {N} para no rendirse. {S}Cuando el camino se haga largo, recuérdame que no corro solo y que tú vas delante de mí. Amén.", "txt": "Por tanto nosotros también, teniendo en derredor nuestro una tan grande nube de testigos, dejando todo el peso del pecado que nos rodea, corramos con paciencia la carrera que nos es propuesta, Puestos los ojos en al autor y consumador de la fe, en Jesús; el cual, habiéndole sido propuesto gozo, sufrió la cruz, menospreciando la vergüenza, y sentóse a la diestra del trono de Dios."}], "en": [{"ref": [18, 119, 105, 105], "tema": "Guidance", "titulo": "A Light for the Next Step", "med": ["An ancient oil lamp didn't light up the whole road. It gave just enough light to see where to put your foot, and nothing more. That is often how God's Word works in our lives: it doesn't show us the whole future, but it gives us enough light to take the next step with confidence.", "Maybe today you have questions with no answers yet. That's okay. You don't need to see the end of the road to walk in peace. It is enough to know that God goes ahead of you and that His Word lights up what is right in front of you."], "pregunta": "What next step do you need to take today, even if you can't yet see the whole path?", "oracion": "Lord, thank You that Your Word is a light. Today I place {N} in Your hands. When I don't know what to do, show me the next step. Take away my fear of what I can't see and give me peace to keep moving forward. {S}Help me walk today trusting in You. Amen.", "txt": "Thy word is a lamp unto my feet, and a light unto my path."}, {"ref": [5, 1, 9, 9], "tema": "Courage", "titulo": "Be Strong and of Good Courage", "med": ["Joshua had a huge task ahead of him. God didn't promise him it would be easy, but He gave him a reason to be brave: He would be with him wherever he went.", "Courage isn't the absence of fear. It's taking the step even when you're afraid, knowing you are not alone."], "pregunta": "What brave step is God asking you to take in this season of your life?", "oracion": "Lord, sometimes I lack courage. Today I ask You to go with {N} wherever they go. {S}Take away my discouragement and give me the courage to do what is right. Thank You for going with me. Amen.", "txt": "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee whithersoever thou goest."}, {"ref": [15, 8, 10, 10], "tema": "Joy", "titulo": "The Joy That Gives Strength", "med": ["The people of Israel wept when they heard God's law, because they saw how far they had drifted. But Nehemiah told them not to be sad: it was a holy day, a day to celebrate, eat together, and share with those who had nothing. And he left them a powerful truth: the joy of the Lord is your strength. The joy that comes from God doesn't deny our problems, but it holds us up in the middle of them.", "This joy doesn't depend on everything going perfectly. It comes from knowing we are loved and forgiven. Notice, too, that the passage connects joy with generosity: sending portions to those who had nothing prepared. Today you can live out that joy in practical ways: share a meal, call someone who is lonely, give thanks out loud. When God's joy fills the heart, it shows at the table and in open hands."], "pregunta": "Who could you share something with today so that they can rejoice too?", "oracion": "Jesus, sometimes sadness and weariness drain my strength. Today I ask that Your joy be my strength, even when not everything is settled. Fill the heart of {N} with joy. {S}Teach me to celebrate Your goodness in everyday life and to share with those who have less than I do. May my joy not depend on my circumstances, but on knowing that You are with me and You love me. Amen.", "txt": "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength."}, {"ref": [49, 2, 3, 4], "tema": "Humility", "titulo": "Looking Out for Others", "med": ["Paul asks us to do nothing out of rivalry or a desire to look good. The humility he describes isn't thinking we are worthless; it's no longer putting ourselves at the center all the time. It means treating others as important and paying attention to their needs, not just our own. It's a way of loving that looks a lot like Jesus.", "In daily life it shows up in the details: letting someone else be right in an argument that doesn't matter, celebrating a coworker's success without envy, giving up your seat, asking someone how they're doing and truly listening to the answer. Humility sets us free, because we no longer have to keep proving who we are. God looks at us with love, and that is enough."], "pregunta": "In what situation this week could you put someone else's interests ahead of your own?", "oracion": "Jesus, though You are Lord of all, You became the servant of all. Forgive me for the times I try to look good, compete, or always have the last word. Shape a humble heart in {N}. {S}Open my eyes to see the needs of the people around me and give me joy in serving them. May I not need anyone's applause, because Your love is enough for me and holds me up. Amen.", "txt": "Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves. Look not every man on his own things, but every man also on the things of others."}, {"ref": [5, 24, 15, 15], "tema": "Family", "titulo": "As for Me and My House", "med": ["Joshua gathered the people and set a choice before them: whom would they serve? Then he spoke for himself and his family, and said that his house would serve the Lord. He didn't wait for everyone to agree; he made the decision first in his own heart. Faith in a family often begins with one person who is willing to take the first step.", "Serving God at home doesn't require a perfect household. It shows in simple things: apologizing after an argument, giving thanks together before a meal, listening without a phone in your hand, being patient with your children or your aging parents. Maybe no one else in your family prays yet. Your quiet faithfulness, day after day, can be a seed that God makes grow."], "pregunta": "What practical thing could you do today so that your home reflects God's love?", "oracion": "Lord, thank You for my family, with its joys and its struggles too. I want my home to be a place where You are honored, even when I don't know how to begin. Watch over the home of {N}. {S}Give me patience to listen, humility to ask for forgiveness, and tenderness to care for my loved one
