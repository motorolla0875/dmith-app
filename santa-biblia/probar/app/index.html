s. May our words and our actions show that we serve You. Amen.", "txt": "And if it seem evil unto you to serve the Lord, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the Lord."}, {"ref": [50, 3, 12, 12], "tema": "Compassion", "titulo": "Clothed in Mercy", "med": ["Every morning we choose what clothes to put on. Paul uses that picture to tell us that we also need to dress on the inside: in mercy, kindness, humility, meekness, and patience. He does it by first reminding us who we are: chosen, holy, and loved by God. We aren't compassionate to earn His love, but because we have already received it.", "Compassion shows up in concrete ways: giving up your seat on the bus, being patient with an elderly person who is slow in line, not making fun of someone else's mistake. Sometimes tiredness makes us harsh, which is why we need to put on mercy again and again. Today, before you leave the house, ask God to help you see others the way He sees you."], "pregunta": "Who is the hardest person for you to be patient with, and how could you show them compassion today?", "oracion": "Good Father, thank You for choosing me and loving me even though I don't deserve it. Today I want to clothe myself in Your compassion and kindness. Take away the hardness, pride, and impatience that sometimes hurt the people around me. {S}Help me treat every person with the same mercy You show me. Show Your tenderness to {N}. May my hands and my words carry some of Your love today. Amen.", "txt": "Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;"}, {"ref": [44, 5, 8, 8], "tema": "Salvation", "titulo": "Loved Before We Changed", "med": ["We often think love has to be earned: we work hard to be accepted at work, in our family, or among friends. But this verse shows something different. God showed His love while we were still sinners, when we had nothing to offer Him. On the cross, Christ died for us without waiting for us to become good first.", "This truth changes the way we come to God. You don't have to fix your life before you come to Him; you can come just as you are, with your failures and your doubts. Salvation is a gift received by faith, not a reward for good behavior. When you feel you don't deserve His love, look at the cross: there is the proof that God truly loves you."], "pregunta": "Is there something that makes you feel you don't deserve God's love? How does that change when you look at the cross?", "oracion": "Jesus, thank You for dying on the cross for me while I was still far from You. I don't deserve such great love, but I receive it with gratitude and faith. Thank You for the forgiveness and new life You give me. {S}Help me live each day remembering what You did for me. Show Your great love to {N}. May my whole life be a response of love to Your sacrifice. Amen.", "txt": "But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."}, {"ref": [46, 5, 17, 17], "tema": "Beginnings", "titulo": "All Things Can Be New", "med": ["Some mornings we feel like we're carrying everything from yesterday: mistakes, words we shouldn't have said, decisions that went wrong. Paul reminds us that anyone who is in Christ isn't just someone who improved a little, but a new creature. The old things no longer have the final say over your life. God doesn't see you according to your worst day, but according to what He is doing in you.", "Starting over doesn't mean forgetting everything at once; it means walking differently, step by step. Maybe today that means asking someone at home for forgiveness, coming back to the prayer life you let slip, or being patient with a difficult coworker. Every small change is a sign of that new life. You don't need to wait for January 1st or for Monday: in Christ, today can be your new beginning."], "pregunta": "What old thing do you need to leave behind today to walk in the new life God offers you?", "oracion": "Lord, thank You that in Christ You make me a new person. Sometimes it's hard to let go of who I was, and I keep looking back. Today I place {N} in Your hands. {S}Help me believe that Your grace is bigger than my mistakes, and with Your help, to take small steps of change at home, at work, and in the way I speak. May this day be a true new beginning with You. Amen.", "txt": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."}, {"ref": [18, 34, 18, 18], "tema": "Grief", "titulo": "Near to the Broken Heart", "med": ["When we lose someone we love, we sometimes feel that God is far away. This psalm says the opposite: the Lord is nigh unto them that are of a broken heart. He doesn't pull away from our pain or ask us to hide it. He comes close right there, where words fall short and our chest aches. Your tears are not a lack of faith; God hears them.", "Grief takes time and doesn't follow a neat order. There are good days, and days when a song, a photo, or an empty chair knocks us down all over again. You don't have to pretend you're okay. You can tell God about your sadness just as it is, remember with gratitude the one who is gone, and let the people who love you walk alongside you."], "pregunta": "What part of your pain do you need to honestly share with God today?", "oracion": "Lord, You see the emptiness left by the person I miss and the tears no one else sees. I don't understand everything that happened, but I know You are near to me. Hold the heart of {N} close today. {S}Give me comfort on the hard days and gratitude for the memories I carry. Surround me with people who will walk with me, and help me wait on You, for You never let me go. Amen.", "txt": "The Lord is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit."}, {"ref": [46, 12, 9, 9], "tema": "Grace", "titulo": "Your Grace Is Enough", "med": ["Paul asked God several times to take away a hardship that troubled him. The answer wasn't the one he expected: the Lord told him that His grace was sufficient, and that His strength is made perfect in weakness. Paul understood that he didn't have to pretend to be strong. His limits became the very place where Christ could work.", "We live in a culture that demands we always look capable and successful. But we all have weaknesses: a temper we struggle to control, exhaustion, fears, mistakes from the past. God's grace isn't a prize for those who do everything right; it is His undeserved favor that carries us exactly when we can't go on. Today you can rest in that grace and stop carrying everything on your own."], "pregunta": "In what weakness do you need to rest in God's grace today?", "oracion": "Lord, thank You that Your grace is enough for me. I don't have to be perfect to be loved by You. I give You my weaknesses, my mistakes, and my weariness, and I ask that Your power be shown in them. Surround {N} with Your grace. {S}Help me stop pretending to be strong and depend on You every day, with humility and trust. In Jesus' name, Amen.", "txt": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."}, {"ref": [42, 14, 26, 26], "tema": "Spirit", "titulo": "A Comforter Who Teaches", "med": ["Before He left, Jesus promised His disciples that He would not leave them alone. The Father would send the Holy Spirit, whom He calls the Comforter. He is not a distant force, but God present in the life of the believer. His work includes teaching us and bringing the words of Jesus to our remembrance, right when we need them most.", "It has probably happened to you: in the middle of an argument or a moment of fear, a verse suddenly comes to mind that calms you or stops you before you say too much. That is one of the ways the Spirit works. That's why it's worth filling your heart with the words of Jesus and asking the Spirit every day to guide you, comfort you, and help you understand."], "pregunta": "Can you remember a time when a word from Jesus came to your mind just when you needed it?", "oracion": "Jesus, thank You for not leaving me alone and for giving me Your Holy Spirit. I need His comfort and His teaching today. When I don't know what to say or do, remind me of Your words. {S}Fill {N} with Your peace. Help me be sensitive to the voice of Your Spirit, to obey when He corrects me, and to rest when He comforts me. I want to walk guided by You at every moment. Amen.", "txt": "But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you."}, {"ref": [24, 3, 22, 23], "tema": "Gratitude", "titulo": "New Every Morning", "med": ["Yesterday may have been a hard day. Maybe you went to bed tired, with things still unresolved. But this morning something new began: God's mercy wasn't used up yesterday. It is renewed every day.", "Giving thanks when you wake up changes the way you see the day. Not because everything is fine, but because God is still faithful. His faithfulness doesn't depend on how yesterday went."], "pregunta": "What three things can you thank God for this morning?", "oracion": "Father, thank You for Your mercy, which is new again today. Thank You for the life of {N} and for this day that is beginning. {S}Help me not to carry the weight of yesterday, and to receive what You have for me today. Great is Your faithfulness. Amen.", "txt": "It is of the Lord’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness."}, {"ref": [53, 6, 6, 7], "tema": "Contentment", "titulo": "The Real Gain", "med": ["We are surrounded by messages telling us we need more: a new phone, trendy clothes, a bigger house. Paul says that great gain is found in living close to God with a contented heart. And he reminds us of something very simple: we brought nothing into this world, and we will carry nothing out.", "Contentment doesn't mean you stop working or stop having goals; it means not putting your peace in what you own. It's being able to enjoy a simple meal with your family, being thankful for the roof over your head, and not living in comparison with others. Today you can practice it by making a list of things you're thankful for. You'll see that you have more gifts from God than you imagined."], "pregunta": "What do you have today that you could thank God for, instead of wishing for what you don't have?", "oracion": "Father, thank You for everything You give me each day, even when I don't notice it. Forgive me when I live comparing myself and always wanting more. Teach me to find my joy in You and not in things. {S}Give me a grateful heart, content with what I have. Bless the home of {N}. Help me remember that my greatest treasure is knowing You and walking with You. Amen.", "txt": "But godliness with contentment is great gain. For we brought nothing into this world, and it is certain we can carry nothing out."}, {"ref": [54, 3, 16, 17], "tema": "Scripture", "titulo": "A Word That Shapes Us", "med": ["The Bible isn't just an old book to read at church. Paul tells Timothy that all Scripture is given by inspiration of God and is useful for our real lives: it teaches us what we don't know, shows us when we're wrong, corrects us with love, and helps us live rightly. It's like a good teacher who walks with us every day.", "The purpose of reading it isn't to collect facts, but to be equipped to do good. A few minutes in the Word in the morning can change how you treat your family or how you react in traffic. You don't need to read whole chapters at once: one verse, pondered calmly and put into practice, can bear more fruit than many pages read in a hurry."], "pregunta": "What teaching from the Bible do you sense God is asking you to put into practice this week?", "oracion": "My God, thank You for giving me Your Word to teach and guide me. Forgive me for the times I set it aside because I'm tired or distracted. Open my heart to hear You when I read, and give me humility to accept Your correction. {S}May what I learn from You show in my actions every day. Bless {N} with a hunger for Your Word as well. Prepare me to do good wherever I am. Amen.", "txt": "All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness: That the man of God may be perfect, throughly furnished unto all good works."}, {"ref": [47, 6, 9, 9], "tema": "Patience", "titulo": "Don't Grow Weary of Doing Good", "med": ["Sowing and reaping don't happen on the same day. Paul uses that picture from the farm to encourage us: the good we do has its season to bear fruit, even if we can't see it today. The danger is fainting along the way and giving up right when the seed was about to sprout. Patience isn't sitting still; it's continuing to do what is right while we wait.", "Think of the mother who repeats the same lessons to her children, the person who visits a sick relative every week, or the one who keeps being kind to a grumpy neighbor. Sometimes it seems pointless. But God never wastes a good deed done with love. If you are about to give up today, rest in Him for a moment and then sow again."], "pregunta": "In what area of your life do you feel like giving up, and how can you keep sowing patiently?", "oracion": "Lord, You know how tired I am and the times I feel that my effort is worth nothing. Teach me to wait for Your timing without losing hope. Renew the spirit of {N} today. {S}Give me patience with the people I find difficult and perseverance to keep doing good, even when I don't see results. I trust that the harvest will come in due season, because You are faithful. Amen.", "txt": "And let us not be weary in well doing: for in due season we shall reap, if we faint not."}, {"ref": [46, 9, 7, 7], "tema": "Generosity", "titulo": "Giving with Joy", "med": ["Paul encourages us to give as each one has decided in his heart, not grudgingly or because we feel we have to. What pleases God isn't the size of the gift, but the joy with which it's given. A small act done with love is worth more than a lot of money handed over reluctantly or just to be seen by others.", "Generosity doesn't depend on having a lot. You can share a plate of food, lend a tool, give your time to someone who needs to talk, or help an elderly neighbor with a chore. Giving frees us from clinging to what's ours and reminds us that everything we have comes from God. Today, look for a chance to give with a smile."], "pregunta": "What could you share today, with joy, with someone who needs it?", "oracion": "Lord, everything I have comes from Your hands: my time, my strength, my daily bread. Forgive me when I cling to what's mine or give grudgingly. Make the heart of {N} generous. {S}Show me whom I can help today and give me joy in sharing, without expecting anything in return. May my life reflect Your goodness to those around me. Amen.", "txt": "Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver."}, {"ref": [18, 4, 8, 8], "tema": "Rest", "titulo": "Sleeping in Peace", "med": ["Night is often when we think the most: bills to pay, problems in the family, worries about tomorrow. We lie down, but our mind stays awake. David wrote this psalm in the middle of hardship, and yet he declared that he would lie down in peace and sleep. His security didn't come from having everything solved, but from knowing that God was taking care of him.", "Before you go to sleep, you can do what David did: hand over to God whatever troubles you. It may help to quietly name each worry and say, I'm leaving this in Your hands. Your problems won't always disappear, but your soul can rest knowing that He never sleeps and keeps watching over you. Tomorrow there will be new strength; tonight, you can simply rest in Him."], "pregunta": "What worry do you need to hand over to God tonight before you sleep?", "oracion": "Lord, as this day ends, I place everything that worries me in Your hands. You know my burdens and what I need. Quiet my thoughts and give me peaceful sleep. {S}Watch over the rest of {N} too. Thank You that You never sleep and that You watch over me while I rest. Renew my strength for tomorrow and help me wake up trusting in Your care. Amen.", "txt": "I will both lay me down in peace, and sleep: for thou, Lord, only makest me dwell in safety."}, {"ref": [48, 4, 29, 29], "tema": "Words", "titulo": "Words That Build Up", "med": ["Words have great power. One harsh sentence can leave a wound that lasts for years, and one word of encouragement can lift up someone who was about to give up. Paul asks that no harmful words come out of our mouths, but only words that edify, that build up and do good to those who hear them.", "Think about your conversations today: at the table with your family, in the group chat, at work. Do your words add or take away? Building up isn't just avoiding insults or gossip; it's actively looking for something good to say: saying thank you, recognizing someone's effort, encouraging someone who is tired. Before you answer, especially when you're angry, it's worth asking yourself whether what you're about to say will help or hurt."], "pregunta": "Who could you give a word of encouragement or thanks to today, something they need to hear?", "oracion": "My God, set a guard over my mouth. Forgive me for the times my words have hurt, criticized, or discouraged others. Teach me to speak with grace and with truth. {S}Help me use my words to encourage, thank, and build up, at home and everywhere I go. May {N} receive words today that do them good. When I'm angry, give me the wisdom to stay quiet in time and to speak with love. Amen.", "txt": "Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers."}, {"ref": [51, 5, 18, 18], "tema": "Gratitude", "titulo": "Thankful for the Little Things", "med": ["Paul asks us to give thanks in every thing, and says this is God's will for us. He doesn't say to give thanks for everything that happens, but in the middle of everything. Even on a hard day there are small gifts we overlook: a hot cup of coffee, a bed to rest in, a message from a friend, the sun coming in through the window.", "Gratitude changes how we see. When we get used to complaining, we only see what's missing. When we learn to give thanks, we discover that God is present in details we used to ignore. A simple practice: before you go to sleep, name three small things you're thankful for. Over time you'll notice your heart becoming calmer, humbler, and more aware of God's goodness in everyday life."], "pregunta": "What three small things from today can you thank God for right now?", "oracion": "Lord, forgive me for the times I complain and fail to see Your daily gifts. Today I thank You for my food, for the roof over my head, for the air I breathe, and for the people You put in my path. Thank You also for the life of {N}. {S}Teach me to have a grateful heart on the good days and the hard ones, because You never stop taking care of me. Amen.", "txt": "In every thing give thanks: for this is the will of God in Christ Jesus concerning you."}, {"ref": [48, 2, 10, 10], "tema": "Purpose", "titulo": "Handmade by God", "med": ["Paul says that we are God's workmanship, like a piece a craftsman shapes with patience and care. You are not an accident or just another number in line at the bank or on a list at work. God made you on purpose and also prepared good works in advance for you to walk in. Your life has a meaning that doesn't depend on your job title, your paycheck, or anyone's applause.", "Sometimes we look for purpose in something huge and far away, but many of those good works are found in everyday life: listening to a tired coworker, cooking a meal with love, doing your job well even when no one notices, helping a neighbor with their groceries. Today you don't need the whole map of your life. It's enough to take the next step in what God has already placed in front of you."], "pregunta": "What simple good work is waiting for you today at home, at work, or in your neighborhood?", "oracion": "Father, thank You for making me with love; I am not here by chance. When I feel lost or without direction, remind me that You have already prepared a path for me. Show {N}, too, the purpose You have for their life. {S}Open my eyes to see the good works You set before me today, and give me a willing heart to do them with joy and humility. In Jesus' name, Amen.", "txt": "For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them."}, {"ref": [40, 10, 45, 45], "tema": "Service", "titulo": "Greatness Is in Serving", "med": ["The disciples argued about who would be the greatest. Jesus answered with His own life: He, the Son of man, came not to be served but to serve, and to give His life a ransom for many. In the world, greatness is measured by how many people wait on you. In God's kingdom it's measured the other way around: by how much love you put into serving others.", "Serving isn't always heroic. It's washing the dishes without being asked, giving up your seat on the bus, listening patiently to a grandparent, covering for a coworker who is having a bad day. When you serve like that, you look like Jesus. We don't do it to earn God's love, but because we have already received it. Today, look for one practical way to serve someone without expecting anything in return."], "pregunta": "Who could you serve today in a practical way, without anyone recognizing it?", "oracion": "Jesus, thank You for coming to serve and for giving Your life for me. Take from my heart the desire to be the center of attention and to be recognized. Teach me to serve humbly at home, at work, and in my community. Bless {N} with Your serving love. {S}Give me eyes to see the needs around me and hands ready to help with joy. Amen.", "txt": "For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many."}, {"ref": [48, 4, 32, 32], "tema": "Forgiveness", "titulo": "Forgiven to Forgive", "med": ["Paul asks us to be kind and tenderhearted toward one another, and he gives us the deepest reason: God has already forgiven us in Christ. Forgiveness doesn't come from the other person deserving it, but from remembering how much we have been forgiven. When we look at our own canceled debt, the offense of a neighbor, a coworker, or a family member starts to look a different size.", "Forgiving doesn't mean saying that what happened didn't hurt, or immediately trusting again the person who hurt you. It means letting go of the desire for revenge and leaving the account in God's hands. Maybe today you can take a small step: not retelling the story one more time, praying for that person, or sending a simple message. Forgiveness usually begins like that, little by little."], "pregunta": "Who is hard for you to forgive today, and what small step could you take toward that person?", "oracion": "Father, thank You that in Christ You forgave me far more than I could ever repay. You know the wounds I still carry and the names I find hard to say without anger. Today I place {N} in Your hands. {S}Help me let go of bitterness and treat others with the same mercy I receive from You every day. Heal my heart and teach me to truly forgive. Amen.", "txt": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."}, {"ref": [39, 6, 11, 11], "tema": "Provision", "titulo": "Today's Bread", "med": ["Jesus taught us to ask for our daily bread. Not bread for the whole year or for a lifetime, but for today. It's a simple prayer that reminds us we depend on God for the basics, and that He cares about our real needs: food, rent, work, the bus fare to get where we need to go.", "We often get anxious thinking about what's coming next month. This prayer invites us to live one day at a time. That doesn't mean we stop working or planning responsibly, but that we do it without anxiety, trusting that God knows what we need. And because Jesus said give us and not give me, it also reminds us of those who have no bread today and invites us to share ours."], "pregunta": "What specific need do you want to bring to God with confidence today?", "oracion": "Our Father, thank You for the food You put on my table every day. I bring You my needs for today, and I trust that You know each one. Provide for what {N} is lacking as well. {S}Take away my anxiety about tomorrow and help me work responsibly and live simply. Make me generous with those who don't have what they need today. In Jesus' name, Amen.", "txt": "Give us this day our daily bread."}, {"ref": [18, 121, 7, 8], "tema": "Protection", "titulo": "Kept in Your Going Out and Coming In", "med": ["Psalm 121 is a song for travelers. Those going up to Jerusalem faced dangerous roads, heat, and nights in the open. That's why the psalmist keeps repeating one word: preserve. God preserves your life, your soul, your going out and your coming in. He doesn't promise there will never be difficulties, but that at no moment will you be outside His care, from this time forth and for evermore.", "Think about your daily comings and goings: when you go to work, when your kids go to school, when you travel at night or come home late. You can put each of those moments in God's hands. Praying before you leave isn't a good-luck charm; it's an act of trust. You are recognizing that your ultimate safety is in a Father who never sleeps and who knows every step you take."], "pregunta": "What part of your comings and goings today do you want to intentionally place in God's hands?", "oracion": "Father, thank You that You never sleep and always take care of me. Today I place in Your hands my going out and my coming in, my trips and my returns home. Protect {N} wherever they go. {S}When I'm afraid of what I can't control, remind me that I am in Your care. Give me peace to live this day trusting You, now and always. In Jesus' name, Amen.", "txt": "The Lord shall preserve thee from all evil: he shall preserve thy soul. The Lord shall preserve thy going out and thy coming in from this time forth, and even for evermore."}, {"ref": [22, 40, 31, 31], "tema": "Waiting", "titulo": "Renewed Strength", "med": ["Waiting is one of the hardest things there is: waiting for a job, for a medical result, for a change in a child. Isaiah says that those who wait upon the Lord shall renew their strength. He isn't talking about a bored or resigned kind of waiting, but about actively trusting God. Like an eagle riding the wind, we learn to lean on a strength that isn't our own.", "Notice the order in the verse: fly, run, walk. Sometimes God gives us days with wings, but often the victory is simply to keep walking without fainting. That is faith too. If today you can only take one more step, take it holding God's hand. He knows what you are waiting for and renews your strength morning after morning."], "pregunta": "What are you waiting for today, and how can you place that waiting in God's hands?", "oracion": "Father, You know how long I've been waiting and how many times I've been discouraged. Today I want to trust You, even though I don't see the answer yet. Renew the strength of {N}. {S}When I lose heart, teach me to keep walking with You, step by step. Give me peace while I wait and a heart that believes Your timing is good, even when I don't always understand it. Amen.", "txt": "But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."}, {"ref": [39, 11, 28, 28], "tema": "Rest", "titulo": "Come, All You Who Are Weary", "med": ["Jesus didn't call the strong or those who had it all figured out. He called the weary and the heavy laden. If that's how you feel today, this invitation is just for you.", "Resting in God doesn't mean we stop doing what we're responsible for; it means we stop doing it alone. He offers to carry the weight with us."], "pregunta": "What burden are you carrying alone that you could leave in Jesus' hands?", "oracion": "Jesus, I come to You with my weariness. Today I bring {N} to You, with everything they are carrying. {S}Give rest to my body and my soul. Teach me to walk by Your side, without hurry and without fear. Amen.", "txt": "Come unto me, all ye that labour and are heavy laden, and I will give you rest."}, {"ref": [19, 3, 5, 6], "tema": "Trust", "titulo": "When You Don't Understand the Path", "med": ["We like to have everything under control: to know whether the money will last, how that paperwork will turn out, or what will happen with a child who is drifting away. But this proverb invites us to lean on God with all our heart, not just part of it. Our own understanding is valuable, but it has limits. Trusting God means recognizing that He sees what we can't.", "Acknowledging God in all your ways means including Him in the big things and the everyday ones: when you look for a job, decide on a purchase, or answer a difficult message. It isn't a formula to make everything turn out the way we want, but a relationship in which He leads and we follow. When the path seems crooked, you can rest knowing that God knows how to make it straight in His time and in His way."], "pregunta": "In what area of your life are you leaning only on your own understanding instead of trusting God?", "oracion": "Father, I confess that I often want to understand everything before I trust You. Today I choose to lean on Your wisdom and not just my own. I bring the life of {N} before You. {S}Teach me to acknowledge You in every decision, big or small, and to seek Your direction before I act. When I can't see the way clearly, give me peace to keep walking hand in hand with You, knowing that You direct my steps. Amen.", "txt": "Trust in the Lord with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."}, {"ref": [19, 17, 17, 17], "tema": "Friendship", "titulo": "A Friend at All Times", "med": ["It's easy to have friends when everything is going well, when there are parties, laughter, and good news. This proverb speaks of something deeper: a true friend loves at all times, even when illness, job loss, or grief come. And it says that a brother is born for adversity, to stand with us in hard times. Friendship is tested on the difficult days.", "Think of the people who were by your side when you needed it most; they are a gift from God. But the verse also challenges us to be that kind of friend. Maybe today you can call someone who is going through a hard time, bring them a meal, or simply listen without judging. That's how we reflect the faithful love of Jesus, who calls us His friends."], "pregunta": "Which of your friends is going through a hard time, and how could you be there for them today?", "oracion": "Lord Jesus, thank You for the friends You have placed in my path and for Your friendship that never fails. Teach me to love at all times, not only when it's easy. {S}Give me eyes to see who is hurting and courage to reach out with a word or a simple act of kindness. Surround {N} with good friends. May my friendships be sincere and faithful, and may they honor You. Amen.", "txt": "A friend loveth at all times, and a brother is born for adversity."}, {"ref": [39, 6, 6, 6], "tema": "Prayer", "titulo": "Alone with the Father", "med": ["Jesus taught that prayer isn't a performance for others. He invites us to go into a private place, shut the door, and talk with the Father in secret. You don't need fancy words or a special building. God sees what no one else sees and hears what you tell Him quietly, simply, and honestly.", "That private room can be your bedroom early in the morning, your commute to work, or a few minutes in the kitchen before everyone wakes up. What matters is setting aside a moment to be with God without distractions. You can start small: give thanks, tell Him what's worrying you, and ask for help for the day. He is waiting for you there."], "pregunta": "What time and place could you set aside each day to pray alone with God?", "oracion": "Father, thank You that I can talk with You at any time and in any place. Sometimes I get distracted, I rush, or I don't know what to say, but You still hear me. Today I bring the life of {N} before You. {S}Teach me to seek You in secret, with a sincere heart, and to make prayer a daily meeting with You. In that time alone, may I find peace and direction. Amen.", "txt": "But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."}, {"ref": [49, 4, 6, 7], "tema": "Peace", "titulo": "Trading Worry for Prayer", "med": ["Worry goes around and around the same thing, but it doesn't take us anywhere. Paul suggests something practical: turn each thing that worries you into a prayer. Name it, hand it over, and give thanks.", "The promise isn't that everything will turn out the way we want, but that the peace of God will keep our hearts and minds, like a guard at the door."], "pregunta": "What worry can you turn into a specific prayer today?", "oracion": "Lord, You know what worries me. Today, instead of going around in circles, I give it to You. Guard the heart and mind of {N}. {S}Thank You for listening. Fill me with Your peace, the kind that can't be explained. Amen.", "txt": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."}, {"ref": [58, 1, 5, 5], "tema": "Wisdom", "titulo": "Ask Without Fear", "med": ["James gives us a very practical invitation: if you lack wisdom, ask God for it. And he describes how God responds: He gives generously and doesn't scold. He won't look at you with annoyance or tell you that you should already know. God isn't like an impatient boss or a teacher who mocks questions. He is a Father who is glad when His children come to Him for direction.", "Every day we face decisions: how to answer a difficult message, what to do when money is tight, how to talk with a teenage son or daughter, whether or not to accept a job. Before rushing to look for answers just anywhere, stop for a moment and pray. God's wisdom often comes through His Word, through sound advice, or through a peace that brings order to our thoughts. Ask with confidence; He promised to give."], "pregunta": "What decision are you facing in which you need to ask God for wisdom?", "oracion": "Lord, I admit that I often don't know what to do and I act on impulse. Today I ask You for wisdom in my decisions, big and small. Thank You that You give generously and don't scold me for asking. Give {N} clarity, too, for every step they need to take. {S}Help me hear Your voice in Your Word and in good advice, and to calmly choose what pleases You. Amen.", "txt": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."}, {"ref": [57, 13, 5, 5], "tema": "Loneliness", "titulo": "He Will Never Leave Me", "med": ["This verse brings together two things that seem far apart: being content with what we have and knowing that God doesn't abandon us. We often try to fill the emptiness with things, shopping, or noise. But true companionship can't be bought. The promise is clear: God will never leave you nor forsake you, not in an empty house and not on a long night.", "Loneliness can feel heavy when you come home from work to a silent house, when you live far from family, or when you feel that no one around you understands you. God doesn't always take that feeling away all at once, but He is present in the middle of it. Talk to Him as you would to a friend. And maybe today you can also reach out to someone who feels alone."], "pregunta": "At what times of day do you feel loneliness most, and how could you invite God into those moments?", "oracion": "Father, there are days when I feel alone and no one seems to notice what I'm carrying inside. Thank You for promising never to leave me. Stay close to {N}. {S}Fill the silence of my home with Your presence and teach me to find contentment in what I have. Bring people into my life with whom I can share faith and life, and make me a companion for others too. Amen.", "txt": "Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee."}, {"ref": [23, 29, 11, 11], "tema": "Hope", "titulo": "Thoughts of Peace", "med": ["When the present is confusing, it's easy to think the future will be too. But God says that His thoughts toward us are thoughts of peace, and not of evil.", "This promise was given to a people who were far from home, in a hard time. God doesn't forget His own, not even while they wait."], "pregunta": "What part of your future do you need to entrust to God today?", "oracion": "God of hope, thank You for having good thoughts toward my life. I place the future of {N} in Your hands. {S}While I wait, give me patience and trust. Amen.", "txt": "For I know the thoughts that I think toward you, saith the Lord, thoughts of peace, and not of evil, to give you an expected end."}, {"ref": [61, 4, 19, 19], "tema": "Love", "titulo": "He First Loved Us", "med": ["Before we did anything right, before we ever looked for Him, God already loved us. His love isn't a prize to be earned; it's the starting point.", "When we understand how much we are loved, it becomes easier to love others: our family, the people we find difficult, the one who is alone."], "pregunta": "Who can you show a little of the love you have received today?", "oracion": "Father, thank You for loving me first, even when I didn't deserve it. May {N} rest in Your love today. {S}Teach me to love the way You love: with patience, with kindness, and without keeping score. Amen.", "txt": "We love him, because he first loved us."}, {"ref": [22, 41, 10, 10], "tema": "Strength", "titulo": "Fear Not, I Am with You", "med": ["God doesn't say that hard times won't come. He says something deeper: that we won't be alone in them. His presence is the reason not to be afraid.", "Notice the three promises: I will strengthen you, I will help you, and I will uphold you. When we feel we can't go on, He is the one who holds us up."], "pregunta": "In what situation today do you need to remember that God is holding you up?", "oracion": "Mighty God, thank You for being with me. When I'm afraid, remind me that Your hand holds me up. Strengthen {N} for whatever they have to face today. {S}May my trust be in You and not in my own strength. Amen.", "txt": "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."}, {"ref": [40, 4, 39, 39], "tema": "Peace", "titulo": "Calm in the Middle of the Wind", "med": ["The disciples were crossing the lake when a storm rose up so strong that water was coming into the boat. Terrified, they woke Jesus, who was sleeping peacefully. He got up, rebuked the wind, and spoke to the sea, and there was a great calm. The same men who feared the water discovered that the One in the boat with them had authority over the storm.", "You go through storms too: a worrying diagnosis, a debt, a family conflict, a sleepless night full of racing thoughts. The situation doesn't always change right away, but Jesus is still in your boat. You can cry out to Him honestly, as the disciples did. His presence brings a peace that doesn't depend on the weather outside, because it comes from knowing who is with you."], "pregunta": "What storm are you going through today, and what does it mean to you that Jesus is in your boat?", "oracion": "Jesus, You have authority over the wind and the sea. Today I bring You the storm I'm going through and the fear I feel inside. Calm my heart and help me trust that You are with me. Give {N} peace in the middle of their struggles. {S}When the waves seem bigger than I am, remind me that You are in my boat and You won't leave me alone. Amen.", "txt": "And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm."}, {"ref": [50, 3, 23, 24], "tema": "Work", "titulo": "Working for the Lord", "med": ["Paul wrote to people with hard jobs that got little recognition. He told them to do everything heartily, as to the Lord and not to people. That changes how we see our daily tasks: sweeping the shop, dealing with a difficult customer, unloading merchandise, or studying for an exam can also be a way of serving God.", "Sometimes no one notices your effort and the boss only sees the mistakes. This verse reminds you that God does see it, and that your final reward comes from Him. That doesn't mean working without rest or silently putting up with injustice, but doing your part with honesty and a good attitude. Today, before you begin, you can offer your whole workday to God."], "pregunta": "How would your day change if you did your work knowing you're doing it for the Lord?", "oracion": "Jesus, I give You the work of this day, the big things and the small ones. Forgive me when I complain or do things halfheartedly just because no one is watching. Give {N} strength and a good attitude. {S}Help me work with honesty, responsibility, and kindness toward those who work with me. May my effort be an offering to You, and may I find rest knowing that You see everything I do. Amen.", "txt": "And whatsoever ye do, do it heartily, as to the Lord, and not unto men; Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."}, {"ref": [57, 12, 1, 2], "tema": "Perseverance", "titulo": "Run with Your Eyes on Jesus", "med": ["The writer of Hebrews compares the life of faith to a long race. It isn't a short sprint but a test of endurance, and that's why he asks us to run with patience. He also encourages us to lay aside every weight that slows us down, like a runner who wouldn't carry a backpack full of rocks. And he reminds us that we don't run alone: many believers before us finished their race faithfully.", "The secret to not giving up is where we fix our eyes. If you look only at your own strength, your falls, or how far you still have to go, you'll get discouraged. But if you fix your eyes on Jesus, who endured the cross out of love, you'll find a reason to keep going. Maybe today it's hard to get up and face your responsibilities, hold your marriage together, or keep praying for something. Take one more step, looking to Jesus."], "pregunta": "What weight do you need to lay aside today so you can keep running with patience?", "oracion": "Jesus, You finished Your race with love and faithfulness, even when it meant the cross. Today I feel tired, and sometimes I want to stop. Help me let go of what weighs me down and fix my eyes on You. Give {N} strength not to give up. {S}When the road gets long, remind me that I'm not running alone and that You go ahead of me. Amen.", "txt": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us, Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God."}], "pt": [{"ref": [18, 119, 105, 105], "tema": "Direção", "titulo": "Uma luz para o próximo passo", "med": ["Uma lâmpada antiga não iluminava o caminho inteiro. Dava para ver onde pisar, e nada mais. Muitas vezes é assim que a Palavra de Deus funciona na nossa vida: ela não nos mostra todo o futuro, mas é suficiente para darmos o próximo passo com segurança.", "Talvez hoje você tenha perguntas sem resposta. Tudo bem. Não é preciso ver o fim do caminho para caminhar em paz. Basta saber que Deus vai à frente e que a sua Palavra ilumina o que está bem diante de você."], "pregunta": "Qual é o próximo passo que você precisa dar hoje, mesmo sem enxergar todo o caminho?", "oracion": "Senhor, obrigado porque a tua Palavra é luz. Hoje coloco {N} em tuas mãos. Quando eu não souber o que fazer, mostra-me o próximo passo. Tira o medo do que não vejo e dá-me paz para seguir em frente. {S}Que hoje eu caminhe confiando em ti. Amém.", "txt": "Tua palavra é lâmpada para meus pés e luz para meu caminho."}, {"ref": [5, 1, 9, 9], "tema": "Coragem", "titulo": "Esforce-se e seja valente", "med": ["Josué tinha pela frente uma tarefa enorme. Deus não prometeu que seria fácil, mas deu a ele um motivo para ser valente: o Senhor estaria com ele por onde quer que fosse.", "Coragem não é não sentir medo. É dar o passo mesmo com medo, sabendo que não estamos sozinhos."], "pregunta": "Que passo de coragem Deus está pedindo de você nesta fase da vida?", "oracion": "Senhor, às vezes me falta coragem. Hoje te peço que acompanhes {N} por onde quer que vá. {S}Tira o desânimo e dá-me coragem para fazer o que é certo. Obrigado porque vais comigo. Amém.", "txt": "Olha que te mando que te esforces e sejas valente: não temas nem desmaies, porque o SENHOR teu Deus será contigo onde quer que fores."}, {"ref": [15, 8, 10, 10], "tema": "Alegria", "titulo": "A alegria que fortalece", "med": ["O povo de Israel chorava ao ouvir a lei de Deus, porque percebia o quanto tinha se afastado. Mas Neemias disse que não ficassem tristes: era um dia consagrado ao Senhor, dia de celebrar, comer juntos e repartir com quem não tinha nada preparado. E deixou uma verdade poderosa: a alegria do Senhor é a nossa força. A alegria que vem de Deus não nega os problemas, mas nos sustenta no meio deles.", "Essa alegria não depende de tudo dar certo. Ela nasce de saber que somos amados e perdoados. Repare também que o texto une a alegria à generosidade: enviar porções aos que não tinham nada preparado. Hoje você pode viver essa alegria de forma prática: dividir uma refeição, ligar para alguém que está sozinho, agradecer em voz alta. Quando a alegria de Deus enche o coração, ela aparece na mesa e nas mãos abertas."], "pregunta": "Com quem você poderia repartir hoje um pouco do que tem, para que essa pessoa também se alegre?", "oracion": "Jesus, às vezes a tristeza e o cansaço tiram as minhas forças. Hoje te peço que a tua alegria seja a minha força, mesmo que nem tudo esteja resolvido. Enche de alegria o coração de {N}. {S}Ensina-me a celebrar a tua bondade no dia a dia e a repartir com quem tem menos do que eu. Que a minha alegria não dependa das circunstâncias, mas de saber que tu estás comigo e me amas. Amém.", "txt": "E disse-lhes mais: Ide, comei gorduras, e bebei doçuras, e enviai porções aos que não têm preparado; porque este é um dia consagrado ao nosso Senhor; portanto não vos entristeçais, porque a alegria do SENHOR é vossa força."}, {"ref": [49, 2, 3, 4], "tema": "Humildade", "titulo": "Olhar também para os outros", "med": ["Paulo pede que não façamos nada por rivalidade nem para impressionar os outros. A humildade que ele propõe não é achar que não valemos nada, mas deixar de nos colocar sempre no centro. É considerar os outros importantes e prestar atenção às necessidades deles, não só às nossas. É um jeito de amar muito parecido com o de Jesus.", "No dia a dia, isso aparece nos detalhes: deixar o outro ter razão numa discussão sem importância, comemorar a conquista de um colega sem inveja, oferecer o lugar, perguntar como alguém está e realmente ouvir a resposta. A humildade liberta, porque não precisamos mais provar o tempo todo quem somos. Deus nos olha com amor, e isso basta."], "pregunta": "Em que situação desta semana você poderia colocar os interesses de outra pessoa antes dos seus?", "oracion": "Jesus, tu, sendo Senhor de tudo, te fizeste servo de todos. Perdoa-me pelas vezes em que busco aparecer, competir ou ter sempre a última palavra. Forma um coração humilde em {N}. {S}Abre os meus olhos para ver as necessidades de quem está ao meu redor e dá-me alegria em servir. Que eu não precise do aplauso de ninguém, porque o teu amor me basta e me sustenta. Amém.", "txt": "Nada façais por rivalidade egoísta nem por vanglória; ao contrário, por humildade cada um considere o outro superior a si mesmo. Cada um não cuide somente do que é seu; mas cada um cuide também do que é dos outros."}, {"ref": [5, 24, 15, 15], "tema": "Família", "titulo": "Eu e a minha casa", "med": ["Josué reuniu o povo e colocou diante dele uma decisão: a quem iriam servir. Depois falou por si e pelos seus, e disse que a sua casa serviria ao Senhor. Ele não esperou que todos concordassem; tomou a decisão primeiro no próprio coração. Muitas vezes, a fé numa família começa com alguém que tem coragem de dar o primeiro passo.", "Servir a Deus em casa não exige um lar perfeito. Isso aparece em coisas simples: pedir desculpas depois de uma discussão, agradecer juntos antes de comer, ouvir sem o celular na mão, ter paciência com os filhos ou com os pais idosos. Talvez na sua família ninguém mais ore ainda. A sua fidelidade tranquila, dia após dia, pode ser uma semente que Deus fará crescer."], "pregunta": "Que gesto concreto você poderia ter hoje para que a sua casa reflita o amor de Deus?", "oracion": "Senhor, obrigado pela minha família, com suas alegrias e também com suas dificuldades. Quero que a minha casa seja um lugar onde tu és honrado, mesmo que às vezes eu não saiba por onde começar. Guarda o lar de {N}. {S}Dá-me paciência para ouvir, humildade para pedir perdão e ternura para cuidar dos meus. Que as nossas palavras e atitudes mostrem que servimos a ti. Amém.", "txt": "E se mal vos parece servir ao SENHOR, escolhei hoje a quem sirvais; se aos deuses a os quais serviram vossos pais, quando estiveram da outra parte do rio, ou aos deuses dos amorreus em cuja terra habitais: que eu e minha casa serviremos ao SENHOR."}, {"ref": [50, 3, 12, 12], "tema": "Compaixão", "titulo": "Vestidos de misericórdia", "med": ["Toda manhã escolhemos que roupa vestir. Paulo usa essa imagem para dizer que também precisamos nos vestir por dentro: de misericórdia, bondade, humildade, mansidão e paciência. E ele faz isso lembrando primeiro quem somos: escolhidos de Deus, santos e amados. Não somos compassivos para ganhar o amor de Deus, mas porque já o recebemos.", "A compaixão aparece em detalhes concretos: oferecer o lugar no ônibus, ter paciência com um idoso que demora na fila, não zombar do erro de alguém. Às vezes o cansaço nos deixa ásperos, por isso precisamos nos vestir de misericórdia de novo e de novo. Hoje, antes de sair de casa, peça a Deus que ajude você a olhar para os outros como ele olha para você."], "pregunta": "Com qual pessoa você tem mais dificuldade de ter paciência, e como poderia mostrar compaixão a ela hoje?", "oracion": "Pai querido, obrigado porque me escolheste e me amas sem que eu mereça. Hoje quero me vestir da tua compaixão e da tua bondade. Tira de mim a dureza, o orgulho e a impaciência que às vezes ferem quem está ao meu redor. {S}Ajuda-me a tratar cada pessoa com a mesma misericórdia que tens comigo. Mostra a tua ternura a {N}. Que as minhas mãos e as minhas palavras levem hoje um pouco do teu amor. Amém.", "txt": "Por isso, como escolhidos de Deus, santos e amados, revesti-vos de sentimentos de misericórdia, bondade, humildade, mansidão, e paciência."}, {"ref": [44, 5, 8, 8], "tema": "Salvação", "titulo": "Amados antes de mudar", "med": ["Costumamos pensar que o amor precisa ser conquistado: nos esforçamos para ser aceitos no trabalho, na família ou entre os amigos. Mas este versículo mostra algo diferente. Deus provou o seu amor quando ainda éramos pecadores, quando não tínhamos nada para oferecer. Na cruz, Cristo morreu por nós sem esperar que primeiro fôssemos bons.", "Essa verdade muda o jeito como nos aproximamos de Deus. Você não precisa arrumar a sua vida antes de vir a ele; pode vir do jeito que está, com suas falhas e suas dúvidas. A salvação é um presente que se recebe pela fé, não um prêmio por bom comportamento. Quando sentir que não merece o amor de Deus, olhe para a cruz: ali está a prova de que ele ama você de verdade."], "pregunta": "Existe algo que faz você sentir que não merece o amor de Deus? O que muda quando você olha para a cruz?", "oracion": "Jesus, obrigado por morrer na cruz por mim quando eu ainda estava longe de ti. Não mereço tanto amor, mas o recebo com gratidão e com fé. Obrigado pelo perdão e pela vida nova que me dás. {S}Ajuda-me a viver cada dia lembrando o que fizeste por mim. Mostra o teu grande amor a {N}. Que toda a minha vida seja uma resposta de amor ao teu sacrifício. Amém.", "txt": "Mas Deus prova o seu amor por nós através de Cristo haver morrido por nós, quando ainda éramos pecadores."}, {"ref": [46, 5, 17, 17], "tema": "Recomeço", "titulo": "Tudo pode ser novo", "med": ["Há manhãs em que sentimos que carregamos tudo de ontem: erros, palavras que não devíamos ter dito, decisões que deram errado. Paulo nos lembra que quem está em Cristo não é só alguém que melhorou um pouco, mas uma nova criatura. O que é velho já não tem a última palavra sobre a sua vida. Deus não olha para você pelo seu pior dia, mas pelo que ele está fazendo em você.", "Recomeçar não significa esquecer tudo de uma vez, mas caminhar diferente, passo a passo. Talvez hoje seja pedir perdão a alguém da sua casa, voltar à oração que você deixou de lado ou tratar com paciência um colega difícil. Cada pequena mudança é um sinal dessa vida nova. Você não precisa esperar o primeiro de janeiro nem a segunda-feira: em Cristo, hoje mesmo pode ser o seu recomeço."], "pregunta": "Que coisa velha você precisa deixar para trás hoje para caminhar na vida nova que Deus oferece?", "oracion": "Senhor, obrigado porque em Cristo me fazes uma nova criatura. Às vezes tenho dificuldade de largar o que eu era e fico olhando para trás. Hoje coloco {N} em tuas mãos. {S}Ajuda-me a crer que a tua graça é maior do que os meus erros e a dar, com a tua ajuda, pequenos passos de mudança em casa, no trabalho e no meu jeito de falar. Que este dia seja um verdadeiro recomeço contigo. Amém.", "txt": "Portanto, se alguém está em Cristo, uma nova criatura é; as coisas velhas já passaram, eis que tudo se fez novo."}, {"ref": [18, 34, 18, 18], "tema": "Luto", "titulo": "Perto do coração partido", "med": ["Quando perdemos alguém que amamos, às vezes sentimos que Deus está longe. Este salmo diz o contrário: o Senhor está perto daqueles que estão com o coração partido. Ele não se afasta da dor nem nos pede para escondê-la. Ele se aproxima justamente ali, onde as palavras não bastam e o peito dói. O seu choro não é falta de fé; Deus o ouve.", "O luto leva tempo e não segue uma ordem certinha. Há dias bons e dias em que uma música, uma foto ou uma cadeira vazia nos derrubam outra vez. Você não precisa fingir que está bem. Pode contar a Deus a sua tristeza do jeito que ela é, lembrar com gratidão de quem partiu e se deixar acompanhar por pessoas que amam você."], "pregunta": "Que parte da sua dor você precisa contar a Deus hoje, com sinceridade?", "oracion": "Senhor, tu vês o vazio que a pessoa de quem sinto falta deixou e as lágrimas que ninguém mais vê. Não entendo tudo o que aconteceu, mas sei que estás perto de mim. Abraça hoje o coração de {N}. {S}Dá-me consolo nos dias difíceis e gratidão pelas lembranças que guardo. Cerca-me de pessoas que me acompanhem e ajuda-me a esperar em ti, que nunca me soltas. Amém.", "txt": "O SENHOR está perto daqueles que estão com o coração partido, e sava os aflitos de espírito."}, {"ref": [46, 12, 9, 9], "tema": "Graça", "titulo": "A tua graça me basta", "med": ["Paulo pediu a Deus várias vezes que tirasse dele uma dificuldade que o afligia. A resposta não foi a que ele esperava: o Senhor disse que a sua graça bastava e que o seu poder se aperfeiçoa na fraqueza. Paulo entendeu que não precisava fingir ser forte. Os seus limites se tornaram o lugar onde Cristo podia agir.", "Vivemos numa cultura que exige que pareçamos sempre capazes e bem-sucedidos. Mas todos temos fraquezas: o temperamento difícil de controlar, o cansaço, os medos, os erros do passado. A graça de Deus não é um prêmio para quem faz tudo certo; é o seu favor imerecido que nos sustenta justamente quando não aguentamos mais. Hoje você pode descansar nessa graça e parar de carregar tudo sozinho."], "pregunta": "Em qual fraqueza sua você precisa descansar hoje na graça de Deus?", "oracion": "Senhor, obrigado porque a tua graça me basta. Não preciso ser perfeito para ser amado por ti. Entrego a ti as minhas fraquezas, os meus erros e os meus cansaços, e te peço que o teu poder se mostre neles. Envolve {N} com a tua graça. {S}Ajuda-me a deixar de aparentar força e a depender de ti cada dia, com humildade e confiança. Em nome de Jesus, Amém.", "txt": "Mas ele me disse: “Minha graça te basta, porque meu poder se aperfeiçoa na fraqueza”. Por isso, com muito prazer, eu me orgulharei nas minhas fraquezas, para que o poder de Cristo habite em mim."}, {"ref": [42, 14, 26, 26], "tema": "Espírito", "titulo": "Um Consolador que ensina", "med": ["Antes de partir, Jesus prometeu aos discípulos que não os deixaria sozinhos. O Pai enviaria o Espírito Santo, a quem ele chama de Consolador. Ele não é uma força distante, mas Deus presente na vida de quem crê. A sua missão inclui nos ensinar e nos fazer lembrar as palavras de Jesus, justamente quando mais precisamos delas.", "Com certeza já aconteceu com você: no meio de uma discussão ou de um momento de medo, de repente você se lembra de um versículo que traz calma ou que segura você antes de falar demais. Essa é uma das maneiras como o Espírito age. Por isso vale a pena encher o coração com as palavras de Jesus e pedir todos os dias ao Espírito que guie, console e ajude você a entender."], "pregunta": "Você se lembra de algum momento em que uma palavra de Jesus veio à sua mente bem na hora em que você precisava?", "oracion": "Jesus, obrigado porque não me deixaste sozinho e me deste o teu Espírito Santo. Preciso do consolo e do ensino dele neste dia. Quando eu não souber o que dizer ou o que fazer, faze-me lembrar as tuas palavras. {S}Enche {N} da tua paz. Ajuda-me a ser sensível à voz do teu Espírito, a obedecer quando ele me corrige e a descansar quando ele me consola. Quero andar guiado por ti em todo momento. Amém.", "txt": "Mas aquele Consolador, o Espírito Santo, ao qual o Pai enviará em meu nome, esse vos ensinará tudo, e tudo quanto tenho dito vós, ele vos fará lembrar."}, {"ref": [24, 3, 22, 23], "tema": "Gratidão", "titulo": "Novas a cada manhã", "med": ["Ontem pode ter sido um dia difícil. Talvez você tenha ido dormir cansado, com coisas sem resolver. Mas nesta manhã começou algo novo: a misericórdia de Deus não se esgotou ontem. Ela se renova a cada dia.", "Agradecer ao acordar muda o jeito como vemos o dia. Não porque tudo esteja bem, mas porque Deus continua fiel. A fidelidade dele não depende de como foi o nosso dia de ontem."], "pregunta": "Por quais três coisas você pode agradecer nesta manhã?", "oracion": "Pai, obrigado pela tua misericórdia, que hoje é nova outra vez. Obrigado pela vida de {N} e por este dia que começa. {S}Ajuda-me a não carregar o peso de ontem e a receber o que tens para mim hoje. Grande é a tua fidelidade. Amém.", "txt": "É pelas bondades do SENHOR que não somos consumidos, porque suas misericórdias não têm fim. Elas são novas a cada manhã; grande é a tua fidelidade."}, {"ref": [53, 6, 6, 7], "tema": "Contentamento", "titulo": "O verdadeiro lucro", "med": ["Vivemos cercados de mensagens dizendo que precisamos de mais: um celular novo, roupa da moda, uma casa maior. Paulo afirma que o grande lucro está em viver perto de Deus com um coração contente. E nos lembra algo bem simples: nada trouxemos a este mundo e nada levaremos quando partirmos.", "Contentamento não significa parar de trabalhar ou de ter metas, mas não colocar a nossa paz naquilo que temos. É conseguir aproveitar uma refeição simples com a família, agradecer pelo teto sobre a sua cabeça e não viver se comparando com os outros. Hoje você pode praticar isso fazendo uma lista de coisas pelas quais é grato. Vai perceber que tem mais presentes de Deus do que imaginava."], "pregunta": "Pelo que você poderia agradecer a Deus hoje, em vez de desejar o que não tem?", "oracion": "Pai, obrigado por tudo o que me dás a cada dia, mesmo quando não percebo. Perdoa-me quando vivo me comparando e querendo sempre mais. Ensina-me a encontrar a minha alegria em ti e não nas coisas. {S}Dá-me um coração grato e contente com o que tenho. Abençoa o lar de {N}. Ajuda-me a lembrar que a minha maior riqueza é te conhecer e caminhar contigo. Amém.", "txt": "Mas grande lucro é a devoção divina acompanhada de contentamento. Pois nada trouxemos ao mundo, e portanto nada podemos levar dele."}, {"ref": [54, 3, 16, 17], "tema": "Palavra", "titulo": "Uma Palavra que forma", "med": ["A Bíblia não é só um livro antigo para ler na igreja. Paulo diz a Timóteo que toda a Escritura é inspirada por Deus e é proveitosa para a vida real: ela nos ensina o que não sabemos, nos mostra quando erramos, nos corrige com amor e nos ajuda a viver de forma justa. É como um bom professor que nos acompanha todos os dias.", "O objetivo de lê-la não é acumular informações, mas sermos preparados para fazer o bem. Alguns minutos com a Palavra de manhã podem mudar o jeito como você trata a sua família ou como reage no trânsito. Não é preciso ler capítulos inteiros de uma vez: um versículo meditado com calma, e colocado em prática, pode dar mais fruto do que muitas páginas lidas às pressas."], "pregunta": "Que ensinamento da Bíblia você sente que Deus está pedindo que você coloque em prática nesta semana?", "oracion": "Meu Deus, obrigado por me dares a tua Palavra para me ensinar e me guiar. Perdoa-me pelas vezes em que a deixo de lado por cansaço ou distração. Abre o meu coração para te ouvir quando leio, e dá-me humildade para aceitar a tua correção. {S}Que o que aprendo de ti apareça nas minhas atitudes de cada dia. Abençoa também {N} com fome da tua Palavra. Prepara-me para fazer o bem onde quer que eu esteja. Amém.", "txt": "Toda a Escritura é divinamente inspirada e proveitosa para ensinar, para mostrar o erro, para corrigir, e para instruir na justiça; para que o homem de Deus seja completo, plenamente instruído para toda boa obra."}, {"ref": [47, 6, 9, 9], "tema": "Paciência", "titulo": "Não se canse de fazer o bem", "med": ["Semear e colher não acontecem no mesmo dia. Paulo usa essa imagem do campo para nos animar: o bem que fazemos tem o seu tempo de dar fruto, mesmo que hoje não se veja. O risco é desanimar no caminho e desistir justo quando a semente estava para brotar. Paciência não é ficar parado, mas continuar fazendo o que é certo enquanto esperamos.", "Pense na mãe que repete os mesmos ensinamentos aos filhos, em quem visita um parente doente toda semana ou em quem continua sendo gentil com um vizinho mal-humorado. Às vezes parece inútil. Mas Deus não desperdiça nenhuma boa obra feita com amor. Se hoje você está a ponto de desistir, descanse um pouco nele e volte a semear."], "pregunta": "Em que área da sua vida você sente vontade de desistir, e como pode continuar semeando com paciência?", "oracion": "Senhor, tu conheces o meu cansaço e as vezes em que sinto que o meu esforço não serve para nada. Ensina-me a esperar o teu tempo sem perder a esperança. Renova hoje o ânimo de {N}. {S}Dá-me paciência com as pessoas difíceis e perseverança para continuar fazendo o bem, mesmo quando não vejo resultados. Confio que no tempo certo virá a colheita, porque tu és fiel. Amém.", "txt": "Porém não cansemos de fazer o bem, pois no tempo devido colheremos, se não desistirmos."}, {"ref": [46, 9, 7, 7], "tema": "Generosidade", "titulo": "Dar com alegria", "med": ["Paulo incentiva cada um a dar conforme decidiu no coração, sem tristeza e sem se sentir obrigado. O que agrada a Deus não é o tamanho do presente, mas a alegria com que ele é dado. Um pequeno gesto feito com amor vale mais do que muito dinheiro entregue de má vontade ou só para os outros verem.", "A generosidade não depende de ter muito. Você pode dividir um prato de comida, emprestar uma ferramenta, dar o seu tempo a alguém que precisa conversar ou ajudar um vizinho idoso com alguma tarefa. Dar nos liberta de viver agarrados ao que é nosso e nos lembra que tudo o que temos vem de Deus. Hoje, procure uma oportunidade de dar com um sorriso."], "pregunta": "O que você poderia repartir hoje, com alegria, com alguém que precisa?", "oracion": "Senhor, tudo o que tenho vem das tuas mãos: o meu tempo, as minhas forças, o meu pão de cada dia. Perdoa-me quando me apego ao que é meu ou dou de má vontade. Faz generoso o coração de {N}. {S}Mostra-me a quem posso ajudar hoje e dá-me alegria em repartir, sem esperar nada em troca. Que a minha vida seja um reflexo da tua bondade para quem está ao meu redor. Amém.", "txt": "Cada qual faça como propõe em seu coração, não com tristeza, ou por obrigação; porque Deus ama ao que dá com alegria."}, {"ref": [18, 4, 8, 8], "tema": "Descanso", "titulo": "Dormir em paz", "med": ["Muitas vezes a noite é o momento em que mais pensamos: contas para pagar, problemas na família, preocupações com o dia seguinte. Deitamos, mas a mente continua acordada. Davi escreveu este salmo em meio a dificuldades e, mesmo assim, declarou que se deitaria e dormiria em paz. A segurança dele não vinha de tudo estar resolvido, mas de saber que Deus cuidava dele.", "Antes de dormir, você pode fazer o mesmo que Davi: entregar a Deus o que inquieta você. Talvez ajude dizer em voz baixa cada preocupação e falar: isto eu deixo em tuas mãos. Nem sempre os problemas vão desaparecer, mas a sua alma pode descansar sabendo que ele não dorme e continua cuidando de você. Amanhã haverá novas forças; esta noite, você pode simplesmente descansar nele."], "pregunta": "Que preocupação você precisa entregar a Deus esta noite, antes de dormir?", "oracion": "Senhor, ao terminar este dia coloco em tuas mãos tudo o que me preocupa. Tu conheces os meus fardos e sabes do que preciso. Acalma os meus pensamentos e dá-me um sono tranquilo. {S}Guarda também o descanso de {N}. Obrigado porque tu não dormes e cuidas de mim enquanto descanso. Renova as minhas forças para amanhã e ajuda-me a acordar confiando no teu cuidado. Amém.", "txt": "Eu deitarei, e dormirei em paz; porque só tu, SENHOR, me fazes descansar seguro."}, {"ref": [48, 4, 29, 29], "tema": "Palavras", "titulo": "Palavras que edificam", "med": ["As palavras têm muito poder. Uma frase dura pode deixar uma ferida que dura anos, e uma palavra de ânimo pode levantar alguém que estava a ponto de desistir. Paulo nos pede que da nossa boca não saiam palavras que fazem mal, mas aquelas que servem para edificação, isto é, que constroem e fazem bem a quem as ouve.", "Pense nas suas conversas de hoje: à mesa com a família, no grupo de mensagens, no trabalho. As suas palavras somam ou diminuem? Edificar não é só evitar ofensas ou fofocas, mas procurar ativamente dizer algo bom: agradecer, reconhecer um esforço, animar alguém cansado. Antes de responder, principalmente quando estiver com raiva, vale a pena se perguntar se o que você vai dizer vai ajudar ou machucar."], "pregunta": "A quem você poderia dizer hoje uma palavra de ânimo ou de gratidão que essa pessoa precisa ouvir?", "oracion": "Meu Deus, põe guarda na minha boca. Perdoa-me pelas vezes em que as minhas palavras feriram, criticaram ou desanimaram os outros. Ensina-me a falar com graça e com verdade. {S}Ajuda-me a usar as minhas palavras para animar, agradecer e edificar, em casa e em todo lugar. Que {N} receba hoje palavras que lhe façam bem. Quando eu estiver com raiva, dá-me a sabedoria de calar na hora certa e de falar com amor. Amém.", "txt": "Não saia de vossa boca palavra imoral; mas sim a boa para a edificação conforme a necessidade; para que comunique graça aos que a ouvem."}, {"ref": [51, 5, 18, 18], "tema": "Gratidão", "titulo": "Obrigado pelas pequenas coisas", "med": ["Paulo nos pede que agradeçamos em tudo, e diz que essa é a vontade de Deus para nós. Ele não diz para agradecer por tudo o que acontece, mas no meio de tudo. Mesmo num dia complicado, há pequenos presentes que deixamos passar: um café quente, uma cama para descansar, a mensagem de um amigo, o sol entrando pela janela.", "A gratidão muda o olhar. Quando nos acostumamos a reclamar, só vemos o que falta. Quando aprendemos a agradecer, descobrimos que Deus está presente em detalhes que antes ignorávamos. Uma prática simples: antes de dormir, diga três pequenas coisas pelas quais você é grato. Com o tempo, você vai perceber que o seu coração fica mais tranquilo, mais humilde e mais atento à bondade de Deus no dia a dia."], "pregunta": "Quais três pequenas coisas de hoje você pode agradecer a Deus agora mesmo?", "oracion": "Senhor, perdoa-me pelas vezes em que reclamo e não vejo os teus presentes de cada dia. Hoje te agradeço pelo pão, pelo teto, pelo ar que respiro e pelas pessoas que colocas no meu caminho. Obrigado também pela vida de {N}. {S}Ensina-me a ter um coração grato nos dias bons e nos difíceis, porque tu nunca deixas de cuidar de mim. Amém.", "txt": "Agradecei em tudo, pois essa é a vontade de Deus em Cristo Jesus para vós mesmos."}, {"ref": [48, 2, 10, 10], "tema": "Propósito", "titulo": "Feito à mão por Deus", "med": ["Paulo diz que fomos feitos por Deus, como uma obra que um artesão trabalha com paciência e carinho. Você não é um acidente nem só mais um número na fila do banco ou na lista do trabalho. Deus formou você com intenção e, além disso, preparou de antemão boas obras para que você ande nelas. A sua vida tem um sentido que não depende do seu cargo, do seu salário nem dos aplausos dos outros.", "Às vezes procuramos o propósito em algo enorme e distante, mas muitas dessas boas obras estão no dia a dia: ouvir um colega cansado, preparar a comida com amor, fazer bem o seu trabalho mesmo que ninguém perceba, ajudar um vizinho com as sacolas. Hoje você não precisa ter o mapa inteiro da sua vida. Basta dar o próximo passo naquilo que Deus já colocou diante de você."], "pregunta": "Que boa obra simples está esperando por você hoje em casa, no trabalho ou no seu bairro?", "oracion": "Pai, obrigado porque me fizeste com amor e não estou aqui por acaso. Quando eu me sentir perdido ou sem rumo, lembra-me de que já preparaste um caminho para mim. Mostra também a {N} o propósito que tens para a vida dele. {S}Abre os meus olhos para ver as boas obras que colocas hoje diante de mim, e dá-me um coração disposto a realizá-las com alegria e humildade. Em nome de Jesus, Amém.", "txt": "Pois nós fomos feitos por ele, criados em Cristo Jesus para as boas obras, que Deus preparou para que nelas andássemos."}, {"ref": [40, 10, 45, 45], "tema": "Serviço", "titulo": "Grande é quem serve", "med": ["Os discípulos discutiam sobre quem seria o mais importante. Jesus respondeu com a própria vida: ele, o Filho do homem, não veio para ser servido, mas para servir e dar a sua vida por muitos. No mundo, a grandeza é medida por quantas pessoas servem você. No reino de Deus é ao contrário: ela se mede pelo amor que você coloca a serviço dos outros.", "Servir nem sempre é algo heroico. É lavar a louça sem ninguém pedir, oferecer o lugar no ônibus, ouvir com paciência um avô, cobrir um colega que está num dia ruim. Quando você serve assim, fica parecido com Jesus. Não fazemos isso para ganhar o amor de Deus, mas porque já o recebemos. Hoje, procure uma forma concreta de servir alguém sem esperar nada em troca."], "pregunta": "A quem você poderia servir hoje de um jeito prático, sem que ninguém reconheça?", "oracion": "Jesus, obrigado porque vieste para servir e deste a tua vida por mim. Tira do meu coração o desejo de ser o centro e de receber reconhecimento. Ensina-me a servir com humildade em casa, no trabalho e na minha comunidade. Abençoa {N} com o teu amor que serve. {S}Dá-me olhos para ver as necessidades ao meu redor e mãos dispostas a ajudar com alegria. Amém.", "txt": "Porque também não veio o Filho do homem para ser servido, mas para servir, e dar sua vida em resgate por muitos."}, {"ref": [48, 4, 32, 32], "tema": "Perdão", "titulo": "Perdoados para perdoar", "med": ["Paulo nos pede que sejamos benignos e misericordiosos uns com os outros, e dá o motivo mais profundo: Deus já nos perdoou em Cristo. O perdão não nasce de o outro merecer, mas de lembrar o quanto nós mesmos fomos perdoados. Quando olhamos para a nossa própria dívida cancelada, a ofensa do vizinho, do colega ou do irmão começa a ganhar outro tamanho.", "Perdoar não significa dizer que o que aconteceu não doeu, nem voltar a confiar imediatamente em quem feriu você. É largar o desejo de vingança e deixar a conta nas mãos de Deus. Talvez hoje você possa dar um passo pequeno: não contar a história mais uma vez, orar por essa pessoa ou mandar uma mensagem simples. O perdão costuma começar assim, aos poucos."], "pregunta": "Quem você tem dificuldade de perdoar hoje, e que passo pequeno poderia dar em direção a essa pessoa?", "oracion": "Pai, obrigado porque em Cristo me perdoaste muito mais do que eu jamais poderia pagar. Tu conheces as feridas que ainda carrego e os nomes que tenho dificuldade de pronunciar sem raiva. Hoje coloco {N} em tuas mãos. {S}Ajuda-me a largar o rancor e a tratar os outros com a mesma misericórdia que recebo de ti a cada dia. Cura o meu coração e ensina-me a perdoar de verdade. Amém.", "txt": "Em vez disso, sede benignos uns com os outros, misericordiosos, perdoando-vos uns aos outros, como também Deus vos perdoou em Cristo."}, {"ref": [39, 6, 11, 11], "tema": "Provisão", "titulo": "O pão de hoje", "med": ["Jesus nos ensinou a pedir o pão de cada dia. Não o do ano inteiro nem o da vida toda, mas o de hoje. É uma oração simples que nos lembra que dependemos de Deus para o básico, e que ele se importa com as nossas necessidades concretas: a comida, o aluguel, o trabalho, a passagem do ônibus.", "Muitas vezes ficamos angustiados pensando no que virá no mês que vem. Essa oração nos convida a viver um dia de cada vez. Não significa parar de trabalhar ou de planejar com responsabilidade, mas fazer isso sem ansiedade, confiando que Deus sabe do que você precisa. E como Jesus disse nos dá e não me dá, ela também nos lembra de quem não tem pão hoje e nos convida a repartir o nosso."], "pregunta": "Que necessidade concreta de hoje você quer apresentar a Deus com confiança?", "oracion": "Pai nosso, obrigado pelo pão que colocas na minha mesa a cada dia. Apresento a ti as minhas necessidades de hoje e confio que conheces cada uma delas. Supre também o que falta a {N}. {S}Tira de mim a ansiedade pelo amanhã e ajuda-me a trabalhar com responsabilidade e a viver com simplicidade. Faz-me generoso com quem hoje não tem o necessário. Em nome de Jesus, Amém.", "txt": "O pão nosso de cada dia nos dá hoje."}, {"ref": [18, 121, 7, 8], "tema": "Proteção", "titulo": "Guardado na saída e na entrada", "med": ["O Salmo 121 é um cântico de viajantes. Quem subia a Jerusalém enfrentava caminhos perigosos, calor e noites ao relento. Por isso o salmista repete uma palavra: guardar. Deus guarda a sua vida, a sua alma, a sua saída e a sua entrada. Ele não promete que nunca haverá dificuldades, mas que em nenhum momento você estará fora do seu cuidado, desde agora e para sempre.", "Pense nas suas saídas e entradas de cada dia: quando você vai para o trabalho, quando os filhos vão para a escola, quando você viaja à noite ou volta tarde para casa. Você pode colocar cada um desses momentos nas mãos de Deus. Orar antes de sair não é um amuleto, é um ato de confiança. É reconhecer que a sua segurança final está num Pai que não dorme e que conhece cada passo seu."], "pregunta": "Que saída ou entrada do seu dia você quer colocar hoje, de forma consciente, nas mãos de Deus?", "oracion": "Pai, obrigado porque tu não dormes e sempre cuidas de mim. Hoje coloco em tuas mãos as minhas saídas e as minhas entradas, as minhas viagens e as minhas voltas para casa. Protege {N} aonde quer que vá. {S}Quando eu sentir medo do que não posso controlar, lembra-me de que estou sob o teu cuidado. Dá-me paz para viver este dia confiando em ti, agora e sempre. Em nome de Jesus, Amém.", "txt": "O SENHOR te guardará de todo mal; ele guardará a tua alma. O SENHOR guardará tua saída e tua entrada, desde agora e para sempre."}, {"ref": [22, 40, 31, 31], "tema": "Espera", "titulo": "Novas forças", "med": ["Esperar é uma das coisas mais difíceis: esperar um emprego, o resultado de um exame, uma mudança num filho. Isaías diz que os que confiam no Senhor renovarão as forças. Ele não fala de uma espera chata ou conformada, mas de confiar ativamente em Deus. Como a águia que aproveita o vento, aprendemos a nos apoiar numa força que não é a nossa.", "Repare na ordem do versículo: subir com asas, correr, caminhar. Às vezes Deus nos dá dias de asas, mas muitas vezes a vitória é simplesmente continuar caminhando sem se fatigar. Isso também é fé. Se hoje você só consegue dar mais um passo, dê esse passo de mãos dadas com Deus. Ele conhece a sua espera e renova as suas forças manhã após manhã."], "pregunta": "O que você está esperando hoje, e como pode colocar essa espera nas mãos de Deus?", "oracion": "Pai, tu sabes há quanto tempo estou esperando e quantas vezes desanimei. Hoje quero confiar em ti, mesmo sem ver ainda a resposta. Renova as forças de {N}. {S}Quando me faltar ânimo, ensina-me a continuar caminhando contigo, passo a passo. Dá-me paz enquanto espero e um coração que creia que o teu tempo é bom, mesmo quando não o entendo. Amém.", "txt": "Mas os que confiam no SENHOR renovarão as forças, subirão com asas como águias; correrão, e não se cansarão; caminharão, e não se fatigarão."}, {"ref": [39, 11, 28, 28], "tema": "Descanso", "titulo": "Venham os cansados", "med": ["Jesus não chamou os fortes nem quem já tinha tudo resolvido. Ele chamou os cansados e sobrecarregados. Se hoje você se sente assim, este convite é justamente para você.", "Descansar em Deus não é deixar de fazer o que nos cabe, mas deixar de fazer isso sozinhos. Ele se oferece para carregar o peso conosco."], "pregunta": "Que fardo você está carregando sozinho e que poderia deixar nas mãos de Jesus?", "oracion": "Jesus, venho a ti com o meu cansaço. Hoje te trago {N}, com tudo o que carrega. {S}Dá-me descanso para o corpo e para a alma. Ensina-me a caminhar ao teu lado, sem pressa e sem medo. Amém.", "txt": "Vinde a mim todos vós que estais cansados e sobrecarregados, e eu vos farei descansar."}, {"ref": [19, 3, 5, 6], "tema": "Confiança", "titulo": "Quando você não entende o caminho", "med": ["Gostamos de ter tudo sob controle: saber se o dinheiro vai dar, como vai terminar aquele processo ou o que vai acontecer com um filho que está se afastando. Mas este provérbio nos convida a confiar em Deus de todo o coração, não só com uma parte dele. O nosso próprio entendimento tem valor, mas tem limites. Confiar em Deus é reconhec
