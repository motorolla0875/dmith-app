# Voxelium para Microsoft Store: la versión congelada de portales (rama portales-v2) en /windows/
location = /windows { return 301 /windows/; }
location = /windows/manifest.webmanifest { alias /var/www/dmith-app/voxelium-windows/manifest.webmanifest; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
location = /windows/sw.js { alias /var/www/dmith-app/voxelium-windows/sw.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
location /windows/ {
    alias /var/www/voxelium-portales/bloques/;
    index index.html;
    add_header Cache-Control "no-cache";
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '<head>' '<head><script>window.VOX_PORTAL="windows"</script><link rel="manifest" href="/windows/manifest.webmanifest"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/windows/sw.js",{scope:"/windows/"})</script>';
}
