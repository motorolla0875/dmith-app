<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Uma · Tu asistente con IA</title>
<meta name="description" content="Uma es tu asistente con inteligencia artificial: recetas, mensajes, tareas, traducciones y charla. Gratis, en español, inglés y portugués.">
<meta name="theme-color" content="#FAF8FF">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #1C1433; --violeta: #6B4EFF; --violeta-2: #5236E6; --durazno: #FFB48A; --rubor: #FFE3D6;
    --papel: #FAF8FF; --lila: #EFEAFF; --gris: #6E6785; --linea: #E4DEF5; --menta: #1FBF95;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 17px/1.55 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--violeta); outline-offset: 2px; border-radius: 10px; }
  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; max-width: 820px; margin: 0 auto; }

  /* ---------- cara de Uma ---------- */
  .cara { display: block; overflow: visible; }
  .cara .ojos { transform-origin: 50% 54%; animation: parpadeo 5s infinite; }
  @keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .cara .pupilas { transition: transform .35s ease; }
  .cara.pensando .pupilas { transform: translate(3px, -4px); }
  .cara .boca { transform-origin: 50% 74%; transition: transform .2s; }
  .cara.hablando .boca { animation: habla .26s infinite alternate; }
  @keyframes habla { from { transform: scaleY(.55); } to { transform: scaleY(1.25); } }
  .cara .cejas { transition: transform .3s; }
  .cara.pensando .cejas { transform: translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .cara .ojos, .cara.hablando .boca { animation: none; } }

  /* ---------- barra ---------- */
  .barra { display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--linea); background: rgba(250,248,255,.92); backdrop-filter: blur(10px); position: relative; z-index: 2; }
  .barra .mini { width: 44px; height: 44px; border-radius: 50%; background: var(--lila); display: grid; place-items: center; overflow: hidden; flex: none; }
  .barra .mini svg { width: 44px; height: 44px; }
  .quien { flex: 1; min-width: 0; }
  .quien b { display: block; font-size: 19px; font-weight: 700; line-height: 1.1; }
  .quien small { display: flex; align-items: center; gap: 6px; color: var(--gris); font-size: 14px; }
  .quien small::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--menta); }
  .quien small.ocupada::before { background: var(--violeta); animation: latido 1s infinite alternate; }
  @keyframes latido { to { opacity: .3; } }
  .acciones { display: flex; gap: 6px; align-items: center; }
  .acciones select { border: 1px solid var(--linea); background: #fff; border-radius: 12px; padding: 7px 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .icono { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; display: grid; place-items: center; cursor: pointer; }
  .icono svg { width: 20px; height: 20px; }

  /* ---------- conversación ---------- */
  .charla { overflow-y: auto; padding: 22px 16px 10px; scroll-behavior: smooth; }
  .inicio { text-align: center; padding: 22px 6px 10px; }
  .inicio .grande { width: 168px; height: 168px; margin: 0 auto 14px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, var(--lila) 70%); display: grid; place-items: center; }
  .inicio .grande svg { width: 168px; height: 168px; }
  .inicio h1 { font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 0; }
  .inicio p { color: var(--gris); margin: 10px auto 24px; max-width: 30ch; font-size: 18px; }
  .ideas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; max-width: 560px; margin: 0 auto; }
  .ideas button { border: 1px solid var(--linea); background: #fff; border-radius: 18px; padding: 14px 15px; cursor: pointer; display: grid; gap: 2px; }
  .ideas button b { font-weight: 700; font-size: 16px; }
  .ideas button span { color: var(--gris); font-size: 14.5px; line-height: 1.35; }
  .ideas button:hover { border-color: var(--violeta); }

  .msj { display: flex; gap: 10px; margin: 0 0 18px; }
  .msj.yo { justify-content: flex-end; }
  .msj.yo .texto { background: var(--violeta); color: #fff; border-radius: 22px 22px 6px 22px; padding: 11px 16px; max-width: 82%; white-space: pre-wrap; word-wrap: break-word; }
  .msj.uma .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--lila); flex: none; overflow: hidden; margin-top: 2px; }
  .msj.uma .avatar svg { width: 32px; height: 32px; }
  .msj.uma .texto { min-width: 0; max-width: calc(100% - 42px); word-wrap: break-word; }
  .texto p { margin: 0 0 10px; } .texto p:last-child { margin-bottom: 0; }
  .texto ul, .texto ol { margin: 4px 0 10px; padding-left: 22px; } .texto li { margin: 3px 0; }
  .texto strong { font-weight: 700; }
  .texto code { background: var(--lila); border-radius: 6px; padding: 1px 6px; font-size: .92em; }
  .texto h3 { font-size: 18px; margin: 12px 0 6px; }
  .puntos { display: inline-flex; gap: 5px; padding: 8px 0; } .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--violeta); opacity: .35; animation: punto 1s infinite; }
  .puntos i:nth-child(2) { animation-delay: .15s; } .puntos i:nth-child(3) { animation-delay: .3s; }
  @keyframes punto { 50% { opacity: 1; transform: translateY(-3px); } }
  .aviso { background: var(--rubor); color: #7A3A1B; border-radius: 16px; padding: 12px 14px; font-size: 15.5px; }
  .copiar { margin-top: 6px; border: 0; background: transparent; color: var(--gris); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px 0; }

  /* ---------- escribir ---------- */
  .escribir { padding: 10px 14px max(14px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--papel) 30%); }
  .caja { display: flex; align-items: flex-end; gap: 8px; background: #fff; border: 1.5px solid var(--linea); border-radius: 26px; padding: 6px 6px 6px 14px; box-shadow: 0 6px 24px rgba(28,20,51,.06); }
  .caja:focus-within { border-color: var(--violeta); }
  .caja textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; padding: 10px 0; max-height: 160px; line-height: 1.4; }
  .enviar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--violeta); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .enviar:disabled { background: #CFC6EE; cursor: default; }
  .enviar svg { width: 20px; height: 20px; }
  .clip { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--gris); display: grid; place-items: center; cursor: pointer; flex: none; margin-left: -10px; }
  .clip:hover { color: var(--violeta); background: var(--lila); }
  .clip svg { width: 22px; height: 22px; }
  .menu-adj { display: none; gap: 8px; margin: 0 0 8px 4px; }
  .menu-adj.abierto { display: flex; }
  .menu-adj button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: 15.5px; }
  .menu-adj button:hover { border-color: var(--violeta); }
  .adjunto { display: none; align-items: center; gap: 10px; margin: 0 0 8px; padding: 8px 10px; background: #fff; border: 1px solid var(--linea); border-radius: 18px; width: fit-content; max-width: 100%; }
  .adjunto.visible { display: flex; }
  .adjunto img { width: 52px; height: 52px; object-fit: cover; border-radius: 12px; }
  .adjunto .doc { width: 52px; height: 52px; border-radius: 12px; background: var(--rubor); display: grid; place-items: center; font-weight: 800; color: #B3404E; font-size: 14px; }
  .adjunto span { font-size: 14.5px; color: var(--gris); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .adjunto span b { display: block; color: var(--tinta); font-weight: 600; }
  .adjunto button { border: 0; background: var(--lila); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 17px; flex: none; }
  .msj.yo .foto { display: block; max-width: 220px; border-radius: 16px; margin: 2px 0 6px auto; }
  .msj.yo .chipdoc { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.2); border-radius: 10px; padding: 4px 10px; font-size: 14px; margin-bottom: 6px; }
  .pie { text-align: center; color: var(--gris); font-size: 12.5px; margin-top: 8px; }

  @media (max-width: 420px) { .ideas { grid-template-columns: 1fr; } .acciones select { padding: 6px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="uma" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="60" fill="#EFEAFF"/>
    <ellipse cx="60" cy="24" rx="17" ry="15" fill="#3A2340"/>
    <path d="M22 70c-6-30 10-50 38-50s44 20 38 50c-3 16-6 30-14 40H36c-8-10-11-24-14-40Z" fill="#3A2340"/>
    <path d="M40 104c2-8 10-12 20-12s18 4 20 12v16H40Z" fill="#6B4EFF"/>
    <rect x="53" y="82" width="14" height="14" rx="6" fill="#D99A74"/>
    <ellipse cx="60" cy="62" rx="27" ry="29" fill="#E9AE86"/>
    <path d="M33 56c2-17 14-26 29-26 13 0 24 8 26 22-10-1-19-6-25-14-5 9-17 16-30 18Z" fill="#3A2340"/>
    <circle cx="33.5" cy="69" r="3" fill="#FFB48A"/><circle cx="86.5" cy="69" r="3" fill="#FFB48A"/>
    <g class="cejas"><path d="M43 55q6-4 12 0" stroke="#3A2340" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M65 55q6-4 12 0" stroke="#3A2340" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
    <g class="ojos"><ellipse cx="49" cy="63" rx="4.6" ry="5.4" fill="#fff"/><ellipse cx="71" cy="63" rx="4.6" ry="5.4" fill="#fff"/>
      <g class="pupilas"><circle cx="49" cy="64" r="3.4" fill="#24152B"/><circle cx="71" cy="64" r="3.4" fill="#24152B"/><circle cx="50.2" cy="62.6" r="1.1" fill="#fff"/><circle cx="72.2" cy="62.6" r="1.1" fill="#fff"/></g></g>
    <ellipse cx="42" cy="73" rx="5" ry="3" fill="#F08F7A" opacity=".45"/><ellipse cx="78" cy="73" rx="5" ry="3" fill="#F08F7A" opacity=".45"/>
    <g fill="#B97A5A" opacity=".55"><circle cx="45" cy="70" r=".9"/><circle cx="48" cy="72" r=".9"/><circle cx="75" cy="70" r=".9"/><circle cx="72" cy="72" r=".9"/></g>
    <g class="boca"><path d="M52 78q8 8 16 0q-8 3-16 0Z" fill="#B3404E"/></g>
  </symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-nuevo" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
</svg>

<div class="app">
  <header class="barra">
    <div class="mini"><svg class="cara" id="caraMini"><use href="#uma"/></svg></div>
    <div class="quien"><b>Uma</b><small id="estado">En línea</small></div>
    <div class="acciones">
      <select id="idioma" aria-label="Idioma"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option></select>
      <button class="icono" id="nuevo" type="button" aria-label="Nueva charla"><svg><use href="#i-nuevo"/></svg></button>
    </div>
  </header>

  <main class="charla" id="charla" aria-live="polite"></main>

  <footer class="escribir">
    <div class="menu-adj" id="menuAdj">
      <button type="button" id="btnFoto">📷 <span id="txtFoto">Foto</span></button>
      <button type="button" id="btnPdf">📄 <span>PDF</span></button>
    </div>
    <div class="adjunto" id="adjunto" aria-live="polite"></div>
    <input type="file" id="inFoto" accept="image/*" hidden>
    <input type="file" id="inPdf" accept="application/pdf,.pdf" hidden>
    <form class="caja" id="form">
      <button class="clip" id="clip" type="button" aria-label="Adjuntar foto o PDF" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.4 20a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
      <textarea id="entrada" rows="1" aria-label="Mensaje para Uma"></textarea>
      <button class="enviar" id="enviar" type="submit" disabled aria-label="Enviar"><svg><use href="#i-flecha"/></svg></button>
    </form>
    <div class="pie" id="pie"></div>
  </footer>
</div>

<script>
const T = {
  es: { hola: "¡Hola! Soy Uma", holaN: n => `¡Hola, ${n}! Soy Uma`, sub: "Preguntame lo que quieras. Te ayudo con recetas, mensajes, tareas y lo que se te ocurra.",
    ph: "Escribile a Uma…", foto: "Foto", fotoQ: "¿Qué ves en esta foto?", pdfQ: "Resumime este PDF en pocas líneas.", leyendo: "Leyendo el PDF…", paginas: n => `${n} página${n === 1 ? "" : "s"}`, pie: "Uma es una IA y puede equivocarse. Revisá lo importante.", linea: "En línea", piensa: "Pensando…", escribe: "Escribiendo…", copiar: "Copiar", copiado: "¡Copiado!",
    ideas: [["Receta con lo que tengo", "Tengo pollo, papas y cebolla", "Tengo pollo, papas y cebolla. ¿Qué cocino hoy?"], ["Escribir un mensaje", "Para pedir un día en el trabajo", "Ayudame a escribir un mensaje para pedirle a mi jefe el viernes libre."],
      ["Ayuda con la tarea", "Explicame las fracciones fácil", "Explicame las fracciones de forma fácil, con un ejemplo."], ["Un plan para hoy", "Algo lindo y barato", "Dame ideas de planes lindos y baratos para hacer hoy."]],
    err: { sin_clave: "Uma todavía no está conectada. Falta configurar la clave en el servidor.", limite: "Por hoy llegaste al límite de mensajes. ¡Volvé mañana y seguimos!", cupo: "Uma está atendiendo a mucha gente. Probá de nuevo en un ratito.", red: "No me pude conectar. Revisá tu internet y probá otra vez.", clave: "La clave de Groq no es válida. Revisá que esté bien copiada en el servidor.", ia: "Uma tuvo un problema para responder. Probá de nuevo en un ratito.", limite_fotos: "Por hoy ya mandaste muchas fotos. ¡Mañana seguimos!", pdf_vacio: "Ese PDF no tiene texto para leer (parece escaneado). Probá mandándome una foto de la página.", pdf_error: "No pude abrir ese PDF. Probá con otro." } },
  en: { hola: "Hi! I'm Uma", holaN: n => `Hi, ${n}! I'm Uma`, sub: "Ask me anything. I can help with recipes, messages, homework and whatever you need.",
    ph: "Message Uma…", foto: "Photo", fotoQ: "What do you see in this photo?", pdfQ: "Summarize this PDF in a few lines.", leyendo: "Reading the PDF…", paginas: n => `${n} page${n === 1 ? "" : "s"}`, pie: "Uma is an AI and can make mistakes. Check important info.", linea: "Online", piensa: "Thinking…", escribe: "Typing…", copiar: "Copy", copiado: "Copied!",
    ideas: [["Cook with what I have", "Chicken, potatoes and onion", "I have chicken, potatoes and onion. What should I cook today?"], ["Write a message", "Asking for a day off", "Help me write a message asking my boss for Friday off."],
      ["Homework help", "Explain fractions simply", "Explain fractions in a simple way, with an example."], ["A plan for today", "Something fun and cheap", "Give me ideas for fun, cheap things to do today."]],
    err: { sin_clave: "Uma isn't connected yet. The server key still needs to be set up.", limite: "You've reached today's message limit. Come back tomorrow!", cupo: "Uma is talking to lots of people. Try again in a moment.", red: "I couldn't connect. Check your internet and try again.", clave: "The Groq key isn't valid. Check it on the server.", ia: "Uma had a problem answering. Try again in a moment.", limite_fotos: "You've sent a lot of photos today. See you tomorrow!", pdf_vacio: "That PDF has no readable text (it looks scanned). Try sending a photo of the page.", pdf_error: "I couldn't open that PDF. Try another one." } },
  pt: { hola: "Oi! Eu sou a Uma", holaN: n => `Oi, ${n}! Eu sou a Uma`, sub: "Pergunte o que quiser. Eu te ajudo com receitas, mensagens, lição de casa e muito mais.",
    ph: "Escreva para a Uma…", foto: "Foto", fotoQ: "O que você vê nesta foto?", pdfQ: "Resuma este PDF em poucas linhas.", leyendo: "Lendo o PDF…", paginas: n => `${n} página${n === 1 ? "" : "s"}`, pie: "A Uma é uma IA e pode errar. Confira o que for importante.", linea: "Online", piensa: "Pensando…", escribe: "Digitando…", copiar: "Copiar", copiado: "Copiado!",
    ideas: [["Receita com o que tenho", "Frango, batata e cebola", "Tenho frango, batata e cebola. O que eu cozinho hoje?"], ["Escrever uma mensagem", "Pedir um dia de folga", "Me ajuda a escrever uma mensagem pedindo a sexta de folga para o meu chefe."],
      ["Ajuda com a lição", "Frações de um jeito fácil", "Me explica frações de um jeito fácil, com um exemplo."], ["Um plano para hoje", "Algo legal e barato", "Me dá ideias de programas legais e baratos para hoje."]],
    err: { sin_clave: "A Uma ainda não está conectada. Falta configurar a chave no servidor.", limite: "Você chegou ao limite de mensagens de hoje. Volte amanhã!", cupo: "A Uma está atendendo muita gente. Tente de novo daqui a pouco.", red: "Não consegui conectar. Confira sua internet e tente de novo.", clave: "A chave do Groq não é válida. Confira no servidor.", ia: "A Uma teve um problema para responder. Tente de novo daqui a pouco.", limite_fotos: "Você já mandou muitas fotos hoje. Até amanhã!", pdf_vacio: "Esse PDF não tem texto legível (parece escaneado). Tente mandar uma foto da página.", pdf_error: "Não consegui abrir esse PDF. Tente outro." } },
};
const $ = id => document.getElementById(id);
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const cargar = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };

let lang = cargar("uma-idioma", (navigator.language || "es").slice(0, 2));
if (!T[lang]) lang = "es";
let mensajes = cargar("uma-chat", []);
let nombre = cargar("uma-nombre", "");
let ocupada = false;
const t = () => T[lang];

function caras(clase) { document.querySelectorAll(".cara").forEach(c => { c.classList.remove("pensando", "hablando"); if (clase) c.classList.add(clase); }); }
function estado(txt, activa) { $("estado").textContent = txt; $("estado").classList.toggle("ocupada", !!activa); }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  const lineas = esc(s).split("\n"); let out = "", lista = null;
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const cerrar = () => { if (lista) { out += `</${lista}>`; lista = null; } };
  for (const l of lineas) {
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== "ul") { cerrar(); out += "<ul>"; lista = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== "ol") { cerrar(); out += "<ol>"; lista = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { cerrar(); out += `<h3>${inline(m[1])}</h3>`; }
    else if (l.trim() === "") { cerrar(); }
    else { cerrar(); out += `<p>${inline(l)}</p>`; }
  }
  cerrar(); return out;
}

function pintarInicio() {
  const x = t();
  $("charla").innerHTML = `<div class="inicio"><div class="grande"><svg class="cara" viewBox="0 0 120 120"><use href="#uma"/></svg></div>
    <h1>${esc(nombre ? x.holaN(nombre) : x.hola)}</h1><p>${esc(x.sub)}</p>
    <div class="ideas">${x.ideas.map(([a, b, q]) => `<button type="button" data-q="${esc(q)}"><b>${esc(a)}</b><span>${esc(b)}</span></button>`).join("")}</div></div>`;
}
function burbuja(m) {
  const d = document.createElement("div");
  if (m.role === "user") {
    d.className = "msj yo"; d.innerHTML = `<div class="texto"></div>`; const c = d.querySelector(".texto");
    if (m.miniatura) { const im = document.createElement("img"); im.className = "foto"; im.src = m.miniatura; im.alt = ""; c.appendChild(im); }
    if (m.doc) { const ch = document.createElement("div"); ch.className = "chipdoc"; ch.textContent = "📄 " + m.doc; c.appendChild(ch); c.appendChild(document.createElement("br")); }
    c.appendChild(document.createTextNode(m.ver ?? m.content));
  }
  else { d.className = "msj uma"; d.innerHTML = `<div class="avatar"><svg class="cara" viewBox="0 0 120 120"><use href="#uma"/></svg></div><div><div class="texto">${md(m.content)}</div>${m.content ? `<button class="copiar" type="button">${t().copiar}</button>` : ""}</div>`; }
  return d;
}
function pintarTodo() {
  if (!mensajes.length) return pintarInicio();
  $("charla").innerHTML = ""; mensajes.forEach(m => $("charla").appendChild(burbuja(m)));
  bajar();
}
const bajar = () => { $("charla").scrollTop = $("charla").scrollHeight; };

function textos() {
  const x = t(); document.documentElement.lang = lang; $("entrada").placeholder = x.ph; $("txtFoto").textContent = x.foto; $("pie").textContent = x.pie; $("idioma").value = lang;
  if (!ocupada) estado(x.linea);
}

function detectarNombre(s) {
  const m = s.match(/\b(?:me llamo|mi nombre es|my name is|i'm called|me chamo|meu nome é)\s+([A-Za-zÁÉÍÓÚáéíóúÑñÜüÇçÃãÕõ]{2,20})/i);
  if (m) { nombre = m[1][0].toUpperCase() + m[1].slice(1); guardar("uma-nombre", nombre); }
}

async function enviar(texto) {
  texto = texto.trim(); if (ocupada) return;
  const adj = adjunto; if (!texto && !adj) return;
  if (!texto) texto = adj.tipo === "foto" ? t().fotoQ : t().pdfQ;
  detectarNombre(texto);
  if (!mensajes.length) $("charla").innerHTML = "";
  const m = { role: "user", content: texto };
  if (adj && adj.tipo === "pdf") { m.doc = adj.nombre; m.ver = texto; m.content = `${texto}\n\n[Documento PDF "${adj.nombre}"${adj.cortado ? " (solo la primera parte)" : ""}]:\n${adj.texto}`; }
  if (adj && adj.tipo === "foto") { m.miniatura = adj.mini; m.ver = texto; m.content = texto + " [la persona mandó una foto]"; }
  mensajes.push(m); $("charla").appendChild(burbuja(m));
  $("entrada").value = ""; quitarAdjunto(); ajustar();
  ocupada = true; $("enviar").disabled = true; estado(t().piensa, true); caras("pensando");
  const fila = document.createElement("div"); fila.className = "msj uma";
  fila.innerHTML = `<div class="avatar"><svg class="cara pensando" viewBox="0 0 120 120"><use href="#uma"/></svg></div><div><div class="texto"><span class="puntos"><i></i><i></i><i></i></span></div></div>`;
  $("charla").appendChild(fila); bajar();
  const caja = fila.querySelector(".texto");
  let respuesta = "";
  try {
    const r = await fetch("/api/uma/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensajes: mensajes.map(x => ({ role: x.role, content: x.content })), lang, nombre, imagen: adj && adj.tipo === "foto" ? adj.imagen : undefined }) });
    if (!r.ok) { let e = "red"; try { e = (await r.json()).error; } catch (x) {} throw Object.assign(new Error(e), { tipo: e }); }
    const lector = r.body.getReader(), dec = new TextDecoder();
    estado(t().escribe, true); caras("hablando");
    for (;;) {
      const { value, done } = await lector.read(); if (done) break;
      respuesta += dec.decode(value, { stream: true }); caja.innerHTML = md(respuesta); bajar();
    }
    if (!respuesta.trim()) throw Object.assign(new Error("vacia"), { tipo: "cupo" });
    mensajes.push({ role: "assistant", content: respuesta }); guardar("uma-chat", mensajes.slice(-30));
    fila.replaceWith(burbuja(mensajes.at(-1)));
  } catch (e) {
    mensajes.pop(); guardar("uma-chat", mensajes.slice(-40));
    caja.innerHTML = `<div class="aviso">${esc(t().err[e.tipo] || t().err.red)}</div>`;
  }
  ocupada = false; estado(t().linea); caras(""); ajustar(); bajar();
}

function ajustar() { const e = $("entrada"); e.style.height = "auto"; e.style.height = Math.min(e.scrollHeight, 160) + "px"; $("enviar").disabled = ocupada || (!e.value.trim() && !adjunto); }

/* ---------- adjuntos: foto y PDF ---------- */
let adjunto = null;
function quitarAdjunto() { adjunto = null; $("adjunto").classList.remove("visible"); $("adjunto").innerHTML = ""; ajustar(); }
function mostrarAdjunto(html) {
  $("adjunto").innerHTML = html + `<button type="button" id="quitarAdj" aria-label="Quitar">×</button>`; $("adjunto").classList.add("visible");
  $("quitarAdj").onclick = quitarAdjunto; $("menuAdj").classList.remove("abierto"); $("clip").setAttribute("aria-expanded", "false"); ajustar(); $("entrada").focus();
}
function avisoChat(tipo) { const d = document.createElement("div"); d.className = "msj uma"; d.innerHTML = `<div class="avatar"><svg class="cara" viewBox="0 0 120 120"><use href="#uma"/></svg></div><div><div class="texto"><div class="aviso">${esc(t().err[tipo])}</div></div></div>`; if (!mensajes.length) $("charla").innerHTML = ""; $("charla").appendChild(d); bajar(); }
function achicar(file, max, calidad) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", calidad)); };
    im.onerror = () => { URL.revokeObjectURL(url); mal(new Error("imagen")); }; im.src = url;
  });
}
let pdfjs = null;
function cargarPdfjs() {
  if (pdfjs) return pdfjs;
  pdfjs = new Promise((ok, mal) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfjs = null; mal(new Error("pdfjs")); }; document.head.appendChild(sc); });
  return pdfjs;
}
async function leerPdf(file) {
  const lib = await cargarPdfjs(); const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let texto = "", cortado = false;
  for (let i = 1; i <= doc.numPages; i++) {
    const pag = await (await doc.getPage(i)).getTextContent();
    texto += pag.items.map(x => x.str).join(" ").replace(/\s+/g, " ").trim() + "\n\n";
    if (texto.length > 8000) { cortado = true; break; }
  }
  return { texto: texto.slice(0, 8000).trim(), paginas: doc.numPages, cortado };
}
$("clip").addEventListener("click", () => { const a = $("menuAdj").classList.toggle("abierto"); $("clip").setAttribute("aria-expanded", a); });
$("btnFoto").addEventListener("click", () => $("inFoto").click());
$("btnPdf").addEventListener("click", () => $("inPdf").click());
$("inFoto").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const imagen = await achicar(f, 1024, .82), mini = await achicar(f, 360, .7);
    adjunto = { tipo: "foto", imagen, mini };
    mostrarAdjunto(`<img src="${mini}" alt=""><span><b>${esc(t().foto)}</b>${esc(f.name || "")}</span>`);
  } catch (x) { avisoChat("pdf_error"); }
});
$("inPdf").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  mostrarAdjunto(`<div class="doc">PDF</div><span><b>${esc(f.name)}</b>${esc(t().leyendo)}</span>`); adjunto = null; ajustar();
  try {
    const r = await leerPdf(f);
    if (r.texto.length < 30) { quitarAdjunto(); return avisoChat("pdf_vacio"); }
    adjunto = { tipo: "pdf", nombre: f.name, texto: r.texto, cortado: r.cortado };
    mostrarAdjunto(`<div class="doc">PDF</div><span><b>${esc(f.name)}</b>${esc(t().paginas(r.paginas))}</span>`);
  } catch (x) { quitarAdjunto(); avisoChat("pdf_error"); }
});
$("entrada").addEventListener("input", ajustar);
$("entrada").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); enviar($("entrada").value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); enviar($("entrada").value); });
$("charla").addEventListener("click", async e => {
  const idea = e.target.closest("[data-q]"); if (idea) return enviar(idea.dataset.q);
  const c = e.target.closest(".copiar"); if (c) {
    const txt = c.previousElementSibling.innerText;
    try { await navigator.clipboard.writeText(txt); c.textContent = t().copiado; setTimeout(() => c.textContent = t().copiar, 1400); } catch (x) {}
  }
});
$("idioma").addEventListener("change", e => { lang = e.target.value; guardar("uma-idioma", lang); textos(); if (!mensajes.length) pintarInicio(); });
$("nuevo").addEventListener("click", () => { if (ocupada) return; mensajes = []; guardar("uma-chat", []); pintarInicio(); $("entrada").focus(); });

textos(); pintarTodo();
</script>
</body>
