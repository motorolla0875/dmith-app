<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Pago listo! · dmith Sitios</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #181B4A; color: #fff; font: 400 17px/1.55 "DM Sans", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 460px; width: 100%; background: #fff; color: #15172E; border-radius: 22px; padding: 30px 24px; text-align: center; }
  .big { font-size: 60px; }
  h1 { font: 800 26px/1.15 Unbounded, sans-serif; margin: 6px 0 10px; }
  p { margin: 0 0 14px; color: #3B3D5C; }
  pre { text-align: left; white-space: pre-wrap; background: #F6F5FB; border-radius: 12px; padding: 12px 14px; font: 500 14px/1.5 "DM Sans", sans-serif; margin: 0 0 16px; }
  a.btn { display: block; background: #FFC23D; color: #15172E; text-decoration: none; font: 700 17px "DM Sans", sans-serif; padding: 15px; border-radius: 14px; }
  .spin { width: 34px; height: 34px; border: 4px solid #E3E2EF; border-top-color: #3E9BFF; border-radius: 50%; margin: 10px auto 0; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div id="ok">
    <div class="big">🎉</div>
    <h1>¡Gracias! Pago recibido</h1>
    <p>Estamos preparando tu panel…</p>
    <div class="spin"></div>
  </div>
  <div id="manual" hidden>
    <div class="big">🎉</div>
    <h1>¡Gracias! Tu suscripción quedó hecha</h1>
    <p id="motivo">En menos de 24 h activamos tu web y te mandamos el link de tu panel por Instagram. Para ir más rápido, mandanos este mensaje:</p>
    <pre id="msg">Hola! Ya pagué la suscripción de mi web.</pre>
    <a class="btn" id="go" href="https://ig.me/m/dmith_app">Avisar por Instagram</a>
  </div>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get("preapproval_id") || q.get("preapproval-id") || q.get("id");
  let pedido = {}, m = "Hola! Ya pagué la suscripción de mi web.";
  try { pedido = JSON.parse(localStorage.getItem("dm-pedido-json") || "{}"); } catch (e) {}
  try { const p = localStorage.getItem("dm-pedido"); if (p) m = p.replace("Quiero activar mi web.", "Ya pagué la suscripción de mi web."); } catch (e) {}
  if (id) m += "\nCódigo de pago: " + id;
  const manual = (motivo) => {
    document.getElementById("ok").hidden = true; document.getElementById("manual").hidden = false;
    if (motivo) document.getElementById("motivo").textContent = motivo;
    document.getElementById("msg").textContent = m;
    document.getElementById("go").onclick = () => { try { navigator.clipboard.writeText(m); } catch (e) {} };
  };
  let cambio = null; try { cambio = JSON.parse(localStorage.getItem("dm-cambio-plan") || "null"); } catch (e) {}
  if (id && cambio && cambio.t) {
    try {
      const r = await fetch("/api/sitios/cambiar-plan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: cambio.t, preapproval_id: id }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      try { localStorage.removeItem("dm-cambio-plan"); } catch (e) {}
      return location.replace("/panel/?t=" + cambio.t);
    } catch (e) { m = "Hola! Me cambié al plan " + (cambio.plan || "") + " y ya pagué.\nCódigo de pago: " + id; return manual(); }
  }
  if (!id || !pedido.slug) return manual();
  try {
    const r = await fetch("/api/sitios/activar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ preapproval_id: id, ...pedido }) });
    const j = await r.json();
    if (!r.ok || !j.token) throw new Error(j.error);
    try { localStorage.setItem("dm-panel", j.token); localStorage.removeItem("dm-pedido-json"); } catch (e) {}
    location.replace("/panel/?t=" + j.token);
  } catch (e) { manual(); }
})();
</script>
</body>
</html>
