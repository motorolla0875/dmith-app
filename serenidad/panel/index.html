<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · SERenidad</title>
<meta name="theme-color" content="#3D1E57">
<link rel="icon" href="../icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #FBF7F2; --lavanda: #F3EAF8; --lila: #D9C4EA; --violeta: #6A3592; --ciruela: #3D1E57;
    --oro: #C9A15B; --oro2: #E4C68E; --texto: #3A2D45; --suave: #7A6B86; --linea: #E6DAEE; --rojo: #B3261E; --verde: #1E7A46;
    --titulo: "Cormorant Garamond", Georgia, serif; --cuerpo: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--crema); color: var(--texto); font: 400 16px/1.5 var(--cuerpo); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  h1, h2 { font-family: var(--titulo); color: var(--ciruela); margin: 0; line-height: 1.1; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }

  /* barra superior */
  .barra { position: sticky; top: 0; z-index: 10; background: var(--ciruela); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
  .barra .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  .barra img { height: 38px; width: auto; background: var(--crema); border-radius: 10px; padding: 3px 8px; }
  .barra b { font-weight: 500; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra a, .barra button { color: #fff; font-size: 14px; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

  /* entrar */
  .entrar { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; background: radial-gradient(circle at 15% 10%, #E3CFF2 0, transparent 45%), radial-gradient(circle at 90% 90%, #F5DDBF 0, transparent 45%), var(--crema); }
  .tarjeta-entrar { width: min(400px, 100%); background: #fff; border: 1px solid var(--linea); border-radius: 26px; padding: 30px 24px; box-shadow: 0 24px 50px rgba(61,30,87,.10); text-align: center; }
  .tarjeta-entrar img { height: 74px; width: auto; margin: 0 auto 16px; display: block; }
  .tarjeta-entrar h1 { font-size: 32px; }
  .tarjeta-entrar p { color: var(--suave); margin: 8px 0 20px; font-size: 15px; }
  .tarjeta-entrar input { text-align: center; letter-spacing: .08em; font-size: 18px; }

  /* formulario */
  main { padding-block: 18px 130px; }
  .hola { padding-block: 10px 16px; }
  .hola h1 { font-size: 30px; }
  .hola p { margin: 4px 0 0; color: var(--suave); font-size: 15px; }
  details.sec { background: #fff; border: 1px solid var(--linea); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary h2 { font-size: 23px; flex: 1; }
  details.sec > summary small { display: block; font: 400 13.5px var(--cuerpo); color: var(--suave); margin-top: 2px; }
  details.sec > summary::after { content: ""; width: 10px; height: 10px; border-right: 2px solid var(--violeta); border-bottom: 2px solid var(--violeta); transform: rotate(45deg); transition: transform .2s; flex: none; margin-right: 4px; }
  details.sec[open] > summary::after { transform: rotate(-135deg); }
  .cuerpo { padding: 0 18px 20px; display: grid; gap: 14px; }
  label.campo { display: grid; gap: 5px; font-size: 14px; font-weight: 500; color: var(--ciruela); min-width: 0; }
  label.campo em { font-style: normal; font-weight: 400; color: var(--suave); font-size: 13px; }
  input[type=text], input[type=number], input[type=tel], input[type=password], textarea { width: 100%; border: 1.5px solid var(--linea); background: var(--crema); border-radius: 12px; padding: 11px 13px; font-size: 16px; min-width: 0; }
  input:focus, textarea:focus { border-color: var(--violeta); outline: none; background: #fff; }
  textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .switch { display: flex; align-items: center; gap: 12px; font-weight: 500; color: var(--ciruela); cursor: pointer; padding: 10px 14px; background: var(--lavanda); border-radius: 14px; }
  .switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--lila); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked { background: var(--violeta); }
  .switch input:checked::after { transform: translateX(18px); }
  .ayuda { font-size: 13.5px; color: var(--suave); margin: -4px 0 0; }

  /* listas */
  .item { border: 1.5px solid var(--linea); border-radius: 16px; padding: 14px; display: grid; gap: 12px; background: #FDFBFE; }
  .item-cabeza { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--violeta); }
  .item-cabeza span { flex: 1; }
  .mini { border: 1px solid var(--linea); background: #fff; border-radius: 10px; width: 36px; height: 34px; cursor: pointer; display: grid; place-items: center; color: var(--suave); }
  .mini:hover { border-color: var(--violeta); color: var(--violeta); }
  .mini.borrar:hover { border-color: var(--rojo); color: var(--rojo); }
  .mini svg { width: 17px; height: 17px; }
  .agregar { border: 1.5px dashed var(--lila); background: transparent; color: var(--violeta); font-weight: 600; border-radius: 14px; padding: 12px; cursor: pointer; }
  .agregar:hover { background: var(--lavanda); }

  /* fotos */
  .foto-campo { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
  .foto-campo .vista { width: 96px; aspect-ratio: 3/4; border-radius: 12px; background: var(--lavanda) center/cover no-repeat; border: 1.5px dashed var(--lila); display: grid; place-items: center; font-size: 12px; color: var(--suave); text-align: center; padding: 6px; }
  .foto-campo .vista.con { border-style: solid; border-color: var(--linea); color: transparent; }
  .foto-campo .botones { display: flex; flex-wrap: wrap; gap: 8px; }
  .boton-sec { border: 1.5px solid var(--violeta); color: var(--violeta); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .boton-sec.quitar { border-color: var(--linea); color: var(--suave); }
  .foto-campo input[type=file] { display: none; }

  .dias { display: flex; flex-wrap: wrap; gap: 8px; }
  .dias label { display: flex; align-items: center; gap: 6px; background: var(--crema); border: 1.5px solid var(--linea); border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 14.5px; }
  .dias label:has(input:checked) { background: var(--violeta); border-color: var(--violeta); color: #fff; }
  .dias input { accent-color: var(--violeta); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 24px; font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none; }
  .btn-pri { background: var(--violeta); color: #fff; width: 100%; }
  .btn-pri:disabled { opacity: .6; cursor: default; }
  .error { color: var(--rojo); font-size: 14.5px; margin: 10px 0 0; min-height: 1.2em; }

  /* guardar fijo abajo */
  .pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(251,247,242,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pie .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
  .pie .estado { flex: 1; font-size: 14px; color: var(--suave); min-width: 0; }
  .pie .estado.ok { color: var(--verde); }
  .pie .estado.mal { color: var(--rojo); }
  .pie .btn { width: auto; padding-inline: 26px; }
  .aviso { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ciruela); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14.5px; z-index: 20; box-shadow: 0 12px 30px rgba(61,30,87,.3); max-width: calc(100% - 32px); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arriba" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-abajo" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-borrar" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- entrar con la clave -->
<section class="entrar" id="pantalla-entrar" hidden>
  <form class="tarjeta-entrar" id="form-entrar">
    <img src="../logo.png" alt="SERenidad">
    <h1>Tu panel</h1>
    <p>Escribí la clave que te pasamos para editar tu web.</p>
    <input type="text" id="clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx" aria-label="Clave" required>
    <p class="error" id="error-entrar"></p>
    <button class="btn btn-pri" id="boton-entrar">Entrar</button>
  </form>
</section>

<!-- editor -->
<div id="pantalla-panel" hidden>
  <div class="barra">
    <div class="wrap">
      <img src="../logo.png" alt="">
      <b>Panel de tu web</b>
      <a href="../" target="_blank" rel="noopener">Ver mi web</a>
      <button type="button" id="salir">Salir</button>
    </div>
  </div>
  <main class="wrap">
    <div class="hola">
      <h1 id="saludo">Hola</h1>
      <p>Tocá cada parte para abrirla, cambiá lo que quieras y después tocá <b>Guardar cambios</b>. La web se actualiza al instante.</p>
    </div>
    <div id="editor"></div>
  </main>
  <div class="pie">
    <div class="wrap">
      <span class="estado" id="estado">Sin cambios</span>
      <button class="btn btn-pri" id="guardar" disabled>Guardar cambios</button>
    </div>
  </div>
</div>
<div class="aviso" id="aviso" hidden></div>

<script src="../contenido.js"></script>
<script>
const SLUG = window.WEB_SLUG, API = "/api/sitios/web/";
const $ = id => document.getElementById(id);
const CLAVE_T = "panel-" + SLUG;
let T = null, C = null, sucio = false;
try { T = localStorage.getItem(CLAVE_T); } catch (e) {}

async function api(ruta, datos) {
  const r = await fetch(API + ruta, datos ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) } : { cache: "no-store" });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { cerrarSesion("Tu sesión venció. Entrá de nuevo con tu clave."); throw new Error(j.error || "Entrá de nuevo"); }
  if (r.status === 413) throw new Error("Es demasiado pesado. Probá con una foto más chica.");
  if (!r.ok) throw new Error(j.error || "No se pudo conectar. Revisá tu internet.");
  return j;
}
function mezclar(base, extra) {
  if (Array.isArray(base) || Array.isArray(extra)) return extra !== undefined ? JSON.parse(JSON.stringify(extra)) : JSON.parse(JSON.stringify(base));
  if (base && typeof base === "object" && extra && typeof extra === "object") { const r = { ...base }; for (const k in extra) r[k] = mezclar(base[k], extra[k]); return r; }
  if (base && typeof base === "object" && (extra === undefined || extra === null)) return JSON.parse(JSON.stringify(base));
  return extra !== undefined && extra !== null ? extra : base;
}
let avisoT;
function aviso(t) { const a = $("aviso"); a.textContent = t; a.hidden = false; clearTimeout(avisoT); avisoT = setTimeout(() => a.hidden = true, 3500); }
function cambio() { sucio = true; $("guardar").disabled = false; const e = $("estado"); e.textContent = "Tenés cambios sin guardar"; e.className = "estado"; }

// ---------- pantallas ----------
function cerrarSesion(msj) {
  T = null; try { localStorage.removeItem(CLAVE_T); } catch (e) {}
  $("pantalla-panel").hidden = true; $("pantalla-entrar").hidden = false;
  $("error-entrar").textContent = msj || "";
}
$("form-entrar").onsubmit = async e => {
  e.preventDefault();
  const b = $("boton-entrar"); b.disabled = true; $("error-entrar").textContent = "";
  try {
    const j = await api("entrar", { slug: SLUG, clave: $("clave").value });
    T = j.t; try { localStorage.setItem(CLAVE_T, T); } catch (e) {}
    $("clave").value = ""; await abrir();
  } catch (er) { $("error-entrar").textContent = er.message; }
  b.disabled = false;
};
$("salir").onclick = () => { if (sucio && !confirmar("salir")) return; cerrarSesion(); };
let ultimoConfirmar = 0, ultimoQue = "";
function confirmar(que) { // sin ventanas emergentes: se toca dos veces
  if (ultimoQue === que && Date.now() - ultimoConfirmar < 4000) return true;
  ultimoQue = que; ultimoConfirmar = Date.now();
  aviso("Tenés cambios sin guardar. Tocá de nuevo para salir igual.");
  return false;
}
async function abrir() {
  let guardado = {};
  try { guardado = await api("contenido?slug=" + SLUG); } catch (e) { aviso(e.message); }
  C = mezclar(window.CONTENIDO_BASE, guardado || {});
  delete C.guardado;
  $("pantalla-entrar").hidden = true; $("pantalla-panel").hidden = false;
  $("saludo").textContent = "Hola" + (C.contacto.persona ? ", " + C.contacto.persona : "");
  dibujar();
  sucio = false; $("guardar").disabled = true;
  $("estado").textContent = guardado && guardado.guardado ? "Última vez guardado: " + new Date(guardado.guardado).toLocaleString("es-AR", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "Sin cambios";
  $("estado").className = "estado";
}

// ---------- piezas del formulario ----------
function el(tag, props, ...hijos) {
  const e = document.createElement(tag);
  for (const k in props || {}) { if (k === "class") e.className = props[k]; else if (k === "html") e.innerHTML = props[k]; else if (k.startsWith("on")) e[k] = props[k]; else e.setAttribute(k, props[k]); }
  hijos.flat().forEach(h => h != null && e.append(h));
  return e;
}
function texto(obj, k, etiqueta, opc = {}) {
  const inp = opc.largo ? el("textarea", { rows: opc.filas || 3 }) : el("input", { type: opc.tipo === "tel" ? "tel" : "text" });
  if (opc.tipo === "number") inp.setAttribute("inputmode", "numeric");
  inp.value = opc.tipo === "number" ? (obj[k] ? Number(obj[k]).toLocaleString("es-AR") : "") : (obj[k] == null ? "" : obj[k]);
  if (opc.ph) inp.placeholder = opc.ph;
  inp.oninput = () => {
    if (opc.tipo === "number") { const n = parseInt(inp.value.replace(/\D/g, ""), 10); obj[k] = isNaN(n) ? 0 : n; }
    else obj[k] = inp.value;
    cambio(); if (opc.alCambiar) opc.alCambiar();
  };
  if (opc.tipo === "number") inp.onblur = () => { inp.value = obj[k] ? Number(obj[k]).toLocaleString("es-AR") : ""; };
  return el("label", { class: "campo" }, el("span", {}, etiqueta, opc.nota ? el("em", {}, " · " + opc.nota) : null), inp);
}
function interruptor(obj, k, etiqueta, alCambiar) {
  const inp = el("input", { type: "checkbox" }); inp.checked = !!obj[k];
  inp.onchange = () => { obj[k] = inp.checked; cambio(); if (alCambiar) alCambiar(inp.checked); };
  return el("label", { class: "switch" }, inp, el("span", {}, etiqueta));
}
const fila = (...h) => el("div", { class: "fila" }, h);
const ayuda = t => el("p", { class: "ayuda" }, t);

// achica la foto en el teléfono antes de subirla (para que suba rápido)
function achicar(archivo, max = 1600) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(archivo), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const f = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * f); h = Math.round(h * f);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = .84, d = cv.toDataURL("image/jpeg", q);
      while (d.length > 900000 && q > .45) { q -= .08; d = cv.toDataURL("image/jpeg", q); }
      if (d.length > 900000) return achicar(archivo, Math.round(max * .75)).then(ok, no);
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("Esa imagen no se pudo abrir. Probá con una foto JPG o PNG.")); };
    img.src = url;
  });
}
const srcFoto = f => !f ? "" : f.startsWith("/") ? f : "../" + f;
function foto(obj, k, etiqueta, opc = {}) {
  const vista = el("div", { class: "vista" });
  const pintar = () => { const s = srcFoto(obj[k]); vista.style.backgroundImage = s ? `url("${s}")` : ""; vista.classList.toggle("con", !!s); vista.textContent = s ? "" : (opc.vacia || "Sin foto"); quitar.hidden = !obj[k] || !opc.quitable; };
  const archivo = el("input", { type: "file", accept: "image/*" });
  const subir = el("button", { type: "button", class: "boton-sec", onclick: () => archivo.click() }, obj[k] ? "Cambiar foto" : "Subir foto");
  const quitar = el("button", { type: "button", class: "boton-sec quitar", onclick: () => { obj[k] = ""; cambio(); pintar(); subir.textContent = "Subir foto"; } }, "Quitar");
  archivo.onchange = async () => {
    const a = archivo.files[0]; archivo.value = ""; if (!a) return;
    subir.disabled = true; subir.textContent = "Subiendo…";
    try {
      const data = await achicar(a);
      const j = await api("foto", { slug: SLUG, t: T, data });
      obj[k] = j.url; cambio(); pintar(); aviso("Foto lista. Acordate de guardar los cambios.");
    } catch (e) { aviso(e.message); }
    subir.disabled = false; subir.textContent = obj[k] ? "Cambiar foto" : "Subir foto";
  };
  pintar();
  return el("div", { class: "campo" }, el("label", { class: "campo" }, etiqueta),
    el("div", { class: "foto-campo" }, vista, el("div", { class: "botones" }, subir, quitar, archivo)));
}
// lista de cosas que se pueden agregar, borrar y ordenar
function lista(arr, nombre, nuevo, armarItem, opc = {}) {
  const caja = el("div", { style: "display:grid;gap:12px" });
  const redibujar = () => {
    caja.innerHTML = "";
    arr.forEach((it, i) => {
      const mover = (d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; cambio(); redibujar(); };
      const cab = el("div", { class: "item-cabeza" }, el("span", {}, nombre + " " + (i + 1)),
        el("button", { type: "button", class: "mini", title: "Subir", "aria-label": "Subir", onclick: () => mover(-1), html: '<svg><use href="#i-arriba"/></svg>' }),
        el("button", { type: "button", class: "mini", title: "Bajar", "aria-label": "Bajar", onclick: () => mover(1), html: '<svg><use href="#i-abajo"/></svg>' }),
        el("button", { type: "button", class: "mini borrar", title: "Borrar", "aria-label": "Borrar", onclick: () => { arr.splice(i, 1); cambio(); redibujar(); }, html: '<svg><use href="#i-borrar"/></svg>' }));
      caja.append(el("div", { class: "item" }, cab, armarItem(it, i)));
    });
    if (!opc.max || arr.length < opc.max) caja.append(el("button", { type: "button", class: "agregar", onclick: () => { arr.push(nuevo()); cambio(); redibujar(); } }, "+ Agregar " + nombre.toLowerCase()));
  };
  redibujar();
  return caja;
}
function seccion(titulo, sub, ...hijos) {
  return el("details", { class: "sec" }, el("summary", {}, el("h2", {}, titulo, el("small", {}, sub))), el("div", { class: "cuerpo" }, hijos));
}
function cabeza(nombreSec) {
  const s = C.secciones[nombreSec];
  return [texto(s, "rotulo", "Texto chico de arriba"), fila(texto(s, "titulo", "Título"), texto(s, "titulo2", "Título, parte en violeta")), texto(s, "texto", "Texto debajo del título", { largo: true, filas: 2 })];
}

// ---------- todo el formulario ----------
function dibujar() {
  const k = C.contacto, h = C.inicio, pr = C.promo;
  C.secciones = C.secciones || {};
  const ed = $("editor"); ed.innerHTML = "";
  ed.append(
    seccion("Tus datos", "WhatsApp, dirección, Instagram",
      fila(texto(k, "persona", "Tu nombre", { nota: "va en los mensajes" }), texto(k, "nombre_completo", "Nombre completo")),
      texto(k, "profesion", "Profesión"),

function diasCerrados() {
  C.agenda = C.agenda || { cerrado: [] };
  const nombres = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  return el("div", { class: "dias" }, [1, 2, 3, 4, 5, 6, 0].map(d => {
    const inp = el("input", { type: "checkbox" }); inp.checked = C.agenda.cerrado.includes(d);
    inp.onchange = () => { C.agenda.cerrado = C.agenda.cerrado.filter(x => x !== d); if (inp.checked) C.agenda.cerrado.push(d); cambio(); };
    return el("label", {}, inp, nombres[d]);
  }));
}

// ---------- guardar ----------
$("guardar").onclick = async () => {
  const b = $("guardar"), e = $("estado");
  if (C.agenda && C.agenda.cerrado.length >= 7) { aviso("Dejá al menos un día de atención en Turnos."); return; }
  b.disabled = true; b.textContent = "Guardando…";
  try {
    const j = await api("guardar", { slug: SLUG, t: T, c: C });
    sucio = false; e.textContent = "Guardado. Tu web ya está actualizada."; e.className = "estado ok";
    b.textContent = "Guardar cambios";
  } catch (er) {
    e.textContent = er.message; e.className = "estado mal"; b.disabled = false; b.textContent = "Guardar cambios";
  }
};
window.addEventListener("beforeunload", ev => { if (sucio) { ev.preventDefault(); ev.returnValue = ""; } });

if (T) abrir(); else cerrarSesion();
