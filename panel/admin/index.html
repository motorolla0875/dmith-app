<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis clientes · dmith Sitios</title><meta name="robots" content="noindex">
<style>
  :root { --ink: #15172E; --paper: #F6F5FB; --line: #E3E2EF; --mute: #6A6C8A; --blue: #3E9BFF; --sun: #FFC23D; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 16px/1.5 system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  header { background: #181B4A; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 20px; } header .s { color: #C9CAEE; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0 0 12px; }
  h2 { font-size: 17px; margin: 4px 0 10px; }
  .s { font-size: 14px; color: var(--mute); }
  .t { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
  .authorized { background: #DDF8EE; color: #0E7A58; } .pending { background: #FFF1D1; color: #8A5A00; } .paused, .cancelled { background: #FFE1E5; color: #A8192E; }
  .n { background: #FF5A6E; color: #fff; } .p { background: #FFF1D1; color: #8A5A00; }
  .cli summary { cursor: pointer; list-style: none; } .cli summary::-webkit-details-marker { display: none; }
  .cli summary b { font-size: 17px; }
  .tarea { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .tarea input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
  .tarea.hecha span { text-decoration: line-through; color: var(--mute); }
  .chat { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; margin: 8px 0; background: var(--paper); border-radius: 12px; padding: 10px; }
  .b { max-width: 82%; padding: 7px 11px; border-radius: 14px; font-size: 15px; white-space: pre-wrap; background: #fff; align-self: flex-start; }
  .b.yo { align-self: flex-end; background: var(--blue); color: #fff; }
  .b small { display: block; font-size: 11px; opacity: .6; }
  .send { display: flex; gap: 8px; } textarea { flex: 1; font: inherit; padding: 9px 11px; border: 2px solid var(--line); border-radius: 10px; resize: vertical; }
  input[type=password] { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); }
  button { font: 700 15px system-ui, sans-serif; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--sun); cursor: pointer; }
  button.l { background: #fff; border: 2px solid var(--line); }
  .dom { margin: 8px 0; padding: 10px 12px; background: #FFF6E5; border-radius: 10px; font-size: 15px; }
  .sec { font-weight: 700; margin: 12px 0 4px; font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  [hidden] { display: none !important; }
</style></head><body>
<header><h1>Mis clientes · dmith Sitios</h1><div class="s" id="tot"></div></header>
<main>
  <div class="card" id="login"><p>Clave (la línea ADMIN_KEY del archivo .env del servidor):</p><input id="k" type="password"> <button id="entrar">Entrar</button></div>
  <div class="card" id="herr" hidden><button class="l" id="nueva-prueba">+ Crear cliente de prueba</button> <span class="s">Para probar mensajes y pedidos. No cobra nada.</span></div>
  <div class="card" id="hoy" hidden><h2>Para hacer hoy</h2><div id="pend"></div></div>
  <div id="lista"></div>
</main>
<script>
const $ = (i) => document.getElementById(i);
let k = ""; try { k = localStorage.getItem("dm-admin") || ""; } catch (e) {}
let abiertos = new Set();
const f = (s) => s ? new Date(s).toLocaleDateString("es-AR") : "—";
const h = (s) => new Date(s).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function post(r, b) { const x = await fetch(r, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k, ...b }) }); if (!x.ok) throw new Error((await x.json()).error); }

async function cargar() {
  const r = await fetch("/api/sitios/admin?k=" + encodeURIComponent(k));
  if (!r.ok) { $("login").hidden = false; return; }
  try { localStorage.setItem("dm-admin", k); } catch (e) {}
  $("login").hidden = true;
  const l = await r.json();
  const act = l.filter((c) => c.estado === "authorized");
  $("tot").textContent = act.length + " activos · $" + act.reduce((a, c) => a + (c.monto || 0), 0).toLocaleString("es-AR") + " por mes";

  // pendientes de todos los clientes
  const pend = [];
  l.forEach((c) => {
    (c.tareas || []).filter((t) => !t.hecha).forEach((t) => pend.push(`<div class="tarea"><input type="checkbox" data-id="${c.id}" data-t="${t.id}"><span><b>${esc(c.negocio)}:</b> ${esc(t.texto)} <span class="s">· ${f(t.fecha)}</span></span></div>`));
    if (c.dominio_estado === "revisar") pend.push(`<div class="tarea"><span>🌐 <b>${esc(c.negocio)}:</b> conectar dominio ${esc(c.dominio)} en el servidor</span></div>`);
    if (c.admin_sin_leer) pend.push(`<div class="tarea"><span>💬 <b>${esc(c.negocio)}:</b> ${c.admin_sin_leer} mensaje(s) sin leer</span></div>`);
  });
  $("hoy").hidden = false; $("herr").hidden = false;
  $("pend").innerHTML = pend.join("") || '<p class="s">Nada pendiente. 🎉</p>';

  $("lista").innerHTML = l.map((c) => {
    const pt = (c.tareas || []).filter((t) => !t.hecha).length;
    return `<details class="card cli" data-id="${c.id}" ${abiertos.has(c.id) ? "open" : ""}>
    <summary><b>${esc(c.negocio)}</b><span class="t ${c.estado}">${c.estado === "authorized" ? "activo" : c.estado}</span>${c.admin_sin_leer ? `<span class="t n">${c.admin_sin_leer} nuevo</span>` : ""}${pt ? `<span class="t p">${pt} pendiente</span>` : ""}
      <div class="s">${c.plan || ""} · $${(c.monto || 0).toLocaleString("es-AR")}/mes · próximo cobro ${f(c.proximo_cobro)}</div></summary>
    ${c.prueba ? `<div class="dom">🧪 Cliente de prueba · <a href="/panel/?t=${c.token}" target="_blank"><b>Abrir su panel (como lo ve el cliente)</b></a> · <button class="l" data-borrar="${c.id}">Borrar</button></div>` : ""}
    <div class="s"><a href="/${c.slug}/" target="_blank">dmith.app/${c.slug}</a> · ${esc(c.email || "")} · cliente desde ${f(c.alta)}</div>
    ${c.dominio ? `<div class="dom">🌐 Dominio: <b>${esc(c.dominio)}</b> · ${({ falta_conectar: "todavía no lo conectó", comprando: "lo está comprando", revisar: "⚠ avisó que lo conectó: hay que activarlo en el servidor", listo: "✅ conectado" })[c.dominio_estado] || c.dominio_estado}
      ${c.dominio_estado === "revisar" ? `<div style="margin-top:6px"><button class="l" data-dom="${c.id}">Ya lo activé</button></div>` : ""}</div>` : ""}
    <div class="sec">Pedidos de cambio</div>
    ${(c.tareas || []).map((t) => `<div class="tarea${t.hecha ? " hecha" : ""}"><input type="checkbox" ${t.hecha ? "checked" : ""} data-id="${c.id}" data-t="${t.id}"><span>${esc(t.texto)} <span class="s">· ${f(t.fecha)}</span></span></div>`).join("") || '<p class="s">Sin pedidos.</p>'}
    <div class="sec">Mensajes</div>
    <div class="chat">${(c.mensajes || []).map((m) => `<div class="b ${m.de === "cliente" ? "" : "yo"}">${esc(m.texto)}<small>${h(m.fecha)}</small></div>`).join("") || '<p class="s">Sin mensajes.</p>'}</div>
    <div class="send"><textarea rows="2" placeholder="Responder a ${esc(c.negocio)}…"></textarea><button data-resp="${c.id}">Enviar</button></div>
  </details>`; }).join("") || '<div class="card"><p class="s">Todavía no hay clientes.</p></div>';
  document.querySelectorAll(".chat").forEach((x) => x.scrollTop = 1e9);
}

document.addEventListener("change", async (e) => {
  const el = e.target; if (!el.dataset.t) return;
  try { await post("/api/sitios/admin/tarea", { id: el.dataset.id, tarea: el.dataset.t, hecha: el.checked }); } catch (er) { el.checked = !el.checked; }
  cargar();
});
document.addEventListener("click", async (e) => {
  const b = e.target;
  if (b.dataset.resp) {
    const ta = b.parentElement.querySelector("textarea"); if (!ta.value.trim()) return ta.focus();
    b.disabled = true; try { await post("/api/sitios/admin/mensaje", { id: b.dataset.resp, texto: ta.value }); } catch (er) {} cargar();
  }
  if (b.dataset.borrar) { await post("/api/sitios/admin/borrar", { id: b.dataset.borrar }).catch(() => {}); cargar(); }
  if (b.id === "nueva-prueba") { await post("/api/sitios/admin/prueba", {}).catch(() => {}); abiertos.clear(); await cargar(); const d = document.querySelector("details.cli"); if (d) { d.open = true; } }
  if (b.dataset.dom) { await post("/api/sitios/admin/dominio", { id: b.dataset.dom }).catch(() => {}); cargar(); }
});
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!d.classList || !d.classList.contains("cli")) return;
  if (d.open) { abiertos.add(d.dataset.id); if (d.querySelector(".t.n")) post("/api/sitios/admin/leido", { id: d.dataset.id }).catch(() => {}); }
  else abiertos.delete(d.dataset.id);
}, true);
$("entrar").onclick = () => { k = $("k").value.trim(); cargar(); };
if (k) cargar();
setInterval(() => { if (k && !document.activeElement.matches("textarea")) cargar(); }, 60000);
</script></body></html>
