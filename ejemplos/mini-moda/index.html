<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Moda · Sitio pausado</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFF7F2; color: #3A2A33; font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
  main { max-width: 440px; }
  img { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 28px; margin: 0 0 10px; }
  p { margin: 0; color: #7A6670; }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="Mini Moda">
  <h1>Sitio temporalmente pausado</h1>
  <p>Estamos haciendo unos ajustes. Muy pronto vuelve a estar disponible.</p>
</main>
<script>
  // si alguien la tenía instalada en el celu, se borra la copia guardada para que vea este aviso
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
