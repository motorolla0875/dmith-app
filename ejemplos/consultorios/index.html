<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultorios Drucaroff · Sitio pausado</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F4F2; color: #222; font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
  main { max-width: 460px; background: #fff; border: 2px solid #E0A100; border-radius: 18px; padding: 32px 26px; }
  img { width: 88px; height: 88px; object-fit: contain; margin: 0 auto 16px; display: block; }
  .aviso { display: inline-block; background: #FFF3CC; color: #7A5500; font-weight: 700; border-radius: 999px; padding: 4px 14px; font-size: 14px; margin-bottom: 14px; }
  h1 { font-size: 27px; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 22px; color: #555; }
  a { display: inline-block; background: #1FA855; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 24px; border-radius: 12px; }
  a:focus-visible { outline: 3px solid #222; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  
  <span class="aviso">Sitio pausado</span>
  <h1>Este sitio está pausado</h1>
  <p>Para restaurarlo, comunicate con nosotros y lo volvemos a activar.</p>
  <a href="https://wa.me/5491150540357?text=Hola%21%20Quiero%20restaurar%20mi%20sitio%3A%20https%3A//dmith.app/ejemplos/consultorios/">Comunicarme para restaurar</a>
</main>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
